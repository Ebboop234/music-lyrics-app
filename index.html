<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#111111">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
<meta name="apple-mobile-web-app-title"
      content="Music Lyrics">

<title>Music Lyrics</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #080808;
    }

    body {
        padding:
            env(safe-area-inset-top)
            16px
            env(safe-area-inset-bottom)
            16px;

        color: white;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Arial,
            sans-serif;

        text-align: center;

        overflow-x: hidden;
    }

    .app {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 26px 0 6px;

        font-size: 32px;
        font-weight: 700;

        letter-spacing: -1px;
    }

    .subtitle {
        color: #888;
        font-size: 14px;
        margin-bottom: 20px;
    }

    /* =========================
       IDENTIFY BUTTON
    ========================= */

    .identify-button {

        width: 92px;
        height: 92px;

        margin: 18px auto 18px;

        border-radius: 50%;

        border: 3px solid white;

        background:
            rgba(255,255,255,0.04);

        color: white;

        font-size: 48px;
        font-weight: 500;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
            transform .2s ease;

        -webkit-tap-highlight-color:
            transparent;
    }

    .identify-button:active {
        transform: scale(.92);
    }

    .identify-button.listening {

        animation:
            rainbowPulse 1s infinite;
    }

    @keyframes rainbowPulse {

        0% {
            transform: scale(1);
            border-color: #ff0000;
            box-shadow:
                0 0 12px #ff0000,
                0 0 25px rgba(255,0,0,.4);
        }

        16% {
            border-color: #ff7f00;
            box-shadow:
                0 0 18px #ff7f00,
                0 0 35px rgba(255,127,0,.4);
        }

        33% {
            border-color: #ffff00;
            box-shadow:
                0 0 22px #ffff00,
                0 0 40px rgba(255,255,0,.4);
        }

        50% {
            transform: scale(1.15);
            border-color: #00ff00;
            box-shadow:
                0 0 28px #00ff00,
                0 0 50px rgba(0,255,0,.45);
        }

        66% {
            border-color: #00ffff;
            box-shadow:
                0 0 22px #00ffff,
                0 0 40px rgba(0,255,255,.4);
        }

        83% {
            border-color: #0066ff;
            box-shadow:
                0 0 20px #0066ff,
                0 0 35px rgba(0,102,255,.4);
        }

        100% {
            transform: scale(1);
            border-color: #ff00ff;
            box-shadow:
                0 0 15px #ff00ff,
                0 0 30px rgba(255,0,255,.4);
        }
    }

    /* =========================
       STATUS
    ========================= */

    #status {

        min-height: 24px;

        margin: 8px auto 15px;

        max-width: 95%;

        color: #999;

        font-size: 15px;

        line-height: 1.4;
    }

    /* =========================
       DEBUG
    ========================= */

    #debug {

        display: none;

        margin: 15px auto;

        padding: 12px;

        max-width: 95%;

        background: #1c1c1c;

        border: 1px solid #444;

        border-radius: 12px;

        color: #ff7777;

        font-family: monospace;

        font-size: 12px;

        text-align: left;

        white-space: pre-wrap;

        word-break: break-word;
    }

    /* =========================
       ALBUM ART
    ========================= */

    #album-art-container {

        width: 190px;
        height: 190px;

        margin: 18px auto 16px;

        display: none;
    }

    #album-art {

        width: 100%;
        height: 100%;

        object-fit: cover;

        border-radius: 20px;

        box-shadow:
            0 12px 40px
            rgba(0,0,0,.6);
    }

    /* =========================
       SONG
    ========================= */

    #song {

        margin: 12px auto 15px;

        max-width: 92%;

        font-size: 21px;

        font-weight: 600;

        line-height: 1.35;
    }

    /* =========================
       LYRICS
    ========================= */

    #lyrics {

        width: 100%;

        max-width: 700px;

        height: 58vh;

        min-height: 300px;

        overflow-y: auto;

        margin: 10px auto;

        padding:
            100px 8px
            160px 8px;

        font-size: 22px;

        line-height: 1.65;

        scroll-behavior: smooth;

        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar {
        display: none;
    }

    /* =========================
       LYRIC LINE
    ========================= */

    .line {

        opacity: .32;

        padding: 10px 12px;

        margin: 3px 0;

        border-radius: 14px;

        cursor: pointer;

        transition:
            opacity .25s ease,
            transform .25s ease,
            background .25s ease,
            font-size .25s ease;

        -webkit-tap-highlight-color:
            transparent;
    }

    .line:active {

        transform: scale(.97);

        background:
            rgba(255,255,255,.10);
    }

    .line.current {

        opacity: 1;

        font-size: 31px;

        font-weight: 700;

        background:
            rgba(255,255,255,.07);

        transform: scale(1.02);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

        h1 {
            margin-top: 22px;
            font-size: 29px;
        }

        .identify-button {
            width: 88px;
            height: 88px;
            font-size: 46px;
        }

        #album-art-container {
            width: 165px;
            height: 165px;
        }

        #song {
            font-size: 19px;
        }

        #lyrics {

            height: 60vh;

            font-size: 21px;
        }

        .line.current {
            font-size: 28px;
        }
    }

</style>

</head><body><div class="app"><h1>🎵 Music Lyrics</h1>

<div class="subtitle">
    Identify a song and follow along
</div>

<button
    class="identify-button"
    id="identifyButton"
    onclick="identifySong()"
    aria-label="Identify Song">

    ?

</button>

<div id="status">
    Tap the button to identify a song
</div>

<div id="debug"></div>

<div id="album-art-container">

    <img
        id="album-art"
        alt="Album artwork"
    >

</div>

<div id="song"></div>

<div id="lyrics"></div>

</div><script>

/* =========================================================
   VARIABLES
========================================================= */

let lyricLines = [];

let currentIndex = 0;

let syncTimer = null;

let songPosition = 0;

let recognitionTime = 0;


/*
 * Small adjustment to account for the recording/
 * recognition process.
 *
 * Positive = lyrics move forward.
 * Negative = lyrics move backward.
 */
const LYRIC_OFFSET = 0;


/* =========================================================
   DEBUG
========================================================= */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =========================================================
   IDENTIFY SONG
========================================================= */

async function identifySong() {

    const button =
        document.getElementById(
            "identifyButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const songDisplay =
        document.getElementById(
            "song"
        );

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );

    const albumContainer =
        document.getElementById(
            "album-art-container"
        );

    const albumArt =
        document.getElementById(
            "album-art"
        );


    clearInterval(syncTimer);

    lyricLines = [];

    currentIndex = 0;

    songPosition = 0;

    recognitionTime = 0;


    document.getElementById(
        "debug"
    ).style.display = "none";


    button.classList.add(
        "listening"
    );


    status.innerText =
        "🎧 Listening for 8 seconds...";


    songDisplay.innerText = "";

    lyricsDisplay.innerHTML = "";

    albumContainer.style.display =
        "none";

    albumArt.src = "";


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );
        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(
                    stream
                );


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        recorder.onerror =
            event => {

                console.error(
                    "Recorder error:",
                    event
                );
            };


        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Identifying song...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;
                }


                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method:
                                    "POST",
                                body:
                                    formData
                            }
                        );


                    const responseText =
                        await response.text();


                    let data;


                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    } catch (error) {

                        showDebug(
                            "SERVER RETURNED INVALID DATA\n\n" +
                            responseText.substring(
                                0,
                                2000
                            )
                        );

                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        showDebug(
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ " +
                            (
                                data.error ||
                                "Server error."
                            );

                        return;
                    }


                    if (
                        data.error
                    ) {

                        showDebug(
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ " +
                            data.error;

                        return;
                    }


                    if (
                        !data.song
                    ) {

                        showDebug(
                            "Song information missing.\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ Song information missing.";

                        return;
                    }


                    /* =================================================
                       SONG INFORMATION
                    ================================================= */

                    const title =
                        data.song.title ||
                        data.song.trackName ||
                        data.song.name ||
                        "Unknown Song";


                    const artist =
                        data.song.artist ||
                        data.song.artistName ||
                        "Unknown Artist";


                    songDisplay.innerText =
                        title +
                        " — " +
                        artist;


                    /* =================================================
                       ALBUM ART
                    ================================================= */

                    const artwork =
                        data.song.artwork ||
                        data.song.artworkUrl ||
                        data.song.artwork_url ||
                        data.song.albumArt ||
                        data.song.albumArtwork ||
                        data.song.cover ||
                        data.song.coverUrl ||
                        data.song.image ||
                        data.song.imageUrl ||
                        data.artwork ||
                        data.artworkUrl ||
                        data.albumArt ||
                        data.albumArtwork ||
                        null;


                    if (artwork) {

                        albumArt.onload =
                            () => {

                                albumContainer.style.display =
                                    "block";
                            };


                        albumArt.onerror =
                            () => {

                                albumContainer.style.display =
                                    "none";

                                console.log(
                                    "Album artwork could not be loaded."
                                );
                            };


                        albumArt.src =
                            artwork;

                    } else {

                        albumContainer.style.display =
                            "none";
                    }


                    /* =================================================
                       SONGREC MATCH POSITION
                    ================================================= */

                    let matchOffset =
                        data.song.matchOffset;


                    if (
                        matchOffset === undefined ||
                        matchOffset === null
                    ) {

                        matchOffset =
                            data.matchOffset;
                    }


                    songPosition =
                        Number(
                            matchOffset
                        );


                    if (
                        !Number.isFinite(
                            songPosition
                        )
                    ) {

                        songPosition = 0;
                    }


                    /*
                     * SongRec's matchOffset is the approximate
                     * position in the actual song where the
                     * recording was recognized.
                     */

                    songPosition +=
                        LYRIC_OFFSET;


                    console.log(
                        "SongRec match position:",
                        songPosition
                    );


                    /* =================================================
                       GET LYRICS
                    ================================================= */

                    const lyrics =
                        data.lyrics ||
                        {};


                    /*
                     * Server may provide syncedLyrics
                     * directly.
                     */

                    let syncedLyrics =
                        lyrics.syncedLyrics ||
                        data.syncedLyrics ||
                        data.lyricsText ||
                        null;


                    /*
                     * Sometimes the server returns
                     * a nested result.
                     */

                    if (
                        !syncedLyrics &&
                        lyrics.data
                    ) {

                        syncedLyrics =
                            lyrics.data.syncedLyrics;
                    }


                    if (
                        !syncedLyrics
                    ) {

                        status.innerText =
                            "⚠️ No synchronized lyrics found.";

                        return;
                    }


                    /* =================================================
                       PARSE TIMESTAMPED LYRICS
                    ================================================= */

                    const success =
                        parseLyrics(
                            syncedLyrics
                        );


                    if (!success) {

                        showDebug(
                            "Could not read lyric timestamps.\n\n" +
                            String(
                                syncedLyrics
                            ).substring(
                                0,
                                5000
                            )
                        );

                        status.innerText =
                            "⚠️ Could not read lyric timestamps.";

                        return;
                    }


                    /*
                     * Find the lyric that should be
                     * playing at SongRec's match position.
                     */

                    currentIndex =
                        findCurrentLyric(
                            songPosition
                        );


                    updateCurrentLine(
                        songPosition
                    );


                    status.innerText =
                        "🎵 Synced!";


                    /*
                     * Start the visual lyric clock.
                     */

                    startSynchronization();

                } catch (error) {

                    console.error(
                        error
                    );

                    showDebug(
                        "CONNECTION ERROR\n\n" +
                        error.message
                    );

                    status.innerText =
                        "❌ " +
                        error.message;
                }
            };


        recorder.start();


        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();
                }

            },
            8000
        );

    } catch (error) {

        button.classList.remove(
            "listening"
        );

        showDebug(
            "MICROPHONE ERROR\n\n" +
            error.message
        );

        status.innerText =
            "❌ " +
            error.message;
    }
}


/* =========================================================
   PARSE LYRICS
========================================================= */

function parseLyrics(text) {

    lyricLines = [];


    if (
        typeof text !== "string"
    ) {

        return false;
    }


    /*
     * IMPORTANT:
     *
     * Your server is currently returning lyrics
     * like this:
     *
     * [00:00.84] Lately...
     * [00:04.91] Dreaming...
     *
     * This parser works even if multiple lines
     * accidentally arrive on the same physical line.
     */


    const regex =
        /(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\s*([^\[]*)/g;


    let match;


    while (
        (match = regex.exec(text)) !== null
    ) {

        const minutes =
            parseInt(
                match[1],
                10
            );


        const seconds =
            parseInt(
                match[2],
                10
            );


        let fraction =
            match[3] || "0";


        /*
         * Convert milliseconds/centiseconds
         * correctly.
         *
         * .8   = 800 ms
         * .84  = 840 ms
         * .840 = 840 ms
         */

        let fractionSeconds;


        if (
            fraction.length === 1
        ) {

            fractionSeconds =
                parseInt(
                    fraction,
                    10
                ) / 10;

        } else if (
            fraction.length === 2
        ) {

            fractionSeconds =
                parseInt(
                    fraction,
                    10
                ) / 100;

        } else {

            fractionSeconds =
                parseInt(
                    fraction,
                    10
                ) / 1000;
        }


        const time =
            minutes * 60 +
            seconds +
            fractionSeconds;


        const lyricText =
            match[4]
                .trim();


        /*
         * Don't display empty timestamp lines.
         */

        if (
            lyricText.length === 0
        ) {

            continue;
        }


        /*
         * Don't display the title line
         * if it happens to be timestamped.
         */

        if (
            lyricLines.length === 0 &&
            lyricText.includes(" - ")
        ) {

            continue;
        }


        lyricLines.push({

            time:
                time,

            text:
                lyricText
        });
    }


    /*
     * Sort just in case the server
     * returned lines out of order.
     */

    lyricLines.sort(
        (a, b) =>
            a.time - b.time
    );


    if (
        lyricLines.length === 0
    ) {

        return false;
    }


    showLyrics();


    console.log(
        "Parsed lyric lines:",
        lyricLines.length
    );


    return true;
}


/* =========================================================
   FIND CURRENT LYRIC
========================================================= */

function findCurrentLyric(time) {

    if (
        lyricLines.length === 0
    ) {

        return 0;
    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        } else {

            break;
        }
    }


    return index;
}


/* =========================================================
   SHOW LYRICS
========================================================= */

function showLyrics() {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML =
        "";


    lyricLines.forEach(
        (line, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            /*
             * Only the lyric text is displayed.
             * NO timestamp is shown.
             */

            div.innerText =
                line.text;


            div.onclick =
                () => {

                    syncToLyric(
                        index
                    );
                };


            lyricsDisplay.appendChild(
                div
            );
        }
    );
}


/* =========================================================
   TAP A LYRIC
========================================================= */

function syncToLyric(index) {

    if (
        !lyricLines[index]
    ) {

        return;
    }


    currentIndex =
        index;


    songPosition =
        lyricLines[index].time;


    clearInterval(
        syncTimer
    );


    updateCurrentLine(
        songPosition
    );


    startSynchronization();


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Synced";
}


/* =========================================================
   SYNCHRONIZATION CLOCK
========================================================= */

function startSynchronization() {

    clearInterval(
        syncTimer
    );


    const startingPosition =
        songPosition;


    const startTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                const currentTime =
                    startingPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );
}


/* =========================================================
   UPDATE CURRENT LINE
========================================================= */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {

        return;
    }


    currentIndex =
        findCurrentLyric(
            time
        );


    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (element, index) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";


                /*
                 * Automatically scroll the
                 * active lyric to the center.
                 */

                element.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            } else {

                element.className =
                    "line";
            }
        }
    );
}

</script></body>
</html>
