<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSIC Lyrics"><title>MUSIC Lyrics</title><style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    background: #000;
    color: white;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 20%, #272727 0%, #090909 45%, #000 100%);
}

/* HEADER */

.header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100px;

    padding-top: 55px;

    text-align: center;
    z-index: 20;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.85),
        rgba(0,0,0,0)
    );
}

.header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .3px;
}

.header-subtitle {
    margin-top: 3px;
    font-size: 13px;
    color: #aaa;
}

/* LYRICS */

.lyrics-container {
    position: absolute;

    top: 105px;
    bottom: 115px;

    left: 0;
    right: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 55px 25px 180px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}

.lyrics-container::-webkit-scrollbar {
    display: none;
}

.lyric-line {
    text-align: center;

    font-size: 25px;
    line-height: 1.35;

    font-weight: 700;

    color: rgba(255,255,255,.35);

    padding: 13px 5px;

    transition:
        color .25s ease,
        transform .25s ease,
        opacity .25s ease,
        filter .25s ease;

    opacity: .55;

    cursor: pointer;
}

.lyric-line.active {
    color: #fff;

    opacity: 1;

    transform: scale(1.045);

    filter: drop-shadow(0 0 12px rgba(255,255,255,.22));
}

.lyric-line.past {
    color: rgba(255,255,255,.7);
    opacity: .75;
}

.lyric-line.empty {
    height: 25px;
    padding: 0;
}

/* STATUS */

.status {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 76px;

    text-align: center;

    font-size: 12px;
    color: #777;

    z-index: 20;
}

/* QUESTION BUTTON */

.question-button {
    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: none;

    color: white;

    font-size: 30px;
    font-weight: 700;

    cursor: pointer;

    z-index: 30;

    background:
        linear-gradient(
            135deg,
            #ff004c,
            #ff7a00,
            #ffe600,
            #00e676,
            #00c8ff,
            #8a2be2,
            #ff00a8
        );

    background-size: 400% 400%;

    animation:
        rainbow 5s ease infinite,
        pulse 1.8s ease-in-out infinite;

    box-shadow:
        0 0 20px rgba(255,255,255,.2),
        0 0 45px rgba(0,200,255,.15);
}

@keyframes rainbow {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes pulse {
    0%, 100% {
        transform: translateX(-50%) scale(1);
    }

    50% {
        transform: translateX(-50%) scale(1.1);
    }
}

.question-button:active {
    transform: translateX(-50%) scale(.92);
}

/* RECOGNIZING */

.recognizing {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 40;

    display: none;
}

.spinner {
    width: 55px;
    height: 55px;

    margin: auto auto 15px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,.15);
    border-top-color: white;

    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.recognizing-text {
    font-size: 15px;
    color: #ddd;
}

/* SONG INFO */

.song-info {
    position: absolute;

    left: 20px;
    right: 20px;

    top: 110px;

    text-align: center;

    z-index: 15;

    pointer-events: none;
}

.song-title {
    font-size: 15px;
    font-weight: 700;
}

.song-artist {
    margin-top: 3px;
    font-size: 12px;
    color: #aaa;
}

/* HIDE SONG INFO WHEN LYRICS SCROLL */

.song-info.hidden {
    opacity: 0;
}
</style></head><body><div class="app"><div class="header">
    <div class="header-title">MUSIC Lyrics</div>
    <div class="header-subtitle">Tap to recognize</div>
</div>

<div class="song-info" id="songInfo" style="display:none;">
    <div class="song-title" id="songTitle"></div>
    <div class="song-artist" id="songArtist"></div>
</div>

<div
    id="lyrics"
    class="lyrics-container">
</div>

<div
    id="status"
    class="status">
    Tap the button to identify a song
</div>

<div
    id="recognizing"
    class="recognizing">

    <div class="spinner"></div>

    <div class="recognizing-text">
        Listening...
    </div>

</div>

<button
    id="questionButton"
    class="question-button">
    ?
</button>

</div><script>

/*
==================================================
MUSIC LYRICS
==================================================

The important change:

We now parse LRC directly in the browser.

Example:

[00:00.84] Lately, I've been...

becomes:

time = 0.84 seconds
text = "Lately, I've been..."

No server-side synchronization is required.
*/


const button = document.getElementById("questionButton");
const lyricsContainer = document.getElementById("lyrics");
const statusElement = document.getElementById("status");
const recognizingElement = document.getElementById("recognizing");

const songInfo = document.getElementById("songInfo");
const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");


let lyricLines = [];
let currentIndex = -1;

let audioStartTime = null;
let recognitionTimer = null;


/*
==================================================
PARSE LRC
==================================================
*/

function parseLRC(lrc) {

    if (!lrc || typeof lrc !== "string") {
        console.log("No LRC received");
        return [];
    }

    console.log("RAW LRC:");
    console.log(lrc);

    const lines = lrc.split(/\r?\n/);

    const parsed = [];

    /*
    Supports:

    [00:00.84]
    [01:23.45]
    [03:12.123]

    Also supports multiple timestamps on one line.
    */

    const timestampRegex =
        /(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?/g;

    for (const originalLine of lines) {

        const line = originalLine.trim();

        if (!line) {
            continue;
        }

        const matches = [...line.matchAll(timestampRegex)];

        if (matches.length === 0) {
            continue;
        }

        /*
        Remove all timestamps from the text.
        */

        const text = line
            .replace(timestampRegex, "")
            .trim();

        /*
        Ignore completely empty lines.
        */

        if (!text) {
            continue;
        }

        for (const match of matches) {

            const minutes = Number(match[1]);
            const seconds = Number(match[2]);

            let fraction = 0;

            if (match[3]) {

                const raw = match[3];

                if (raw.length === 1) {
                    fraction = Number(raw) / 10;
                }
                else if (raw.length === 2) {
                    fraction = Number(raw) / 100;
                }
                else {
                    fraction = Number(raw) / 1000;
                }
            }

            const time =
                minutes * 60 +
                seconds +
                fraction;

            parsed.push({
                time,
                text
            });
        }
    }

    parsed.sort((a, b) => a.time - b.time);

    console.log("PARSED LINES:", parsed);

    return parsed;
}


/*
==================================================
DISPLAY LYRICS
==================================================
*/

function displayLyrics(lrc) {

    lyricLines = parseLRC(lrc);

    lyricsContainer.innerHTML = "";

    currentIndex = -1;

    if (!lyricLines.length) {

        lyricsContainer.innerHTML = `
            <div class="lyric-line active">
                No synchronized lyrics found.
            </div>
        `;

        return false;
    }

    lyricLines.forEach((line, index) => {

        const element = document.createElement("div");

        element.className = "lyric-line";

        element.textContent = line.text;

        element.dataset.index = index;

        /*
        Tapping a lyric lets the user manually jump
        the estimated position.
        */

        element.addEventListener("click", () => {

            currentIndex = index;

            updateActiveLyric(index);

        });

        lyricsContainer.appendChild(element);
    });

    return true;
}


/*
==================================================
HIGHLIGHT CURRENT LINE
==================================================
*/

function updateActiveLyric(index) {

    if (index < 0 || index >= lyricLines.length) {
        return;
    }

    const elements =
        lyricsContainer.querySelectorAll(".lyric-line");

    elements.forEach((element, i) => {

        element.classList.remove("active");
        element.classList.remove("past");

        if (i < index) {
            element.classList.add("past");
        }

    });

    const active = elements[index];

    if (!active) {
        return;
    }

    active.classList.add("active");

    /*
    Automatically scroll the current lyric
    toward the center of the screen.
    */

    const containerRect =
        lyricsContainer.getBoundingClientRect();

    const elementRect =
        active.getBoundingClientRect();

    const offset =
        elementRect.top -
        containerRect.top -
        containerRect.height / 2 +
        elementRect.height / 2;

    lyricsContainer.scrollBy({
        top: offset,
        behavior: "smooth"
    });

    currentIndex = index;
}


/*
==================================================
FIND LINE FOR CURRENT TIME
==================================================
*/

function findCurrentLyric(seconds) {

    if (!lyricLines.length) {
        return -1;
    }

    let index = -1;

    for (let i = 0; i < lyricLines.length; i++) {

        if (seconds >= lyricLines[i].time) {
            index = i;
        }
        else {
            break;
        }
    }

    return index;
}


/*
==================================================
ESTIMATED SYNCHRONIZATION
==================================================

We don't need the browser to have access to the
song audio.

After recognition, we start an estimated clock.

This gives us automatic scrolling/highlighting.
*/


function startEstimatedSync() {

    if (!lyricLines.length) {
        return;
    }

    audioStartTime = performance.now();

    if (recognitionTimer) {
        clearInterval(recognitionTimer);
    }

    recognitionTimer = setInterval(() => {

        if (!audioStartTime) {
            return;
        }

        const elapsed =
            (performance.now() - audioStartTime) / 1000;

        const index =
            findCurrentLyric(elapsed);

        if (index !== currentIndex) {
            updateActiveLyric(index);
        }

    }, 150);
}


/*
==================================================
STOP SYNC
==================================================
*/

function stopEstimatedSync() {

    if (recognitionTimer) {

        clearInterval(recognitionTimer);

        recognitionTimer = null;
    }

    audioStartTime = null;
}


/*
==================================================
RECOGNITION
==================================================
*/

async function recognizeSong() {

    button.disabled = true;

    recognizingElement.style.display = "block";

    statusElement.textContent = "Listening...";

    songInfo.style.display = "none";

    lyricsContainer.innerHTML = "";

    stopEstimatedSync();

    try {

        /*
        Ask the user to record audio using the
        browser microphone.
        */

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        const recorder =
            new MediaRecorder(stream);

        const chunks = [];

        recorder.ondataavailable = event => {

            if (event.data.size > 0) {
                chunks.push(event.data);
            }

        };

        recorder.onstop = async () => {

            stream.getTracks().forEach(track => {
                track.stop();
            });

            const blob =
                new Blob(chunks, {
                    type: recorder.mimeType
                });

            await sendAudio(blob);
        };

        recorder.start();

        /*
        Record for 8 seconds.
        */

        setTimeout(() => {

            if (recorder.state !== "inactive") {
                recorder.stop();
            }

        }, 8000);

    }
    catch (error) {

        console.error(error);

        recognizingElement.style.display = "none";

        statusElement.textContent =
            "Microphone permission is required.";

        button.disabled = false;
    }
}


/*
==================================================
SEND AUDIO TO SERVER
==================================================
*/

async function sendAudio(blob) {

    try {

        statusElement.textContent =
            "Recognizing song...";

        const formData = new FormData();

        /*
        IMPORTANT:

        The server expects "audio".
        */

        formData.append(
            "audio",
            blob,
            "recording.webm"
        );

        const response =
            await fetch("/recognize", {
                method: "POST",
                body: formData
            });

        if (!response.ok) {
            throw new Error(
                "Server returned " + response.status
            );
        }

        const data =
            await response.json();

        console.log("SERVER RESPONSE:");
        console.log(data);

        recognizingElement.style.display = "none";

        /*
        Song information.
        */

        if (data.title || data.song) {

            songTitle.textContent =
                data.title ||
                data.song ||
                "";

            songArtist.textContent =
                data.artist ||
                "";

            songInfo.style.display = "block";
        }

        /*
        Lyrics can arrive under different names
        depending on the server version.
        */

        const syncedLyrics =
            data.syncedLyrics ||
            data.synced_lyrics ||
            data.lyrics ||
            data.lyricText ||
            "";

        if (syncedLyrics) {

            const success =
                displayLyrics(syncedLyrics);

            if (success) {

                statusElement.textContent =
                    "Lyrics synchronized";

                /*
                Start estimated timing from the
                beginning of the recognized song.
                */

                startEstimatedSync();

            }
            else {

                statusElement.textContent =
                    "No usable synchronized lyrics.";
            }

        }
        else {

            statusElement.textContent =
                "No lyrics found.";

            lyricsContainer.innerHTML = `
                <div class="lyric-line active">
                    No lyrics found.
                </div>
            `;
        }

    }
    catch (error) {

        console.error(
            "Recognition error:",
            error
        );

        recognizingElement.style.display = "none";

        statusElement.textContent =
            "Could not recognize the song.";

        lyricsContainer.innerHTML = `
            <div class="lyric-line active">
                Try again.
            </div>
        `;

    }
    finally {

        button.disabled = false;
    }
}


/*
==================================================
BUTTON
==================================================
*/

button.addEventListener(
    "click",
    recognizeSong
);


/*
==================================================
INITIAL SCREEN
==================================================
*/

console.log(
    "MUSIC Lyrics loaded successfully."
);

</script></body>
</html>
