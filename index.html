<!DOCTYPE html><html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Lyrics">

<title>MUSIC Lyrics</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding:
            env(safe-area-inset-top)
            16px
            env(safe-area-inset-bottom)
            16px;

        min-height: 100vh;

        background:
            radial-gradient(
                circle at top,
                #252525 0%,
                #111 45%,
                #080808 100%
            );

        color: white;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Arial,
            sans-serif;

        text-align: center;
        overflow-x: hidden;
    }

    .app {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 28px 0 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #888;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .identify-button {
        width: 92px;
        height: 92px;

        margin: 18px auto 22px;

        border-radius: 50%;
        border: 3px solid white;

        background: rgba(255,255,255,0.04);

        color: white;
        font-size: 48px;
        font-weight: 500;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease;

        -webkit-tap-highlight-color: transparent;
    }

    .identify-button:hover {
        transform: scale(1.05);
    }

    .identify-button:active {
        transform: scale(0.92);
    }

    .identify-button:focus {
        outline: none;
    }

    .identify-button.listening {
        animation: rainbowPulse 1s infinite;
    }

    @keyframes rainbowPulse {

        0% {
            transform: scale(1);
            border-color: #ff0000;
            box-shadow:
                0 0 12px #ff0000,
                0 0 25px rgba(255,0,0,0.4);
        }

        16% {
            border-color: #ff7f00;
            box-shadow:
                0 0 18px #ff7f00,
                0 0 35px rgba(255,127,0,0.4);
        }

        33% {
            border-color: #ffff00;
            box-shadow:
                0 0 22px #ffff00,
                0 0 40px rgba(255,255,0,0.4);
        }

        50% {
            transform: scale(1.15);
            border-color: #00ff00;
            box-shadow:
                0 0 28px #00ff00,
                0 0 50px rgba(0,255,0,0.45);
        }

        66% {
            border-color: #00ffff;
            box-shadow:
                0 0 22px #00ffff,
                0 0 40px rgba(0,255,255,0.4);
        }

        83% {
            border-color: #0066ff;
            box-shadow:
                0 0 20px #0066ff,
                0 0 35px rgba(0,102,255,0.4);
        }

        100% {
            transform: scale(1);
            border-color: #ff00ff;
            box-shadow:
                0 0 15px #ff00ff,
                0 0 30px rgba(255,0,255,0.4);
        }
    }

    #status {
        margin: 8px auto 18px;

        min-height: 24px;

        color: #999;

        font-size: 15px;
        line-height: 1.4;

        max-width: 95%;
    }

    #debug {
        display: none;

        margin: 15px auto;
        padding: 12px;

        max-width: 95%;

        background: #1c1c1c;
        border: 1px solid #444;
        border-radius: 12px;

        color: #ff7777;

        font-family: monospace;
        font-size: 12px;

        text-align: left;

        white-space: pre-wrap;
        word-break: break-word;
    }

    #album-art-container {
        width: 180px;
        height: 180px;

        margin: 20px auto 18px;

        display: none;
    }

    #album-art {
        width: 100%;
        height: 100%;

        object-fit: cover;

        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0,0,0,0.5);
    }

    #song {
        margin: 12px auto 20px;

        max-width: 90%;

        font-size: 22px;
        font-weight: 600;

        line-height: 1.35;

        color: white;
    }

    #lyrics {
        margin: 20px auto;

        width: 100%;
        max-width: 700px;

        height: 55vh;
        min-height: 300px;

        overflow-y: auto;

        font-size: 23px;
        line-height: 1.7;

        scroll-behavior: smooth;

        padding:
            30px 8px
            120px 8px;

        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar {
        display: none;
    }

    .line {
        opacity: 0.35;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease,
            background 0.25s ease;

        padding: 10px 12px;
        margin: 3px 0;

        cursor: pointer;

        border-radius: 14px;

        -webkit-tap-highlight-color: transparent;
    }

    .line:hover {
        opacity: 0.75;

        background:
            rgba(255,255,255,0.06);
    }

    .line:active {
        transform: scale(0.97);

        background:
            rgba(255,255,255,0.1);
    }

    .current {
        opacity: 1;

        font-size: 32px;
        font-weight: 700;

        color: white;

        background:
            rgba(255,255,255,0.06);

        transform: scale(1.02);
    }

    @media (max-width: 500px) {

        h1 {
            margin-top: 24px;
            font-size: 30px;
        }

        .subtitle {
            font-size: 14px;
        }

        .identify-button {
            width: 88px;
            height: 88px;
            font-size: 46px;
        }

        #album-art-container {
            width: 160px;
            height: 160px;
        }

        #song {
            font-size: 20px;
        }

        #lyrics {
            height: 58vh;
            font-size: 21px;
        }

        .current {
            font-size: 29px;
        }
    }
</style>

</head><body><div class="app"><h1>🎵 Music Lyrics</h1>

<div class="subtitle">
    Identify a song and follow along
</div>

<button
    class="identify-button"
    onclick="identifySong()"
    aria-label="Identify Song"
>
    ?
</button>

<div id="status">
    Tap the button to identify a song
</div>

<div id="debug"></div>

<div id="album-art-container">

    <img
        id="album-art"
        alt="Album artwork"
    >

</div>

<div id="song"></div>

<div id="lyrics"></div>

</div><script>

/* =========================================
   GLOBAL VARIABLES
========================================= */

let lyricLines = [];

let currentIndex = 0;

let syncTimer = null;

/*
 * This is the position inside the song
 * where SongRec/Shazam recognized it.
 */
let songPosition = 0;

/*
 * Keep this at ZERO for now.
 *
 * Once we confirm the Shazam position
 * is working correctly, we can adjust
 * this if necessary.
 */
const LYRIC_OFFSET = 0;


/* =========================================
   DEBUG
========================================= */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =========================================
   IDENTIFY SONG
========================================= */

async function identifySong() {

    const button =
        document.querySelector(
            ".identify-button"
        );

    const status =
        document.getElementById(
            "status"
        );

    const songDisplay =
        document.getElementById(
            "song"
        );

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );

    const albumArtContainer =
        document.getElementById(
            "album-art-container"
        );

    const albumArt =
        document.getElementById(
            "album-art"
        );


    document.getElementById(
        "debug"
    ).style.display = "none";


    clearInterval(syncTimer);


    button.classList.add(
        "listening"
    );


    status.innerText =
        "🎧 Listening for 8 seconds...";


    songDisplay.innerText = "";

    lyricsDisplay.innerHTML = "";

    albumArtContainer.style.display =
        "none";

    albumArt.src = "";


    try {

        console.log(
            "🎤 Requesting microphone..."
        );


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        console.log(
            "✅ Microphone permission granted."
        );


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";

        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(
                    stream
                );


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        recorder.onerror =
            event => {

                console.error(
                    "Recorder error:",
                    event
                );

            };


        recorder.onstop =
            async () => {

                console.log(
                    "🛑 Recording stopped."
                );


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Preparing audio...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                console.log(
                    "Audio size:",
                    audioBlob.size
                );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;

                }


                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                status.innerText =
                    "📤 Sending audio to server...";


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method:
                                    "POST",

                                body:
                                    formData
                            }
                        );


                    console.log(
                        "Server status:",
                        response.status
                    );


                    const responseText =
                        await response.text();


                    console.log(
                        "SERVER RESPONSE:",
                        responseText
                    );


                    let data;


                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    }

                    catch (jsonError) {

                        showDebug(
                            "❌ SERVER RETURNED INVALID DATA\n\n" +
                            "HTTP STATUS: " +
                            response.status +
                            " " +
                            response.statusText +
                            "\n\n" +
                            responseText.substring(
                                0,
                                1500
                            )
                        );


                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;

                    }


                    if (
                        !response.ok
                    ) {

                        const errorMessage =
                            data.error ||
                            "Server error " +
                            response.status;


                        showDebug(
                            "❌ SERVER ERROR\n\n" +
                            errorMessage +
                            "\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );


                        status.innerText =
                            "❌ " +
                            errorMessage;


                        return;

                    }


                    if (
                        data.error
                    ) {

                        showDebug(
                            "❌ SERVER ERROR\n\n" +
                            data.error
                        );


                        status.innerText =
                            "❌ " +
                            data.error;


                        return;

                    }


                    if (
                        !data.song
                    ) {

                        showDebug(
                            "❌ SONG INFORMATION MISSING\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );


                        status.innerText =
                            "❌ Song information was not returned.";


                        return;

                    }


                    /* =========================================
                       SONG INFORMATION
                    ========================================= */

                    songDisplay.innerText =
                        data.song.title +
                        " — " +
                        data.song.artist;


                    /* =========================================
                       ALBUM ART
                    ========================================= */

                    if (
                        data.song.artwork
                    ) {

                        albumArt.src =
                            data.song.artwork;


                        albumArt.onload =
                            () => {

                                albumArtContainer
                                    .style
                                    .display =
                                    "block";

                            };

                    }


                    /* =========================================
                       SHAZAM MATCH POSITION
                    ========================================= */

                    /*
                     * IMPORTANT:
                     *
                     * The server sends:
                     *
                     * data.song.matchPosition
                     *
                     * NOT matchOffset.
                     */

                    const rawMatchPosition =
                        Number(
                            data.song.matchPosition
                        );


                    if (
                        Number.isFinite(
                            rawMatchPosition
                        )
                    ) {

                        songPosition =
                            rawMatchPosition;

                    }

                    else {

                        songPosition = 0;

                    }


                    /*
                     * Apply optional adjustment.
                     */

                    songPosition +=
                        LYRIC_OFFSET;


                    console.log(
                        "🎯 Shazam match position:",
                        rawMatchPosition
                    );


                    console.log(
                        "🎯 Lyrics starting position:",
                        songPosition
                    );


                    /* =========================================
                       LYRICS
                    ========================================= */

                    if (
                        !data.lyrics ||
                        !data.lyrics.syncedLyrics
                    ) {

                        status.innerText =
                            "⚠️ No synchronized lyrics found.";

                        return;

                    }


                    parseLyrics(
                        data.lyrics.syncedLyrics
                    );


                    if (
                        lyricLines.length === 0
                    ) {

                        status.innerText =
                            "⚠️ Lyrics were received but could not be synchronized.";

                        return;

                    }


                    /*
                     * Find the lyric that corresponds
                     * to the actual Shazam position.
                     */

                    currentIndex =
                        findCurrentLyric(
                            songPosition
                        );


                    updateCurrentLine(
                        songPosition
                    );


                    status.innerText =
                        "🎵 Synced!";


                    startSynchronization();

                }

                catch (error) {

                    console.error(
                        error
                    );


                    showDebug(
                        "❌ CONNECTION ERROR\n\n" +
                        error.message
                    );


                    status.innerText =
                        "❌ " +
                        error.message;

                }

            };


        recorder.start();


        console.log(
            "▶️ Recording started."
        );


        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();

                }

            },
            8000
        );

    }

    catch (error) {

        button.classList.remove(
            "listening"
        );


        showDebug(
            "❌ MICROPHONE ERROR\n\n" +
            error.message
        );


        status.innerText =
            "❌ " +
            error.message;

    }

}


/* =========================================
   PARSE SYNCED LYRICS
========================================= */

function parseLyrics(text) {

    lyricLines = [];


    const lines =
        text.split("\n");


    for (
        const line of lines
    ) {

        /*
         * Supports:
         *
         * [01:23.45] lyric
         *
         * [01:23] lyric
         */

        const match =
            line.match(
                /^(\d+):(\d+(?:\.\d+)?)(.*)$/
            );


        if (!match) {

            continue;

        }


        const minutes =
            parseInt(
                match[1],
                10
            );


        const seconds =
            parseFloat(
                match[2]
            );


        lyricLines.push({

            time:
                minutes * 60 +
                seconds,

            text:
                match[3].trim()

        });

    }


    lyricLines.sort(
        (a, b) =>
            a.time - b.time
    );


    showLyrics();

}


/* =========================================
   FIND CURRENT LYRIC
========================================= */

function findCurrentLyric(time) {

    if (
        lyricLines.length === 0
    ) {

        return 0;

    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        }

        else {

            break;

        }

    }


    return index;

}


/* =========================================
   SHOW LYRICS
========================================= */

function showLyrics() {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML =
        "";


    lyricLines.forEach(
        (
            line,
            index
        ) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            div.innerText =
                line.text;


            div.onclick =
                () => {

                    syncToLyric(
                        index
                    );

                };


            lyricsDisplay.appendChild(
                div
            );

        }
    );

}


/* =========================================
   TAP A LYRIC
========================================= */

function syncToLyric(index) {

    if (
        !lyricLines[index]
    ) {

        return;

    }


    currentIndex =
        index;


    songPosition =
        lyricLines[index].time;


    clearInterval(
        syncTimer
    );


    updateCurrentLine(
        songPosition
    );


    startSynchronization();


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Synced to: " +
        lyricLines[index].text;

}


/* =========================================
   START SYNCHRONIZATION
========================================= */

function startSynchronization() {

    clearInterval(
        syncTimer
    );


    /*
     * Remember exactly where the lyrics
     * are starting.
     */

    const startingPosition =
        songPosition;


    const startTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                const currentTime =
                    startingPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );

}


/* =========================================
   UPDATE CURRENT LYRIC
========================================= */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {

        return;

    }


    const newIndex =
        findCurrentLyric(
            time
        );


    /*
     * Only scroll when the lyric
     * actually changes.
     *
     * This prevents the page from
     * constantly scrolling every 100ms.
     */

    if (
        newIndex !== currentIndex
    ) {

        currentIndex =
            newIndex;

        const elements =
            document.querySelectorAll(
                ".line"
            );


        elements.forEach(
            (
                element,
                index
            ) => {

                if (
                    index === currentIndex
                ) {

                    element.className =
                        "line current";


                    element.scrollIntoView({
                        behavior:
                            "smooth",

                        block:
                            "center"
                    });

                }

                else {

                    element.className =
                        "line";

                }

            }
        );

    }

    else {

        const elements =
            document.querySelectorAll(
                ".line"
            );


        if (
            elements[currentIndex]
        ) {

            elements[currentIndex]
                .className =
                "line current";

        }

    }

}

</script></body>
</html>
