<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111111">

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Music Lyrics"
    >

    <title>Music Lyrics</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            background: #080808;
        }

        body {
            margin: 0;

            padding:
                env(safe-area-inset-top)
                16px
                env(safe-area-inset-bottom)
                16px;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #292929 0%,
                    #111111 45%,
                    #070707 100%
                );

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Arial,
                sans-serif;

            text-align: center;

            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* =========================
           TITLE
        ========================= */

        h1 {
            margin: 28px 0 7px;

            font-size: 34px;
            font-weight: 700;

            letter-spacing: -1px;
        }

        .subtitle {
            color: #888;

            font-size: 15px;

            margin-bottom: 24px;
        }

        /* =========================
           QUESTION MARK BUTTON
        ========================= */

        .identify-button {
            width: 92px;
            height: 92px;

            margin: 18px auto 22px;

            border-radius: 50%;

            border: 3px solid white;

            background:
                rgba(255,255,255,0.04);

            color: white;

            font-size: 48px;
            font-weight: 500;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        .identify-button:hover {
            transform: scale(1.05);
        }

        .identify-button:active {
            transform: scale(0.92);
        }

        .identify-button:focus {
            outline: none;
        }

        /* =========================
           RAINBOW LISTENING ANIMATION
        ========================= */

        .identify-button.listening {
            animation:
                rainbowPulse 1s infinite;
        }

        @keyframes rainbowPulse {

            0% {
                transform: scale(1);

                border-color: #ff0000;

                box-shadow:
                    0 0 12px #ff0000,
                    0 0 25px rgba(255,0,0,0.4);
            }

            16% {
                border-color: #ff7f00;

                box-shadow:
                    0 0 18px #ff7f00,
                    0 0 35px rgba(255,127,0,0.4);
            }

            33% {
                border-color: #ffff00;

                box-shadow:
                    0 0 22px #ffff00,
                    0 0 40px rgba(255,255,0,0.4);
            }

            50% {
                transform: scale(1.15);

                border-color: #00ff00;

                box-shadow:
                    0 0 28px #00ff00,
                    0 0 50px rgba(0,255,0,0.45);
            }

            66% {
                border-color: #00ffff;

                box-shadow:
                    0 0 22px #00ffff,
                    0 0 40px rgba(0,255,255,0.4);
            }

            83% {
                border-color: #0066ff;

                box-shadow:
                    0 0 20px #0066ff,
                    0 0 35px rgba(0,102,255,0.4);
            }

            100% {
                transform: scale(1);

                border-color: #ff00ff;

                box-shadow:
                    0 0 15px #ff00ff,
                    0 0 30px rgba(255,0,255,0.4);
            }
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            margin:
                8px auto 18px;

            min-height: 24px;

            color: #999;

            font-size: 15px;

            line-height: 1.4;

            max-width: 95%;
        }

        /* =========================
           DEBUG
        ========================= */

        #debug {
            display: none;

            margin: 15px auto;

            padding: 12px;

            max-width: 95%;

            background: #1c1c1c;

            border: 1px solid #444;

            border-radius: 12px;

            color: #ff7777;

            font-family: monospace;

            font-size: 12px;

            text-align: left;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =========================
           ALBUM ART
        ========================= */

        #album-art-container {
            width: 180px;
            height: 180px;

            margin:
                20px auto 18px;

            display: none;
        }

        #album-art {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.5);
        }

        /* =========================
           SONG TITLE
        ========================= */

        #song {
            margin:
                12px auto 20px;

            max-width: 90%;

            font-size: 22px;

            font-weight: 600;

            line-height: 1.35;

            color: white;
        }

        /* =========================
           LYRICS
        ========================= */

        #lyrics {
            margin: 20px auto;

            width: 100%;

            max-width: 700px;

            height: 55vh;

            min-height: 300px;

            overflow-y: auto;

            font-size: 23px;

            line-height: 1.7;

            scroll-behavior: smooth;

            padding:
                30px 8px
                120px 8px;

            scrollbar-width: none;
        }

        #lyrics::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           NORMAL LYRIC
        ========================= */

        .line {
            opacity: 0.32;

            transition:
                opacity 0.35s ease,
                transform 0.35s ease,
                background 0.35s ease;

            padding:
                10px 12px;

            margin:
                3px 0;

            cursor: pointer;

            border-radius: 14px;

            -webkit-tap-highlight-color:
                transparent;
        }

        .line:hover {
            opacity: 0.75;

            background:
                rgba(255,255,255,0.06);
        }

        .line:active {
            transform: scale(0.97);

            background:
                rgba(255,255,255,0.1);
        }

        /* =========================
           CURRENT LYRIC
        ========================= */

        .current {
            opacity: 1;

            font-size: 32px;

            font-weight: 700;

            color: white;

            background:
                rgba(255,255,255,0.07);

            transform:
                scale(1.02);
        }

        /* =========================
           ESTIMATED SYNC NOTICE
        ========================= */

        #sync-info {
            display: none;

            color: #777;

            font-size: 12px;

            margin:
                -5px auto 15px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            h1 {
                margin-top: 24px;
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
            }

            .identify-button {
                width: 88px;
                height: 88px;

                font-size: 46px;
            }

            #album-art-container {
                width: 160px;
                height: 160px;
            }

            #song {
                font-size: 20px;
            }

            #lyrics {
                height: 58vh;

                font-size: 21px;
            }

            .current {
                font-size: 29px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <h1>🎵 Music Lyrics</h1>

    <div class="subtitle">
        Identify a song and follow along
    </div>

    <button
        class="identify-button"
        id="identifyButton"
        onclick="identifySong()"
        aria-label="Identify Song"
    >
        ?
    </button>

    <div id="status">
        Tap the button to identify a song
    </div>

    <div id="sync-info"></div>

    <div id="debug"></div>

    <div id="album-art-container">

        <img
            id="album-art"
            alt="Album artwork"
        >

    </div>

    <div id="song"></div>

    <div id="lyrics"></div>

</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let lyricLines = [];

let currentIndex = 0;

let syncTimer = null;

let syncStartTime = 0;

let syncStartPosition = 0;


/*
 * Estimated lyric timing.
 *
 * This is only used when the server
 * cannot obtain real timestamps.
 */

const ESTIMATED_SECONDS_PER_LINE = 3.2;


/* =========================================================
   DEBUG
========================================================= */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =========================================================
   IDENTIFY SONG
========================================================= */

async function identifySong() {

    const button =
        document.getElementById(
            "identifyButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const songDisplay =
        document.getElementById(
            "song"
        );

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );

    const albumArtContainer =
        document.getElementById(
            "album-art-container"
        );

    const albumArt =
        document.getElementById(
            "album-art"
        );

    const syncInfo =
        document.getElementById(
            "sync-info"
        );


    /* Stop previous synchronization */

    clearInterval(syncTimer);


    /* Reset */

    button.classList.add(
        "listening"
    );

    status.innerText =
        "🎧 Listening for 8 seconds...";

    songDisplay.innerText = "";

    lyricsDisplay.innerHTML = "";

    albumArtContainer.style.display =
        "none";

    albumArt.src = "";

    syncInfo.style.display =
        "none";

    document.getElementById(
        "debug"
    ).style.display = "none";


    try {

        /* =========================================
           MICROPHONE
        ========================================= */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );
        }


        console.log(
            "🎤 Requesting microphone..."
        );


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        console.log(
            "✅ Microphone permission granted."
        );


        /* =========================================
           RECORDER
        ========================================= */

        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(
                    stream
                );


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        recorder.onerror =
            event => {

                console.error(
                    "Recorder error:",
                    event
                );
            };


        recorder.onstop =
            async () => {

                console.log(
                    "🛑 Recording stopped."
                );


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Preparing audio...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                console.log(
                    "Audio size:",
                    audioBlob.size
                );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;
                }


                /* =========================================
                   SEND AUDIO
                ========================================= */

                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                status.innerText =
                    "📤 Sending audio to server...";


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method:
                                    "POST",

                                body:
                                    formData
                            }
                        );


                    console.log(
                        "Server status:",
                        response.status
                    );


                    const responseText =
                        await response.text();


                    console.log(
                        "SERVER RESPONSE:",
                        responseText
                    );


                    /* =========================================
                       JSON
                    ========================================= */

                    let data;


                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    } catch (error) {

                        showDebug(
                            "❌ SERVER RETURNED INVALID DATA\n\n" +
                            "HTTP STATUS: " +
                            response.status +
                            "\n\n" +
                            responseText.substring(
                                0,
                                2000
                            )
                        );

                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;
                    }


                    /* =========================================
                       SERVER ERROR
                    ========================================= */

                    if (
                        !response.ok ||
                        data.error
                    ) {

                        const message =
                            data.error ||
                            "Server error " +
                            response.status;


                        showDebug(
                            "❌ SERVER ERROR\n\n" +
                            message +
                            "\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );


                        status.innerText =
                            "❌ " +
                            message;

                        return;
                    }


                    /* =========================================
                       SONG
                    ========================================= */

                    if (!data.song) {

                        showDebug(
                            "❌ Song information was missing."
                        );

                        status.innerText =
                            "❌ Song information was not returned.";

                        return;
                    }


                    songDisplay.innerText =
                        data.song.title +
                        " — " +
                        data.song.artist;


                    /* =========================================
                       ARTWORK
                    ========================================= */

                    if (
                        data.song.artwork
                    ) {

                        albumArt.src =
                            data.song.artwork;


                        albumArt.onload =
                            () => {

                                albumArtContainer
                                    .style
                                    .display =
                                    "block";
                            };
                    }


                    /* =========================================
                       LYRICS
                    ========================================= */

                    if (
                        !data.lyrics ||
                        !Array.isArray(
                            data.lyrics.lines
                        ) ||
                        data.lyrics.lines.length === 0
                    ) {

                        status.innerText =
                            "⚠️ No lyrics found.";

                        return;
                    }


                    /*
                     * The server gives us:
                     *
                     * data.lyrics.lines
                     *
                     * Each line has:
                     *
                     * {
                     *     time: number,
                     *     text: string
                     * }
                     *
                     * The time is NEVER displayed.
                     */


                    lyricLines =
                        data.lyrics.lines
                            .filter(
                                line =>
                                    line &&
                                    typeof line.text ===
                                        "string"
                            )
                            .map(
                                line => ({
                                    time:
                                        Number(
                                            line.time
                                        ) || 0,

                                    text:
                                        line.text.trim()
                                })
                            )
                            .filter(
                                line =>
                                    line.text.length > 0
                            );


                    if (
                        lyricLines.length === 0
                    ) {

                        status.innerText =
                            "⚠️ Lyrics could not be prepared.";

                        return;
                    }


                    /* =========================================
                       SHOW LYRICS
                    ========================================= */

                    showLyrics();


                    /* =========================================
                       DETERMINE SYNC TYPE
                    ========================================= */

                    const syncType =
                        data.lyrics.syncType;


                    if (
                        syncType === "true"
                    ) {

                        syncInfo.innerText =
                            "♪ Synchronized lyrics";

                        syncInfo.style.display =
                            "block";

                    } else {

                        syncInfo.innerText =
                            "♪ Lyrics timing estimated";

                        syncInfo.style.display =
                            "block";
                    }


                    /* =========================================
                       START POSITION
                    ========================================= */

                    let startPosition =
                        Number(
                            data.song.matchPosition
                        );


                    if (
                        !Number.isFinite(
                            startPosition
                        ) ||
                        startPosition < 0
                    ) {

                        startPosition = 0;
                    }


                    /*
                     * For estimated lyrics, the first lyric
                     * should begin at the recognition point.
                     */

                    if (
                        syncType === "estimated"
                    ) {

                        lyricLines =
                            lyricLines.map(
                                (
                                    line,
                                    index
                                ) => ({
                                    time:
                                        startPosition +
                                        index *
                                        ESTIMATED_SECONDS_PER_LINE,

                                    text:
                                        line.text
                                })
                            );

                    }


                    /* =========================================
                       FIND CURRENT LINE
                    ========================================= */

                    currentIndex =
                        findCurrentLyric(
                            startPosition
                        );


                    updateCurrentLine(
                        startPosition
                    );


                    /* =========================================
                       STATUS
                    ========================================= */

                    if (
                        syncType === "true"
                    ) {

                        status.innerText =
                            "🎵 Synced!";

                    } else {

                        status.innerText =
                            "🎵 Lyrics ready!";
                    }


                    /* =========================================
                       START AUTOMATIC SCROLLING
                    ========================================= */

                    startSynchronization(
                        startPosition
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                    showDebug(
                        "❌ CONNECTION ERROR\n\n" +
                        error.message
                    );

                    status.innerText =
                        "❌ " +
                        error.message;
                }
            };


        /* =========================================
           START RECORDING
        ========================================= */

        recorder.start();


        console.log(
            "▶️ Recording started."
        );


        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();
                }

            },
            8000
        );

    } catch (error) {

        button.classList.remove(
            "listening"
        );

        showDebug(
            "❌ MICROPHONE ERROR\n\n" +
            error.message
        );

        status.innerText =
            "❌ " +
            error.message;
    }
}


/* =========================================================
   SHOW LYRICS
========================================================= */

function showLyrics() {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML =
        "";


    lyricLines.forEach(
        (
            line,
            index
        ) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            /*
             * IMPORTANT:
             *
             * Only the lyric text is displayed.
             * No timestamps.
             */

            div.innerText =
                line.text;


            /*
             * Allow the user to tap
             * any lyric to jump there.
             */

            div.onclick =
                () => {

                    syncToLyric(
                        index
                    );
                };


            lyricsDisplay.appendChild(
                div
            );
        }
    );
}


/* =========================================================
   FIND CURRENT LYRIC
========================================================= */

function findCurrentLyric(time) {

    if (
        lyricLines.length === 0
    ) {
        return 0;
    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        } else {

            break;
        }
    }


    return index;
}


/* =========================================================
   UPDATE CURRENT LYRIC
========================================================= */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {
        return;
    }


    currentIndex =
        findCurrentLyric(
            time
        );


    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (
            element,
            index
        ) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";


                /*
                 * Automatically move
                 * the current lyric
                 * toward the center.
                 */

                element.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            } else {

                element.className =
                    "line";
            }
        }
    );
}


/* =========================================================
   START SYNCHRONIZATION
========================================================= */

function startSynchronization(
    startingPosition
) {

    clearInterval(
        syncTimer
    );


    syncStartPosition =
        startingPosition;


    syncStartTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        syncStartTime
                    ) / 1000;


                const currentTime =
                    syncStartPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );
}


/* =========================================================
   TAP A LYRIC
========================================================= */

function syncToLyric(index) {

    if (
        !lyricLines[index]
    ) {
        return;
    }


    currentIndex =
        index;


    const selectedTime =
        lyricLines[index].time;


    clearInterval(
        syncTimer
    );


    updateCurrentLine(
        selectedTime
    );


    startSynchronization(
        selectedTime
    );


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Synced to lyric";
}


/* =========================================================
   CLEAN UP WHEN PAGE IS HIDDEN
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            clearInterval(
                syncTimer
            );
        }
    }
);

</script>

</body>
</html>
