<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Lyrics"><title>Music Lyrics</title><style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
}

body {
    padding:
        env(safe-area-inset-top)
        16px
        env(safe-area-inset-bottom)
        16px;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    text-align: center;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

h1 {
    margin: 25px 0 6px;
    font-size: 32px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 20px;
}

/* BUTTON */

.identify-button {
    width: 92px;
    height: 92px;

    margin: 18px auto;

    border-radius: 50%;

    border: 3px solid white;

    background: rgba(255,255,255,.04);

    color: white;

    font-size: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.identify-button:active {
    transform: scale(.92);
}

.identify-button.listening {
    animation: rainbowPulse 1s infinite;
}

@keyframes rainbowPulse {

    0% {
        transform: scale(1);
        border-color: red;
        box-shadow: 0 0 15px red;
    }

    16% {
        border-color: orange;
        box-shadow: 0 0 20px orange;
    }

    33% {
        border-color: yellow;
        box-shadow: 0 0 25px yellow;
    }

    50% {
        transform: scale(1.15);
        border-color: lime;
        box-shadow: 0 0 30px lime;
    }

    66% {
        border-color: cyan;
        box-shadow: 0 0 25px cyan;
    }

    83% {
        border-color: #0066ff;
        box-shadow: 0 0 25px #0066ff;
    }

    100% {
        transform: scale(1);
        border-color: magenta;
        box-shadow: 0 0 20px magenta;
    }
}

/* STATUS */

#status {
    min-height: 24px;
    color: #999;
    font-size: 15px;
    margin: 8px auto 15px;
}

/* DEBUG */

#debug {
    display: none;

    margin: 15px auto;
    padding: 12px;

    max-width: 95%;

    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 12px;

    color: #ff7777;

    font-family: monospace;
    font-size: 12px;

    text-align: left;

    white-space: pre-wrap;
    word-break: break-word;
}

/* ALBUM ART */

#album-art-container {
    width: 180px;
    height: 180px;

    margin: 18px auto;

    display: none;
}

#album-art {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 20px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.6);
}

/* SONG */

#song {
    margin: 12px auto 15px;

    max-width: 92%;

    font-size: 21px;
    font-weight: 600;

    line-height: 1.35;
}

/* LYRICS */

#lyrics {

    width: 100%;
    max-width: 700px;

    height: 60vh;
    min-height: 300px;

    overflow-y: auto;

    margin: 10px auto;

    padding:
        100px 8px
        160px 8px;

    font-size: 22px;

    line-height: 1.65;

    scroll-behavior: smooth;

    scrollbar-width: none;
}

#lyrics::-webkit-scrollbar {
    display: none;
}

.line {

    opacity: .32;

    padding: 10px 12px;

    margin: 3px 0;

    border-radius: 14px;

    transition:
        opacity .25s ease,
        transform .25s ease,
        font-size .25s ease,
        background .25s ease;
}

.line.current {

    opacity: 1;

    font-size: 31px;

    font-weight: 700;

    background:
        rgba(255,255,255,.07);

    transform: scale(1.02);
}

@media (max-width: 500px) {

    h1 {
        font-size: 29px;
    }

    .identify-button {
        width: 88px;
        height: 88px;
    }

    #album-art-container {
        width: 165px;
        height: 165px;
    }

    #lyrics {
        height: 60vh;
        font-size: 21px;
    }

    .line.current {
        font-size: 28px;
    }
}

</style></head><body><div class="app"><h1>🎵 Music Lyrics</h1><div class="subtitle">
Identify a song and follow along
</div><button
id="identifyButton"
class="identify-button"
onclick="identifySong()">
?
</button>

<div id="status">
Tap the button to identify a song
</div><div id="debug"></div><div id="album-art-container"><img
id="album-art"
alt="Album artwork">

</div><div id="song"></div><div id="lyrics"></div></div><script>

/* =====================================================
   VARIABLES
===================================================== */

let lyricLines = [];

let currentIndex = 0;

let syncTimer = null;

let songPosition = 0;


/*
   Change this later if the lyrics are slightly
   early or late.

   0 = no adjustment
*/
const LYRIC_OFFSET = 0;


/* =====================================================
   DEBUG
===================================================== */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =====================================================
   IDENTIFY
===================================================== */

async function identifySong() {

    const button =
        document.getElementById(
            "identifyButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const songDisplay =
        document.getElementById(
            "song"
        );

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );

    const albumContainer =
        document.getElementById(
            "album-art-container"
        );

    const albumArt =
        document.getElementById(
            "album-art"
        );


    clearInterval(syncTimer);

    lyricLines = [];

    currentIndex = 0;

    songPosition = 0;

    document.getElementById(
        "debug"
    ).style.display = "none";


    button.classList.add(
        "listening"
    );


    status.innerText =
        "🎧 Listening for 8 seconds...";


    songDisplay.innerText = "";

    lyricsDisplay.innerHTML = "";

    albumContainer.style.display =
        "none";

    albumArt.src = "";


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );
        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(
                    stream
                );


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Identifying song...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;
                }


                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method:
                                    "POST",
                                body:
                                    formData
                            }
                        );


                    const responseText =
                        await response.text();


                    let data;


                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    } catch (error) {

                        showDebug(
                            responseText
                        );

                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;
                    }


                    if (
                        !response.ok
                    ) {

                        showDebug(
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ " +
                            (
                                data.error ||
                                "Server error."
                            );

                        return;
                    }


                    if (
                        data.error
                    ) {

                        showDebug(
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ " +
                            data.error;

                        return;
                    }


                    if (
                        !data.song
                    ) {

                        status.innerText =
                            "❌ Song information missing.";

                        return;
                    }


                    /* =================================================
                       SONG
                    ================================================= */

                    const title =
                        data.song.title ||
                        data.song.trackName ||
                        data.song.name ||
                        "Unknown Song";


                    const artist =
                        data.song.artist ||
                        data.song.artistName ||
                        "Unknown Artist";


                    songDisplay.innerText =
                        title +
                        " — " +
                        artist;


                    /* =================================================
                       ALBUM ART
                    ================================================= */

                    const artwork =
                        data.song.artwork ||
                        data.song.artworkUrl ||
                        data.song.artwork_url ||
                        data.song.albumArt ||
                        data.song.albumArtwork ||
                        data.song.cover ||
                        data.song.coverUrl ||
                        data.song.image ||
                        data.song.imageUrl ||
                        data.artwork ||
                        data.artworkUrl ||
                        data.albumArt ||
                        data.albumArtwork ||
                        null;


                    if (artwork) {

                        albumArt.onload =
                            () => {

                                albumContainer.style.display =
                                    "block";
                            };


                        albumArt.onerror =
                            () => {

                                albumContainer.style.display =
                                    "none";
                            };


                        albumArt.src =
                            artwork;

                    }


                    /* =================================================
                       SONGREC POSITION
                    ================================================= */

                    let offset =
                        data.song.matchOffset;


                    if (
                        offset === undefined ||
                        offset === null
                    ) {

                        offset =
                            data.matchOffset;
                    }


                    songPosition =
                        Number(offset);


                    if (
                        !Number.isFinite(
                            songPosition
                        )
                    ) {

                        songPosition = 0;
                    }


                    songPosition +=
                        LYRIC_OFFSET;


                    console.log(
                        "SongRec position:",
                        songPosition
                    );


                    /* =================================================
                       LYRICS
                    ================================================= */

                    let syncedLyrics =
                        null;


                    if (
                        data.lyrics &&
                        typeof data.lyrics ===
                        "object"
                    ) {

                        syncedLyrics =
                            data.lyrics.syncedLyrics;
                    }


                    if (
                        !syncedLyrics &&
                        typeof data.syncedLyrics ===
                        "string"
                    ) {

                        syncedLyrics =
                            data.syncedLyrics;
                    }


                    if (
                        !syncedLyrics &&
                        typeof data.lyrics ===
                        "string"
                    ) {

                        syncedLyrics =
                            data.lyrics;
                    }


                    if (
                        !syncedLyrics
                    ) {

                        status.innerText =
                            "⚠️ No synchronized lyrics found.";

                        return;
                    }


                    console.log(
                        "RAW LYRICS:",
                        syncedLyrics
                    );


                    /* =================================================
                       PARSE
                    ================================================= */

                    const parsed =
                        parseLyrics(
                            syncedLyrics
                        );


                    if (!parsed) {

                        showDebug(
                            "Could not read lyric timestamps.\n\n" +
                            String(
                                syncedLyrics
                            ).substring(
                                0,
                                6000
                            )
                        );

                        status.innerText =
                            "⚠️ Could not read lyric timestamps.";

                        return;
                    }


                    /* =================================================
                       START AT SONGREC POSITION
                    ================================================= */

                    currentIndex =
                        findCurrentLyric(
                            songPosition
                        );


                    updateCurrentLine(
                        songPosition
                    );


                    status.innerText =
                        "🎵 Synced!";


                    startSynchronization();

                } catch (error) {

                    console.error(
                        error
                    );

                    status.innerText =
                        "❌ " +
                        error.message;
                }
            };


        recorder.start();


        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();
                }

            },
            8000
        );


    } catch (error) {

        button.classList.remove(
            "listening"
        );

        showDebug(
            error.message
        );

        status.innerText =
            "❌ " +
            error.message;
    }
}


/* =====================================================
   NEW ROBUST LYRIC PARSER
===================================================== */

function parseLyrics(text) {

    lyricLines = [];


    if (
        typeof text !== "string"
    ) {

        return false;
    }


    /*
       THIS IS THE IMPORTANT FIX.

       Instead of assuming each lyric is on
       a separate line, we look for EVERY timestamp.

       It handles:

       [00:00.09] lyric
       [00:02.17] lyric

       AND even:

       [00:00.09] lyric[00:02.17] lyric
    */


    const timestampRegex =
        /(\d+):(\d{2})(?:\.(\d{1,3}))?/g;


    const matches = [];

    let match;


    while (
        (match =
            timestampRegex.exec(text)) !== null
    ) {

        matches.push({
            index:
                match.index,

            end:
                timestampRegex.lastIndex,

            minutes:
                parseInt(
                    match[1],
                    10
                ),

            seconds:
                parseInt(
                    match[2],
                    10
                ),

            fraction:
                match[3] || "0"
        });
    }


    console.log(
        "Found timestamps:",
        matches.length
    );


    if (
        matches.length === 0
    ) {

        return false;
    }


    /*
       Build each lyric using the text between
       this timestamp and the next timestamp.
    */

    for (
        let i = 0;
        i < matches.length;
        i++
    ) {

        const item =
            matches[i];


        const next =
            matches[i + 1];


        let fraction =
            item.fraction;


        let fractionValue = 0;


        if (
            fraction.length === 1
        ) {

            fractionValue =
                Number(fraction) / 10;

        } else if (
            fraction.length === 2
        ) {

            fractionValue =
                Number(fraction) / 100;

        } else {

            fractionValue =
                Number(fraction) / 1000;
        }


        const time =
            item.minutes * 60 +
            item.seconds +
            fractionValue;


        const textStart =
            item.end;


        const textEnd =
            next
                ? next.index
                : text.length;


        let lyricText =
            text.substring(
                textStart,
                textEnd
            );


        /*
           Clean up anything accidentally
           placed before the lyric.
        */

        lyricText =
            lyricText
                .replace(/\r/g, "")
                .replace(/\n/g, " ")
                .trim();


        /*
           Remove title if LRCLIB sends:

           [00:00.00] Counting Stars - OneRepublic
        */

        if (
            lyricLines.length === 0 &&
            (
                lyricText.includes(
                    " - "
                ) ||
                lyricText.includes(
                    " — "
                )
            )
        ) {

            continue;
        }


        if (
            lyricText.length === 0
        ) {

            continue;
        }


        lyricLines.push({

            time:
                time,

            text:
                lyricText
        });
    }


    lyricLines.sort(
        (a, b) =>
            a.time - b.time
    );


    console.log(
        "Usable lyric lines:",
        lyricLines.length
    );


    if (
        lyricLines.length === 0
    ) {

        return false;
    }


    showLyrics();


    return true;
}


/* =====================================================
   FIND CURRENT LYRIC
===================================================== */

function findCurrentLyric(time) {

    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        } else {

            break;
        }
    }


    return index;
}


/* =====================================================
   DISPLAY LYRICS
===================================================== */

function showLyrics() {

    const container =
        document.getElementById(
            "lyrics"
        );


    container.innerHTML =
        "";


    lyricLines.forEach(
        (line) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            /*
               Only lyric text.
               Timestamp is NEVER displayed.
            */

            div.innerText =
                line.text;


            container.appendChild(
                div
            );
        }
    );
}


/* =====================================================
   SYNCHRONIZATION
===================================================== */

function startSynchronization() {

    clearInterval(
        syncTimer
    );


    const startingPosition =
        songPosition;


    const startTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                const currentTime =
                    startingPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );
}


/* =====================================================
   UPDATE CURRENT LINE
===================================================== */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {

        return;
    }


    const newIndex =
        findCurrentLyric(
            time
        );


    if (
        newIndex === currentIndex
    ) {

        return;
    }


    currentIndex =
        newIndex;


    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (element, index) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";


                element.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            } else {

                element.className =
                    "line";
            }
        }
    );
}

</script></body>
</html>
