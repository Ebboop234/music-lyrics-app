<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MUSIC Lyrics">

    <title>MUSIC Lyrics</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", Arial, sans-serif;
            color: white;
        }

        body {
            position: relative;
        }

        /* =========================
           ALBUM ART BACKGROUND
           ========================= */

        #albumBackground {
            position: fixed;
            inset: -50px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(35px);
            transform: scale(1.15);
            opacity: 0;
            z-index: 0;
            transition: opacity 0.6s ease,
                        background-image 0.4s ease;
        }

        #albumOverlay {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.72),
                    rgba(0,0,0,0.42) 35%,
                    rgba(0,0,0,0.72)
                );
            z-index: 1;
            pointer-events: none;
        }

        /* =========================
           MAIN APP
           ========================= */

        .app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            z-index: 2;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 135px;

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                10px
                20px;

            text-align: center;

            z-index: 20;

            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.65),
                rgba(0,0,0,0)
            );
        }

        .title {
            margin-top: 15px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* =========================
           RECENT BUTTON
           ========================= */

        #recentButton {
            position: absolute;
            left: 16px;
            top: max(20px, env(safe-area-inset-top));

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: white;
            font-size: 21px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            z-index: 30;
        }

        #recentButton:active {
            transform: scale(0.9);
        }

        /* =========================
           SONG INFO
           ========================= */

        #songInfo {
            position: absolute;
            top: 105px;
            left: 20px;
            right: 20px;

            text-align: center;

            z-index: 10;

            display: none;
        }

        #songTitle {
            font-size: 20px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #songArtist {
            margin-top: 3px;

            font-size: 14px;
            opacity: 0.7;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           LYRICS
           ========================= */

        #lyricsContainer {
            position: absolute;

            top: 135px;
            bottom: 115px;

            left: 0;
            right: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                45vh
                25px
                45vh
                25px;

            text-align: center;

            z-index: 5;

            scrollbar-width: none;
        }

        #lyricsContainer::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            padding: 9px 0;

            font-size: 21px;
            line-height: 1.35;

            font-weight: 600;

            opacity: 0.42;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                font-size 0.25s ease;

            cursor: pointer;
        }

        .lyric-line.active {
            opacity: 1;

            font-size: 25px;

            transform: scale(1.03);
        }

        /* =========================
           STATUS
           ========================= */

        #status {
            position: absolute;

            left: 20px;
            right: 20px;

            bottom: 92px;

            text-align: center;

            font-size: 13px;

            opacity: 0.7;

            z-index: 15;
        }

        /* =========================
           RECOGNIZE BUTTON
           ========================= */

        #recognizeButton {
            position: fixed;

            bottom: calc(20px + env(safe-area-inset-bottom));

            left: 50%;

            transform: translateX(-50%);

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff0055,
                    #ff7a00,
                    #ffe600,
                    #00e676,
                    #00b8ff,
                    #6c4cff,
                    #ff00c8
                );

            color: white;

            font-size: 32px;
            font-weight: 800;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 1000;

            box-shadow:
                0 0 12px rgba(255,255,255,0.5);

            animation:
                rainbow 4s linear infinite,
                pulse 1.5s ease-in-out infinite;
        }

        #recognizeButton::before {
            content: "?";
        }

        #recognizeButton:active {
            animation: none;
            transform: translateX(-50%) scale(0.92);
        }

        @keyframes pulse {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow:
                    0 0 10px rgba(255,255,255,0.4);
            }

            50% {
                transform: translateX(-50%) scale(1.18);
                box-shadow:
                    0 0 30px rgba(255,255,255,0.95);
            }

            100% {
                transform: translateX(-50%) scale(1);
                box-shadow:
                    0 0 10px rgba(255,255,255,0.4);
            }
        }

        @keyframes rainbow {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        /* =========================
           RECOGNIZING STATE
           ========================= */

        #recognizeButton.listening {
            animation:
                rainbow 2s linear infinite,
                listeningPulse 0.65s ease-in-out infinite;
        }

        @keyframes listeningPulse {
            0% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.28);
            }

            100% {
                transform: translateX(-50%) scale(1);
            }
        }

        /* =========================
           RECOGNIZING OVERLAY
           ========================= */

        #recognizing {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.65);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            z-index: 2000;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            border:
                4px solid rgba(255,255,255,0.25);

            border-top-color: white;

            animation: spin 0.8s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           RECENTS PANEL
           ========================= */

        #recentPanel {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.92);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            z-index: 3000;

            display: none;

            flex-direction: column;

            padding:
                max(25px, env(safe-area-inset-top))
                18px
                20px;
        }

        .recentHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .recentHeader h2 {
            margin: 0;

            font-size: 25px;
        }

        #closeRecent {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.12);

            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        #recentList {
            flex: 1;

            overflow-y: auto;

            scrollbar-width: none;
        }

        #recentList::-webkit-scrollbar {
            display: none;
        }

        .recentItem {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 10px;

            margin-bottom: 10px;

            border-radius: 14px;

            background: rgba(255,255,255,0.08);

            cursor: pointer;
        }

        .recentItem:active {
            transform: scale(0.98);
        }

        .recentArtwork {
            width: 58px;
            height: 58px;

            border-radius: 9px;

            object-fit: cover;

            background: rgba(255,255,255,0.1);

            flex-shrink: 0;
        }

        .recentText {
            min-width: 0;
        }

        .recentTitle {
            font-size: 16px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recentArtist {
            margin-top: 3px;

            font-size: 13px;

            opacity: 0.65;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recentTime {
            margin-top: 4px;

            font-size: 11px;

            opacity: 0.45;
        }

        .emptyRecent {
            text-align: center;

            margin-top: 60px;

            opacity: 0.55;

            font-size: 15px;
        }
    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND
         ========================= -->

    <div id="albumBackground"></div>
    <div id="albumOverlay"></div>


    <!-- =========================
         MAIN APP
         ========================= -->

    <div class="app">

        <header class="header">

            <button id="recentButton" aria-label="Recent songs">
                🕘
            </button>

            <div class="title">
                MUSIC Lyrics
            </div>

            <div class="subtitle">
                Tap to recognize
            </div>

        </header>


        <!-- SONG INFO -->

        <div id="songInfo">

            <div id="songTitle"></div>

            <div id="songArtist"></div>

        </div>


        <!-- LYRICS -->

        <div id="lyricsContainer"></div>


        <!-- STATUS -->

        <div id="status">
            Ready
        </div>


        <!-- RECOGNIZE BUTTON -->

        <button id="recognizeButton"
                aria-label="Recognize song">
        </button>

    </div>


    <!-- =========================
         RECOGNIZING OVERLAY
         ========================= -->

    <div id="recognizing">

        <div class="spinner"></div>

        <div>
            Listening...
        </div>

    </div>


    <!-- =========================
         RECENT SONGS PANEL
         ========================= -->

    <div id="recentPanel">

        <div class="recentHeader">

            <h2>
                Recent Songs
            </h2>

            <button id="closeRecent">
                ×
            </button>

        </div>

        <div id="recentList"></div>

    </div>


    <script>

        /* =========================
           ELEMENTS
           ========================= */

        const button =
            document.getElementById("recognizeButton");

        const lyricsContainer =
            document.getElementById("lyricsContainer");

        const statusElement =
            document.getElementById("status");

        const recognizingElement =
            document.getElementById("recognizing");

        const songInfo =
            document.getElementById("songInfo");

        const songTitle =
            document.getElementById("songTitle");

        const songArtist =
            document.getElementById("songArtist");

        const albumBackground =
            document.getElementById("albumBackground");

        const recentButton =
            document.getElementById("recentButton");

        const recentPanel =
            document.getElementById("recentPanel");

        const closeRecent =
            document.getElementById("closeRecent");

        const recentList =
            document.getElementById("recentList");


        /* =========================
           SETTINGS
           ========================= */

        const SYNC_OFFSET = 4;

        const RECENT_STORAGE_KEY =
            "musicLyricsRecentSongs";

        const MAX_RECENT =
            20;


        /* =========================
           STATE
           ========================= */

        let lyricLines = [];

        let currentIndex = -1;

        let recognitionTimer = null;

        let audioStartTime = 0;


        /* =========================
           LYRIC DATA
           ========================= */

        function lyricDataToString(data) {

            if (!data) {
                return "";
            }

            if (typeof data === "string") {
                return data;
            }

            if (Array.isArray(data)) {

                return data
                    .map(item => {

                        if (typeof item === "string") {
                            return item;
                        }

                        if (item.text) {
                            return item.text;
                        }

                        if (item.lyric) {
                            return item.lyric;
                        }

                        return "";
                    })
                    .join("\n");
            }

            if (typeof data === "object") {

                if (data.text) {
                    return data.text;
                }

                if (data.lyrics) {
                    return lyricDataToString(data.lyrics);
                }

                if (data.lines) {
                    return lyricDataToString(data.lines);
                }

                if (data.syncedLyrics) {
                    return data.syncedLyrics;
                }

                if (data.synced_lyrics) {
                    return data.synced_lyrics;
                }
            }

            return "";
        }


        /* =========================
           LRC TIME
           ========================= */

        function secondsToLRC(seconds) {

            const minutes =
                Math.floor(seconds / 60);

            const remaining =
                seconds % 60;

            return (
                "[" +
                String(minutes).padStart(2, "0") +
                ":" +
                remaining.toFixed(2).padStart(5, "0") +
                "]"
            );
        }


        /* =========================
           PARSE LRC
           ========================= */

        function parseLRC(lrc) {

            const lines = [];

            if (!lrc) {
                return lines;
            }

            const regex =
                /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

            for (const rawLine of lrc.split("\n")) {

                const text =
                    rawLine
                        .replace(regex, "")
                        .trim();

                if (!text) {
                    continue;
                }

                regex.lastIndex = 0;

                const match =
                    regex.exec(rawLine);

                if (!match) {
                    continue;
                }

                const minutes =
                    parseInt(match[1], 10);

                const seconds =
                    parseInt(match[2], 10);

                let fraction = 0;

                if (match[3]) {

                    const digits =
                        match[3].length;

                    fraction =
                        parseInt(match[3], 10) /
                        Math.pow(10, digits);
                }

                lines.push({
                    time:
                        minutes * 60 +
                        seconds +
                        fraction,

                    text
                });
            }

            lines.sort(
                (a, b) =>
                    a.time - b.time
            );

            return lines;
        }


        /* =========================
           DISPLAY LYRICS
           ========================= */

        function displayLyrics(lyrics) {

            lyricsContainer.innerHTML = "";

            lyricLines = [];

            currentIndex = -1;

            const lyricText =
                lyricDataToString(lyrics);

            if (!lyricText) {

                lyricsContainer.innerHTML =
                    `<div class="lyric-line">
                        Lyrics not found
                    </div>`;

                return;
            }

            lyricLines =
                parseLRC(lyricText);

            if (lyricLines.length === 0) {

                const plainLines =
                    lyricText
                        .split("\n")
                        .map(x => x.trim())
                        .filter(Boolean);

                lyricLines =
                    plainLines.map(text => ({
                        time: 0,
                        text
                    }));
            }

            lyricLines.forEach(
                (line, index) => {

                    const element =
                        document.createElement("div");

                    element.className =
                        "lyric-line";

                    element.textContent =
                        line.text;

                    element.dataset.index =
                        index;

                    element.addEventListener(
                        "click",
                        () => {

                            startEstimatedSync(
                                line.time,
                                false
                            );
                        }
                    );

                    lyricsContainer.appendChild(
                        element
                    );
                }
            );
        }


        /* =========================
           UPDATE ACTIVE LYRIC
           ========================= */

        function updateActiveLyric(time) {

            if (!lyricLines.length) {
                return;
            }

            let index = 0;

            for (
                let i = 0;
                i < lyricLines.length;
                i++
            ) {

                if (
                    lyricLines[i].time <= time
                ) {
                    index = i;
                } else {
                    break;
                }
            }

            if (index === currentIndex) {
                return;
            }

            currentIndex = index;

            const elements =
                lyricsContainer.querySelectorAll(
                    ".lyric-line"
                );

            elements.forEach(
                (element, i) => {

                    element.classList.toggle(
                        "active",
                        i === currentIndex
                    );
                }
            );

            const active =
                elements[currentIndex];

            if (active) {

                active.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }
        }


        /* =========================
           ESTIMATED SYNC
           ========================= */

        function startEstimatedSync(
            startAt = 0,
            applyOffset = true
        ) {

            stopEstimatedSync();

            const offset =
                applyOffset
                    ? SYNC_OFFSET
                    : 0;

            audioStartTime =
                Date.now() / 1000 -
                startAt -
                offset;

            recognitionTimer =
                setInterval(() => {

                    const elapsed =
                        Date.now() / 1000 -
                        audioStartTime;

                    updateActiveLyric(
                        elapsed
                    );

                }, 100);
        }


        function stopEstimatedSync() {

            if (recognitionTimer) {

                clearInterval(
                    recognitionTimer
                );

                recognitionTimer = null;
            }
        }


        /* =========================
           SAFE TEXT
           ========================= */

        function getSafeTitle(data) {

            return (
                data?.title ||
                data?.song?.title ||
                data?.track?.title ||
                "Unknown Song"
            );
        }


        function getSafeArtist(data) {

            return (
                data?.artist ||
                data?.artistName ||
                data?.song?.artist ||
                data?.song?.subtitle ||
                data?.track?.artist ||
                "Unknown Artist"
            );
        }


        /* =========================
           FIND ARTWORK
           ========================= */

        function getArtwork(data) {

            const possibleImages = [

                data?.song?.images?.background,

                data?.song?.images?.coverarthq,

                data?.song?.images?.coverart,

                data?.song?.artwork,

                data?.artwork,

                data?.coverart,

                data?.coverArt,

                data?.image,

                data?.song?.share?.image,

                data?.share?.image,

                data?.track?.images?.coverart

            ];

            for (
                const image of possibleImages
            ) {

                if (
                    typeof image === "string" &&
                    image.startsWith("http")
                ) {

                    return image;
                }
            }

            return "";
        }


        /* =========================
           SET ALBUM BACKGROUND
           ========================= */

        function setAlbumBackground(data) {

            const artwork =
                getArtwork(data);

            console.log(
                "Artwork URL:",
                artwork
            );

            if (!artwork) {

                albumBackground.style.opacity =
                    "0";

                albumBackground.style.backgroundImage =
                    "none";

                return;
            }

            albumBackground.style.backgroundImage =
                `url("${artwork}")`;

            albumBackground.style.opacity =
                "1";
        }


        /* =========================
           RECENT SONGS
           ========================= */

        function getRecentSongs() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        RECENT_STORAGE_KEY
                    ) || "[]"
                );

            } catch (error) {

                console.error(
                    "Could not load recents:",
                    error
                );

                return [];
            }
        }


        function saveRecentSong(data) {

            const title =
                getSafeTitle(data);

            const artist =
                getSafeArtist(data);

            const artwork =
                getArtwork(data);

            const lyrics =
                lyricDataToString(
                    data?.lyrics ||
                    data?.syncedLyrics ||
                    data?.synced_lyrics ||
                    data?.lyricText ||
                    data?.lrc ||
                    data?.lines ||
                    data?.lyricData ||
                    data?.lyric_data
                );

            const matchPosition =
                Number(
                    data?.matchPosition ??
                    data?.timecode ??
                    data?.song?.matchPosition ??
                    0
                );

            let recent =
                getRecentSongs();

            recent =
                recent.filter(song =>
                    !(
                        song.title === title &&
                        song.artist === artist
                    )
                );

            recent.unshift({

                title,

                artist,

                lyrics,

                artwork,

                matchPosition,

                savedAt:
                    Date.now()
            });

            recent =
                recent.slice(
                    0,
                    MAX_RECENT
                );

            localStorage.setItem(
                RECENT_STORAGE_KEY,
                JSON.stringify(recent)
            );

            renderRecentSongs();
        }


        /* =========================
           RECENT TIME
           ========================= */

        function relativeTime(timestamp) {

            const seconds =
                Math.floor(
                    (Date.now() - timestamp) /
                    1000
                );

            if (seconds < 60) {
                return "Just now";
            }

            const minutes =
                Math.floor(
                    seconds / 60
                );

            if (minutes < 60) {
                return (
                    minutes +
                    (minutes === 1
                        ? " minute ago"
                        : " minutes ago")
                );
            }

            const hours =
                Math.floor(
                    minutes / 60
                );

            if (hours < 24) {
                return (
                    hours +
                    (hours === 1
                        ? " hour ago"
                        : " hours ago")
                );
            }

            const days =
                Math.floor(
                    hours / 24
                );

            return (
                days +
                (days === 1
                    ? " day ago"
                    : " days ago")
            );
        }


        /* =========================
           RENDER RECENTS
           ========================= */

        function renderRecentSongs() {

            const recent =
                getRecentSongs();

            recentList.innerHTML = "";

            if (!recent.length) {

                recentList.innerHTML =
                    `<div class="emptyRecent">
                        No recent songs yet.
                    </div>`;

                return;
            }

            recent.forEach(song => {

                const item =
                    document.createElement("div");

                item.className =
                    "recentItem";

                const artwork =
                    document.createElement("img");

                artwork.className =
                    "recentArtwork";

                if (song.artwork) {

                    artwork.src =
                        song.artwork;

                } else {

                    artwork.style.display =
                        "none";
                }

                const text =
                    document.createElement("div");

                text.className =
                    "recentText";

                text.innerHTML = `
                    <div class="recentTitle">
                        ${escapeHtml(song.title)}
                    </div>

                    <div class="recentArtist">
                        ${escapeHtml(song.artist)}
                    </div>

                    <div class="recentTime">
                        ${relativeTime(song.savedAt)}
                    </div>
                `;

                item.appendChild(
                    artwork
                );

                item.appendChild(
                    text
                );

                item.addEventListener(
                    "click",
                    () => {

                        loadRecentSong(
                            song
                        );
                    }
                );

                recentList.appendChild(
                    item
                );
            });
        }


        /* =========================
           ESCAPE HTML
           ========================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =========================
           LOAD RECENT
           ========================= */

        function loadRecentSong(song) {

            stopEstimatedSync();

            songTitle.textContent =
                song.title;

            songArtist.textContent =
                song.artist;

            songInfo.style.display =
                "block";

            displayLyrics(
                song.lyrics
            );

            if (song.artwork) {

                albumBackground.style.backgroundImage =
                    `url("${song.artwork}")`;

                albumBackground.style.opacity =
                    "1";

            } else {

                albumBackground.style.opacity =
                    "0";
            }

            recentPanel.style.display =
                "none";

            statusElement.textContent =
                "Loaded from Recents";

            startEstimatedSync(
                Number(
                    song.matchPosition || 0
                ),
                false
            );
        }


        /* =========================
           OPEN RECENTS
           ========================= */

        recentButton.addEventListener(
            "click",
            () => {

                renderRecentSongs();

                recentPanel.style.display =
                    "flex";
            }
        );


        /* =========================
           CLOSE RECENTS
           ========================= */

        closeRecent.addEventListener(
            "click",
            () => {

                recentPanel.style.display =
                    "none";
            }
        );


        /* =========================
           RECOGNIZE SONG
           ========================= */

        async function recognizeSong() {

            try {

                button.classList.add(
                    "listening"
                );

                recognizingElement.style.display =
                    "none";

                statusElement.textContent =
                    "Listening...";

                const stream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true
                        });

                const mediaRecorder =
                    new MediaRecorder(
                        stream
                    );

                const chunks = [];

                mediaRecorder.ondataavailable =
                    event => {

                        if (
                            event.data &&
                            event.data.size > 0
                        ) {

                            chunks.push(
                                event.data
                            );
                        }
                    };

                mediaRecorder.onstop =
                    async () => {

                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );

                        const blob =
                            new Blob(
                                chunks,
                                {
                                    type:
                                        "audio/webm"
                                }
                            );

                        await sendAudio(
                            blob
                        );
                    };

                mediaRecorder.start();

                setTimeout(
                    () => {

                        if (
                            mediaRecorder.state !==
                            "inactive"
                        ) {

                            mediaRecorder.stop();
                        }

                    },
                    8000
                );

            } catch (error) {

                console.error(
                    error
                );

                recognizingElement.style.display =
                    "none";

                button.classList.remove(
                    "listening"
                );

                statusElement.textContent =
                    "Microphone permission denied";
            }
        }


        /* =========================
           SEND AUDIO
           ========================= */

        async function sendAudio(blob) {

            try {

                statusElement.textContent =
                    "Identifying...";

                const formData =
                    new FormData();

                formData.append(
                    "audio",
                    blob,
                    "recording.webm"
                );

                const response =
                    await fetch(
                        "/identify-shazam",
                        {
                            method: "POST",
                            body: formData
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );
                }

                const data =
                    await response.json();

                console.log(
                    "Shazam response:",
                    data
                );

                const title =
                    getSafeTitle(data);

                const artist =
                    getSafeArtist(data);

                const lyrics =
                    data.lyrics ||
                    data.syncedLyrics ||
                    data.synced_lyrics ||
                    data.lyricText ||
                    data.lrc ||
                    data.lines ||
                    data.lyricData ||
                    data.lyric_data ||
                    "";

                const matchPosition =
                    Number(
                        data.matchPosition ??
                        data.timecode ??
                        data.song?.matchPosition ??
                        0
                    );

                songTitle.textContent =
                    title;

                songArtist.textContent =
                    artist;

                songInfo.style.display =
                    "block";

                setAlbumBackground(
                    data
                );

                displayLyrics(
                    lyrics
                );

                saveRecentSong(
                    data
                );

                statusElement.textContent =
                    title +
                    " • " +
                    artist;

                startEstimatedSync(
                    matchPosition,
                    true
                );

            } catch (error) {

                console.error(
                    "Recognition error:",
                    error
                );

                statusElement.textContent =
                    "Could not recognize song";

            } finally {

                recognizingElement.style.display =
                    "none";

                button.classList.remove(
                    "listening"
                );
            }
        }


        /* =========================
           BUTTON
           ========================= */

        button.addEventListener(
            "click",
            recognizeSong
        );


        /* =========================
           INITIALIZE
           ========================= */

        renderRecentSongs();

    </script>

</body>
</html>
