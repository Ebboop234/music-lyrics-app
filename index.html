
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSIC Lyrics">
<title>MUSIC Lyrics</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090a10;
    background-image:
        radial-gradient(ellipse at 50% -15%, rgba(105,82,180,.18), transparent 55%),
        linear-gradient(180deg,#0b0c13 0%,#08090e 100%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}

#albumBackground {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    z-index: 0;
    pointer-events: none;
    transition: opacity .6s ease;
}

#albumOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom,rgba(7,8,14,.78),rgba(7,8,14,.48) 45%,rgba(7,8,14,.9));
    z-index: 1;
    pointer-events: none;
}

.app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    z-index: 2;
}

.header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 115px;
    padding: max(20px,env(safe-area-inset-top)) 20px 10px;
    text-align: center;
    z-index: 20;
    background: linear-gradient(to bottom,rgba(9,10,16,.92),rgba(9,10,16,.25));
}

.title {
    margin-top: 12px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 4px;
    font-size: 14px;
    color: #b9b7c8;
    opacity: .78;
}

.screen {
    display: none;
    position: absolute;
    inset: 115px 0 145px;
    overflow-y: auto;
    scrollbar-width: none;
}

.screen::-webkit-scrollbar { display: none; }
.screen.active { display: block; }

/* HOME */

#homeScreen {
    padding: 20px;
    text-align: center;
}

#homeScreen.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* LYRICS */

#lyricsScreen {
    padding: 0 20px;
    text-align: center;
}

#songInfo {
    display: none;
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 15px 12px;
    margin: 0 -20px;
    text-align: center;
    background: rgba(13,14,22,.84);
    border-bottom: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

#songTitle {
    font-size: 21px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#songArtist {
    margin-top: 4px;
    font-size: 14px;
    opacity: .7;
}

#lyricsContainer {
    padding: 25px 5px 150px;
    text-align: center;
}

.lyric-line {
    padding: 9px 0;
    font-size: 21px;
    line-height: 1.35;
    font-weight: 600;
    opacity: .42;
    transition: opacity .25s,transform .25s,font-size .25s;
    cursor: pointer;
}

.lyric-line.active {
    opacity: 1;
    font-size: 25px;
    transform: scale(1.03);
    color: #e0d5ff;
    text-shadow: 0 0 22px rgba(180,150,255,.18);
}

/* RECENTS AND FAVORITES */

#recentsScreen,
#favoritesScreen {
    padding: 22px 18px 34px;
    background: linear-gradient(180deg,rgba(18,19,29,.5),rgba(9,10,16,.08));
}

.recentHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    padding: 0 2px 13px;
    border-bottom: 1px solid rgba(255,255,255,.09);
}

.recentHeader h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -.65px;
    font-weight: 750;
}

.recentCount {
    font-size: 12px;
    color: #aaa7bb;
}

.recentItem {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px;
    margin-bottom: 11px;
    border: 1px solid rgba(255,255,255,.075);
    border-radius: 17px;
    background: linear-gradient(135deg,rgba(34,35,49,.88),rgba(20,21,31,.88));
    box-shadow: 0 7px 20px rgba(0,0,0,.16);
    cursor: pointer;
    transition: transform .18s ease,border-color .18s ease;
}

.recentItem:active {
    transform: scale(.975);
    border-color: rgba(183,157,255,.38);
}

.recentArtwork {
    width: 60px;
    height: 60px;
    border-radius: 11px;
    object-fit: cover;
    background: rgba(255,255,255,.1);
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(0,0,0,.28);
}

.recentText {
    min-width: 0;
    flex: 1;
}

.recentTitle {
    font-size: 15px;
    letter-spacing: -.15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recentArtist {
    margin-top: 3px;
    font-size: 13px;
    color: #c1bfd0;
    opacity: .8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recentTime {
    margin-top: 4px;
    font-size: 11px;
    color: #aaa7bb;
    opacity: .75;
}

.recentDelete {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    color: #c7c4d2;
    font-size: 19px;
    cursor: pointer;
}

.recentDelete:active {
    background: rgba(255,59,48,.7);
}

.emptyRecent {
    text-align: center;
    margin: 76px 14px 0;
    padding: 25px 20px;
    border: 1px dashed rgba(255,255,255,.14);
    border-radius: 18px;
    background: rgba(255,255,255,.025);
    color: #c2bfd0;
    font-size: 15px;
    line-height: 1.7;
}

/* SONG DETAILS */

#detailsScreen {
    padding: 15px 24px 35px;
    text-align: center;
}

.detailsBack {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 8px 0;
    margin-bottom: 20px;
    cursor: pointer;
}

#detailsArtwork {
    width: min(72vw,280px);
    height: min(72vw,280px);
    max-width: 280px;
    max-height: 280px;
    object-fit: cover;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 18px 48px rgba(0,0,0,.48);
    margin: 5px auto 24px;
    display: block;
}

#detailsTitle {
    font-size: 27px;
    line-height: 1.2;
    font-weight: 800;
    overflow-wrap: anywhere;
}

#detailsArtist {
    font-size: 17px;
    opacity: .68;
    margin-top: 9px;
}

/* FAVORITE HEART */

#favoriteButton {
    margin-top: 18px;
    padding: 12px 24px;
    border: 1px solid rgba(190,170,255,.25);
    border-radius: 30px;
    background: rgba(153,126,220,.11);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .18s ease,background .18s ease;
}

#favoriteButton:active { transform: scale(.96); }

#favoriteButton.favorited {
    color: #ff7895;
    border-color: rgba(255,120,149,.4);
    background: rgba(255,90,125,.12);
}

.detailsMetadata {
    margin-top: 25px;
    padding: 5px 17px;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px;
    background: rgba(25,26,37,.72);
    text-align: left;
}

.metadataRow {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255,255,255,.09);
    font-size: 14px;
}

.metadataRow:last-child { border-bottom: none; }
.metadataLabel { opacity: .55; }

.metadataValue {
    font-weight: 600;
    text-align: right;
    overflow-wrap: anywhere;
}

/* STATUS */

#status {
    position: absolute;
    left: 15px;
    right: 15px;
    top: calc(50% + 95px);
    text-align: center;
    font-size: 14px;
    color: #d4d0e2;
    opacity: .7;
    z-index: 15;
    pointer-events: none;
}

/* RECOGNITION BUTTON */

#recognizeButton {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 142px;
    height: 142px;
    border: 5px solid rgba(255,255,255,.09);
    border-radius: 50%;
    background: linear-gradient(135deg,#ff0055,#ff7a00,#ffe600,#00e676,#00b8ff,#6c4cff,#ff00c8);
    color: white;
    font-size: 70px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000;
    box-shadow:
        0 0 0 10px rgba(255,255,255,.025),
        0 12px 45px rgba(100,70,180,.28);
    animation: rainbow 4s linear infinite,pulse 1.5s ease-in-out infinite;
}

#recognizeButton::before {
    content: "♪";
    font-family: Arial, sans-serif;
    font-size: 76px;
    font-weight: 400;
    line-height: 1;
    color: white;
}

#recognizeButton:active {
    animation: none;
    transform: translate(-50%,-50%) scale(.92);
}

#recognizeButton:disabled { opacity: .7; }

@keyframes pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.15); }
}

@keyframes rainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

#recognizeButton.listening {
    animation: rainbow 2s linear infinite,pulse .9s ease-in-out infinite;
}

#status.listening {
    opacity: 1;
    font-weight: 600;
}

/* BOTTOM NAVIGATION */

#tabBar {
    position: fixed;
    bottom: calc(12px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(370px,94vw);
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    padding: 5px 8px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 27px;
    background: rgba(17,18,27,.88);
    box-shadow: 0 12px 34px rgba(0,0,0,.4);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 4000;
}

.tabButton {
    flex: 1;
    min-width: 0;
    height: 70px;
    padding: 0;
    border: none;
    background: transparent;
    color: #9997a8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
}

.tabIcon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    background: transparent;
    border: 1px solid transparent;
    box-shadow: none;
    transition: background .2s,border-color .2s,transform .2s;
}

.tabButton.active { color: #d4c5ff; }

.tabButton.active .tabIcon {
    color: #e1d6ff;
    background: rgba(165,137,235,.17);
    border-color: rgba(190,170,255,.2);
    box-shadow: 0 0 20px rgba(155,125,230,.12);
    transform: translateY(-2px);
}

.tabButton:active .tabIcon { transform: scale(.92); }

.app.lyrics-view .header { display: none; }

.app.lyrics-view #lyricsScreen {
    top: 0;
    bottom: 112px;
}

.app.lyrics-view #songInfo {
    padding-top: max(24px,env(safe-area-inset-top));
    background: linear-gradient(to bottom,rgba(8,8,8,.72),rgba(8,8,8,.22));
    border-bottom: none;
}

@media (max-height:650px) {
    #detailsArtwork {
        width: 190px;
        height: 190px;
    }
}
</style>
</head>

<body>

<canvas id="albumBackground" width="32" height="32"></canvas>
<div id="albumOverlay"></div>

<div class="app">

<header class="header">
    <div class="title">MUSIC Lyrics</div>
    <div class="subtitle" id="subtitle">Discover what's playing</div>
</header>

<section id="homeScreen" class="screen active"></section>

<section id="lyricsScreen" class="screen">
    <div id="songInfo">
        <div id="songTitle"></div>
        <div id="songArtist"></div>
    </div>
    <div id="lyricsContainer"></div>
</section>

<section id="recentsScreen" class="screen">
    <div class="recentHeader">
        <h2>Recent Songs</h2>
        <span class="recentCount" id="recentCount"></span>
    </div>
    <div id="recentList"></div>
</section>

<section id="detailsScreen" class="screen">
    <button class="detailsBack" id="detailsBack" type="button">
        <span>‹</span>
        <span id="backLabel">Back to Recents</span>
    </button>

    <img id="detailsArtwork" alt="Album artwork">

    <div id="detailsTitle"></div>
    <div id="detailsArtist"></div>

    <button id="favoriteButton" type="button">
        ♡ Add to Favorites
    </button>

    <div class="detailsMetadata" id="detailsMetadata"></div>
</section>

<section id="favoritesScreen" class="screen">
    <div class="recentHeader">
        <h2>Favorites</h2>
        <span class="recentCount" id="favoriteCount"></span>
    </div>
    <div id="favoriteList"></div>
</section>

<div id="status">Ready</div>

<button id="recognizeButton" aria-label="Recognize song" type="button"></button>

</div>

<nav id="tabBar">

    <button class="tabButton active" id="homeTab" type="button">
        <span class="tabIcon">⌂</span>
        <span>Home</span>
    </button>

    <button class="tabButton" id="lyricsTab" type="button">
        <span class="tabIcon">♫</span>
        <span>Lyrics</span>
    </button>

    <button class="tabButton" id="recentsTab" type="button">
        <span class="tabIcon">◷</span>
        <span>Recents</span>
    </button>

    <button class="tabButton" id="favoritesTab" type="button">
        <span class="tabIcon">♡</span>
        <span>Favorites</span>
    </button>

</nav>

<script>

/* ELEMENTS */

const app = document.querySelector(".app");
const button = document.getElementById("recognizeButton");
const lyricsContainer = document.getElementById("lyricsContainer");
const statusElement = document.getElementById("status");
const songInfo = document.getElementById("songInfo");
const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const albumBackground = document.getElementById("albumBackground");

const homeScreen = document.getElementById("homeScreen");
const lyricsScreen = document.getElementById("lyricsScreen");
const recentsScreen = document.getElementById("recentsScreen");
const detailsScreen = document.getElementById("detailsScreen");
const favoritesScreen = document.getElementById("favoritesScreen");

const homeTab = document.getElementById("homeTab");
const lyricsTab = document.getElementById("lyricsTab");
const recentsTab = document.getElementById("recentsTab");
const favoritesTab = document.getElementById("favoritesTab");

const recentList = document.getElementById("recentList");
const recentCount = document.getElementById("recentCount");

const favoriteList = document.getElementById("favoriteList");
const favoriteCount = document.getElementById("favoriteCount");
const favoriteButton = document.getElementById("favoriteButton");

const detailsBack = document.getElementById("detailsBack");
const backLabel = document.getElementById("backLabel");
const detailsArtwork = document.getElementById("detailsArtwork");
const detailsTitle = document.getElementById("detailsTitle");
const detailsArtist = document.getElementById("detailsArtist");
const detailsMetadata = document.getElementById("detailsMetadata");
const subtitle = document.getElementById("subtitle");

/* SETTINGS */

const SYNC_OFFSET = 4;
const RECENT_STORAGE_KEY = "musicLyricsRecentSongs";
const FAVORITES_STORAGE_KEY = "musicLyricsFavorites";
const MAX_RECENT = 20;

/* STATE */

let lyricLines = [];
let currentIndex = -1;
let recognitionTimer = null;
let audioStartTime = 0;
let currentView = "home";
let currentSong = null;
let selectedRecentSong = null;
let detailsReturnView = "recents";
let isRecognizing = false;

/* NAVIGATION */

function showScreen(view) {
    currentView = view;

    app.classList.toggle("lyrics-view",view === "lyrics");

    [
        homeScreen,
        lyricsScreen,
        recentsScreen,
        detailsScreen,
        favoritesScreen
    ].forEach(screen => screen.classList.remove("active"));

    [
        homeTab,
        lyricsTab,
        recentsTab,
        favoritesTab
    ].forEach(tab => tab.classList.remove("active"));

    if (view === "home") {
        homeScreen.classList.add("active");
        homeTab.classList.add("active");
        subtitle.textContent = "Discover what's playing";
        button.style.display = "flex";
        statusElement.style.display = "block";
        clearBackground();
        statusElement.textContent = "Ready";
    }

    else if (view === "lyrics") {
        lyricsScreen.classList.add("active");
        lyricsTab.classList.add("active");
        button.style.display = "none";
        statusElement.style.display = "none";
    }

    else if (view === "recents") {
        recentsScreen.classList.add("active");
        recentsTab.classList.add("active");
        subtitle.textContent = "Your listening history";
        button.style.display = "none";
        statusElement.style.display = "none";
        renderRecentSongs();
    }

    else if (view === "favorites") {
        favoritesScreen.classList.add("active");
        favoritesTab.classList.add("active");
        subtitle.textContent = "Your favorite songs";
        button.style.display = "none";
        statusElement.style.display = "none";
        renderFavorites();
    }

    else if (view === "details") {
        detailsScreen.classList.add("active");
        subtitle.textContent = "Song Details";
        button.style.display = "none";
        statusElement.style.display = "none";
    }
}

homeTab.addEventListener("click",() => showScreen("home"));

lyricsTab.addEventListener("click",() => {
    if (currentSong) showScreen("lyrics");
    else showScreen("home");
});

recentsTab.addEventListener("click",() => showScreen("recents"));

favoritesTab.addEventListener("click",() => showScreen("favorites"));

detailsBack.addEventListener("click",() => {
    showScreen(detailsReturnView);
});

/* LYRIC DATA */

function lyricDataToString(data) {
    if (!data) return "";

    if (typeof data === "string") return data;

    if (Array.isArray(data)) {
        return data.map(item => {
            if (typeof item === "string") return item;
            if (item.text) return item.text;
            if (item.lyric) return item.lyric;
            return "";
        }).join("\n");
    }

    if (typeof data === "object") {
        if (data.text) return data.text;
        if (data.lyrics) return lyricDataToString(data.lyrics);
        if (data.lines) return lyricDataToString(data.lines);
        if (data.syncedLyrics) return data.syncedLyrics;
        if (data.synced_lyrics) return data.synced_lyrics;
    }

    return "";
}

/* PARSE LRC */

function parseLRC(lrc) {
    const lines = [];

    if (!lrc) return lines;

    const regex = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

    for (const rawLine of lrc.split("\n")) {
        const matches = [...rawLine.matchAll(regex)];
        const text = rawLine.replace(regex,"").trim();

        if (!text || !matches.length) continue;

        for (const match of matches) {
            const minutes = parseInt(match[1],10);
            const seconds = parseInt(match[2],10);

            let fraction = 0;

            if (match[3]) {
                fraction = parseInt(match[3],10) /
                    Math.pow(10,match[3].length);
            }

            lines.push({
                time: minutes * 60 + seconds + fraction,
                text
            });
        }
    }

    lines.sort((a,b) => a.time - b.time);
    return lines;
}

/* DISPLAY LYRICS */

function displayLyrics(lyrics) {
    lyricsContainer.innerHTML = "";
    lyricLines = [];
    currentIndex = -1;

    const lyricText = lyricDataToString(lyrics);

    if (!lyricText) {
        const empty = document.createElement("div");
        empty.className = "lyric-line";
        empty.textContent = "Lyrics not found";
        lyricsContainer.appendChild(empty);
        return;
    }

    lyricLines = parseLRC(lyricText);

    if (lyricLines.length === 0) {
        lyricLines = lyricText
            .split("\n")
            .map(x => x.trim())
            .filter(Boolean)
            .map(text => ({time:0,text}));
    }

    lyricLines.forEach((line,index) => {
        const element = document.createElement("div");
        element.className = "lyric-line";
        element.textContent = line.text;

        element.addEventListener("click",() => {
            startEstimatedSync(line.time,false);
        });

        lyricsContainer.appendChild(element);
    });
}

/* ACTIVE LYRIC */

function updateActiveLyric(time) {
    if (!lyricLines.length) return;

    let index = 0;

    for (let i = 0; i < lyricLines.length; i++) {
        if (lyricLines[i].time <= time) index = i;
        else break;
    }

    if (index === currentIndex) return;

    currentIndex = index;

    const elements = lyricsContainer.querySelectorAll(".lyric-line");

    elements.forEach((element,i) => {
        element.classList.toggle("active",i === currentIndex);
    });

    const active = elements[currentIndex];

    if (active) {
        active.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }
}

/* LYRIC SYNCHRONIZATION */

function startEstimatedSync(startAt = 0,applyOffset = true) {
    stopEstimatedSync();

    const offset = applyOffset ? SYNC_OFFSET : 0;
    audioStartTime = Date.now() / 1000 - startAt - offset;

    recognitionTimer = setInterval(() => {
        const elapsed = Date.now() / 1000 - audioStartTime;
        updateActiveLyric(elapsed);
    },100);
}

function stopEstimatedSync() {
    if (recognitionTimer) {
        clearInterval(recognitionTimer);
        recognitionTimer = null;
    }
}

/* SONG INFORMATION */

function getSafeTitle(data) {
    return data?.title ||
        data?.song?.title ||
        data?.track?.title ||
        "Unknown Song";
}

function getSafeArtist(data) {
    return data?.artist ||
        data?.artistName ||
        data?.song?.artist ||
        data?.song?.subtitle ||
        data?.track?.artist ||
        "Unknown Artist";
}

function getSafeAlbum(data) {
    return data?.album ||
        data?.albumName ||
        data?.song?.album ||
        data?.track?.album ||
        "";
}

function getSafeReleaseDate(data) {
    return data?.releaseDate ||
        data?.release_date ||
        data?.releaseYear ||
        data?.release_year ||
        data?.song?.releaseDate ||
        data?.song?.release_date ||
        data?.track?.releaseDate ||
        data?.track?.release_date ||
        "";
}

function getSafeDuration(data) {
    const duration =
        data?.duration ??
        data?.durationSeconds ??
        data?.duration_seconds ??
        data?.song?.duration ??
        data?.track?.duration ??
        "";

    if (duration === "" || duration === null) return "";

    if (typeof duration === "string" && duration.includes(":")) {
        return duration;
    }

    const seconds = Number(duration);

    if (!Number.isFinite(seconds) || seconds <= 0) return "";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return minutes + ":" + String(remainingSeconds).padStart(2,"0");
}

/* ARTWORK */

function getArtwork(data) {
    const possibleImages = [
        data?.song?.images?.background,
        data?.song?.images?.coverarthq,
        data?.song?.images?.coverart,
        data?.song?.artwork,
        data?.artwork,
        data?.coverart,
        data?.coverArt,
        data?.image,
        data?.song?.share?.image,
        data?.share?.image,
        data?.track?.images?.coverart
    ];

    for (const image of possibleImages) {
        if (typeof image === "string" && image.startsWith("http")) {
            return image;
        }
    }

    return "";
}

/* ALBUM BACKGROUND */

let backgroundRequest = 0;

function clearBackground() {
    backgroundRequest++;
    albumBackground.style.opacity = "0";
}

function showBackground(url) {
    if (!url) {
        clearBackground();
        return;
    }

    url = url.replace(/^http:\/\//i,"https://");

    const request = ++backgroundRequest;
    const img = new Image();

    img.onload = () => {
        if (request !== backgroundRequest) return;

        const ctx = albumBackground.getContext("2d");
        const screenRatio = window.innerWidth / window.innerHeight;

        let sw = img.naturalWidth;
        let sh = img.naturalHeight;

        if (sw / sh > screenRatio) sw = sh * screenRatio;
        else sh = sw / screenRatio;

        const sx = (img.naturalWidth - sw) / 2;
        const sy = (img.naturalHeight - sh) / 2;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.clearRect(0,0,32,32);

        ctx.drawImage(img,sx,sy,sw,sh,0,0,32,32);
        albumBackground.style.opacity = "1";
    };

    img.onerror = () => {
        if (request === backgroundRequest) {
            albumBackground.style.opacity = "0";
        }
    };

    img.src = url;
}

/* STORAGE HELPERS */

function getStoredSongs(key) {
    try {
        const saved = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(saved) ? saved : [];
    } catch (error) {
        console.error("Could not load saved songs:",error);
        return [];
    }
}

function saveStoredSongs(key,songs) {
    try {
        localStorage.setItem(key,JSON.stringify(songs));
        return true;
    } catch (error) {
        console.error("Could not save songs:",error);
        return false;
    }
}

function getRecentSongs() {
    return getStoredSongs(RECENT_STORAGE_KEY);
}

function getFavorites() {
    return getStoredSongs(FAVORITES_STORAGE_KEY);
}

/* FAVORITE STATUS */

function isFavorite(song) {
    if (!song) return false;

    return getFavorites().some(item =>
        item.title === song.title &&
        item.artist === song.artist
    );
}

/* HEART BUTTON */

function updateFavoriteButton() {
    if (!selectedRecentSong) return;

    const saved = isFavorite(selectedRecentSong);

    favoriteButton.textContent = saved
        ? "♥ Added to Favorites"
        : "♡ Add to Favorites";

    favoriteButton.classList.toggle("favorited",saved);
}

function toggleFavorite() {
    if (!selectedRecentSong) return;

    let favorites = getFavorites();

    const alreadySaved = favorites.some(item =>
        item.title === selectedRecentSong.title &&
        item.artist === selectedRecentSong.artist
    );

    if (alreadySaved) {
        favorites = favorites.filter(item =>
            !(item.title === selectedRecentSong.title &&
              item.artist === selectedRecentSong.artist)
        );
    } else {
        favorites.unshift({
            ...selectedRecentSong,
            favoriteSavedAt: Date.now()
        });
    }

    if (!saveStoredSongs(FAVORITES_STORAGE_KEY,favorites)) {
        return;
    }

    updateFavoriteButton();
    renderFavorites();
}

favoriteButton.addEventListener("click",toggleFavorite);

/* SAVE RECENT SONG */

function saveRecentSong(data,recognizedLyrics) {
    const title = getSafeTitle(data);
    const artist = getSafeArtist(data);

    const lyrics = lyricDataToString(
        recognizedLyrics ||
        data?.lyrics ||
        data?.syncedLyrics ||
        data?.synced_lyrics ||
        data?.lyricText ||
        data?.lrc ||
        data?.lines ||
        data?.lyricData ||
        data?.lyric_data
    );

    const matchPosition = Number(
        data?.matchPosition ??
        data?.timecode ??
        data?.song?.matchPosition ??
        0
    );

    let recent = getRecentSongs();

    recent = recent.filter(song =>
        !(song.title === title && song.artist === artist)
    );

    recent.unshift({
        title,
        artist,
        album: getSafeAlbum(data),
        releaseDate: getSafeReleaseDate(data),
        duration: getSafeDuration(data),
        lyrics,
        artwork: getArtwork(data),
        matchPosition,
        savedAt: Date.now()
    });

    recent = recent.slice(0,MAX_RECENT);

    saveStoredSongs(RECENT_STORAGE_KEY,recent);

    renderRecentSongs();
}

/* DELETE RECENT SONG */

function deleteRecentSong(song) {
    const recent = getRecentSongs().filter(saved =>
        !(saved.title === song.title &&
          saved.artist === song.artist)
    );

    saveStoredSongs(RECENT_STORAGE_KEY,recent);

    /* Favorites are stored separately. Deleting from Recents
       does not delete the song from Favorites. */

    renderRecentSongs();
}

/* RELATIVE TIME */

function relativeTime(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);

    if (seconds < 60) return "Just now";

    const minutes = Math.floor(seconds / 60);

    if (minutes < 60) {
        return minutes + (minutes === 1 ? " minute ago" : " minutes ago");
    }

    const hours = Math.floor(minutes / 60);

    if (hours < 24) {
        return hours + (hours === 1 ? " hour ago" : " hours ago");
    }

    const days = Math.floor(hours / 24);

    return days + (days === 1 ? " day ago" : " days ago");
}

/* SONG DETAILS */

function addMetadataRow(label,value) {
    if (!value) return;

    const row = document.createElement("div");
    row.className = "metadataRow";

    const labelElement = document.createElement("span");
    labelElement.className = "metadataLabel";
    labelElement.textContent = label;

    const valueElement = document.createElement("span");
    valueElement.className = "metadataValue";
    valueElement.textContent = value;

    row.appendChild(labelElement);
    row.appendChild(valueElement);

    detailsMetadata.appendChild(row);
}

function openSongDetails(song,source = "recents") {
    selectedRecentSong = song;
    detailsReturnView = source;

    backLabel.textContent = source === "favorites"
        ? "Back to Favorites"
        : "Back to Recents";

    detailsTitle.textContent = song.title || "Unknown Song";
    detailsArtist.textContent = song.artist || "Unknown Artist";

    detailsArtwork.style.display = song.artwork ? "block" : "none";

    if (song.artwork) {
        detailsArtwork.src = song.artwork;
    } else {
        detailsArtwork.removeAttribute("src");
    }

    detailsMetadata.innerHTML = "";

    addMetadataRow("Album",song.album);
    addMetadataRow("Release Date",song.releaseDate);
    addMetadataRow("Duration",song.duration);

    if (!detailsMetadata.children.length) {
        const row = document.createElement("div");
        row.className = "metadataRow";
        row.textContent = "No additional song information available";
        row.style.opacity = ".55";
        row.style.justifyContent = "center";
        detailsMetadata.appendChild(row);
    }

    updateFavoriteButton();
    showScreen("details");
}

/* RENDER SONG LIST */

function renderSongList(container,songs,source) {
    container.innerHTML = "";

    if (!songs.length) {
        const empty = document.createElement("div");
        empty.className = "emptyRecent";

        empty.textContent = source === "favorites"
            ? "No favorites yet. Tap the heart on a song's details page to save it."
            : "No recent songs yet. Songs you identify will appear here.";

        container.appendChild(empty);
        return;
    }

    songs.forEach(song => {
        const item = document.createElement("div");
        item.className = "recentItem";

        const artwork = document.createElement("img");
        artwork.className = "recentArtwork";
        artwork.alt = "";

        if (song.artwork) {
            artwork.src = song.artwork;
        } else {
            artwork.style.display = "none";
        }

        const text = document.createElement("div");
        text.className = "recentText";

        const title = document.createElement("div");
        title.className = "recentTitle";
        title.textContent = song.title || "Unknown Song";

        const artist = document.createElement("div");
        artist.className = "recentArtist";
        artist.textContent = song.artist || "Unknown Artist";

        const time = document.createElement("div");
        time.className = "recentTime";

        time.textContent = source === "favorites"
            ? "♥ Favorite"
            : relativeTime(song.savedAt || Date.now());

        text.appendChild(title);
        text.appendChild(artist);
        text.appendChild(time);

        item.appendChild(artwork);
        item.appendChild(text);

        if (source === "recents") {
            const deleteButton = document.createElement("button");
            deleteButton.className = "recentDelete";
            deleteButton.type = "button";
            deleteButton.textContent = "×";

            deleteButton.setAttribute(
                "aria-label",
                "Delete " + (song.title || "song")
            );

            deleteButton.addEventListener("click",event => {
                event.stopPropagation();
                deleteRecentSong(song);
            });

            item.appendChild(deleteButton);
        }

        item.addEventListener("click",() => {
            openSongDetails(song,source);
        });

        container.appendChild(item);
    });
}

/* RENDER RECENTS */

function renderRecentSongs() {
    const recent = getRecentSongs();

    recentCount.textContent = recent.length
        ? recent.length + (recent.length === 1 ? " song" : " songs")
        : "";

    renderSongList(recentList,recent,"recents");
}

/* RENDER FAVORITES */

function renderFavorites() {
    const favorites = getFavorites();

    favoriteCount.textContent = favorites.length
        ? favorites.length + (favorites.length === 1 ? " song" : " songs")
        : "";

    renderSongList(favoriteList,favorites,"favorites");
}

/* OPEN SAVED SONG LYRICS */

function loadRecentSong(song) {
    stopEstimatedSync();

    currentSong = song;

    songTitle.textContent = song.title || "Unknown Song";
    songArtist.textContent = song.artist || "Unknown Artist";

    songInfo.style.display = "block";

    displayLyrics(song.lyrics || "");

    showBackground(song.artwork || "");

    showScreen("lyrics");

    startEstimatedSync(
        Number(song.matchPosition || 0),
        false
    );
}

/* SHOW RECOGNIZED SONG */

function showRecognizedSong(data,lyrics,matchPosition,listenStartedAt) {
    const title = getSafeTitle(data);
    const artist = getSafeArtist(data);
    const artwork = getArtwork(data);

    currentSong = {
        title,
        artist,
        album: getSafeAlbum(data),
        releaseDate: getSafeReleaseDate(data),
        duration: getSafeDuration(data),
        lyrics: lyricDataToString(lyrics),
        artwork,
        matchPosition,
        savedAt: Date.now()
    };

    songTitle.textContent = title;
    songArtist.textContent = artist;
    songInfo.style.display = "block";

    showBackground(artwork);

    displayLyrics(lyrics);

    saveRecentSong(data,lyrics);

    showScreen("lyrics");

    const delay = listenStartedAt
        ? (Date.now() - listenStartedAt) / 1000
        : SYNC_OFFSET + 8;

    startEstimatedSync(matchPosition + delay,false);
}

/* RECOGNIZE SONG */

async function recognizeSong() {
    if (isRecognizing) return;

    isRecognizing = true;

    try {
        button.classList.add("listening");
        statusElement.classList.add("listening");
        button.disabled = true;
        statusElement.textContent = "Listening...";

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];

        const listenStartedAt = Date.now();

        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        mediaRecorder.onerror = event => {
            console.error("Recorder error:",event);
        };

        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(track => track.stop());

            const blob = new Blob(chunks,{
                type:"audio/webm"
            });

            await sendAudio(blob,listenStartedAt);
        };

        mediaRecorder.start();

        setTimeout(() => {
            if (mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
        },8000);

    } catch (error) {
        console.error(error);

        button.classList.remove("listening");
        statusElement.classList.remove("listening");
        button.disabled = false;
        isRecognizing = false;

        statusElement.textContent = "Microphone permission denied";
    }
}

/* SEND AUDIO */

async function sendAudio(blob,listenStartedAt) {
    button.classList.remove("listening");
    statusElement.classList.remove("listening");

    try {
        statusElement.textContent = "Identifying...";

        const formData = new FormData();

        formData.append("audio",blob,"recording.webm");

        const response = await fetch("/identify-shazam",{
            method:"POST",
            body:formData
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        const data = await response.json();

        console.log("Shazam response:",data);

        const lyrics =
            data.lyrics ||
            data.syncedLyrics ||
            data.synced_lyrics ||
            data.lyricText ||
            data.lrc ||
            data.lines ||
            data.lyricData ||
            data.lyric_data ||
            "";

        const matchPosition = Number(
            data.matchPosition ??
            data.timecode ??
            data.song?.matchPosition ??
            0
        );

        showRecognizedSong(
            data,
            lyrics,
            matchPosition,
            listenStartedAt
        );

    } catch (error) {
        console.error("Recognition error:",error);

        statusElement.textContent = "Could not recognize song. Try again.";

    } finally {
        button.classList.remove("listening");
        statusElement.classList.remove("listening");
        button.disabled = false;
        isRecognizing = false;
    }
}

/* BUTTON */

button.addEventListener("click",recognizeSong);

/* INITIALIZE */

renderRecentSongs();
renderFavorites();
showScreen("home");

</script>
