<!DOCTYPE html><html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Music Lyrics">

<title>MUSIC Lyrics</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding:
            env(safe-area-inset-top)
            16px
            env(safe-area-inset-bottom)
            16px;

        min-height: 100vh;

        background:
            radial-gradient(
                circle at top,
                #252525 0%,
                #111111 45%,
                #080808 100%
            );

        color: white;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Arial,
            sans-serif;

        text-align: center;
        overflow-x: hidden;
    }

    .app {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 28px 0 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #888;
        font-size: 15px;
        margin-bottom: 24px;
    }

    /* =========================
       IDENTIFY BUTTON
    ========================= */

    .identify-button {
        width: 92px;
        height: 92px;

        margin: 18px auto 22px;

        border-radius: 50%;
        border: 3px solid white;

        background: rgba(255,255,255,0.04);

        color: white;

        font-size: 48px;
        font-weight: 500;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;

        -webkit-tap-highlight-color: transparent;
    }

    .identify-button:hover {
        transform: scale(1.05);
    }

    .identify-button:active {
        transform: scale(0.92);
    }

    .identify-button:focus {
        outline: none;
    }

    .identify-button.listening {
        animation: rainbowPulse 1s infinite !important;
    }

    @keyframes rainbowPulse {

        0% {
            transform: scale(1);
            border-color: #ff0000;
            box-shadow:
                0 0 12px #ff0000,
                0 0 25px rgba(255,0,0,0.4);
        }

        16% {
            border-color: #ff7f00;
            box-shadow:
                0 0 18px #ff7f00,
                0 0 35px rgba(255,127,0,0.4);
        }

        33% {
            border-color: #ffff00;
            box-shadow:
                0 0 22px #ffff00,
                0 0 40px rgba(255,255,0,0.4);
        }

        50% {
            transform: scale(1.15);
            border-color: #00ff00;
            box-shadow:
                0 0 28px #00ff00,
                0 0 50px rgba(0,255,0,0.45);
        }

        66% {
            border-color: #00ffff;
            box-shadow:
                0 0 22px #00ffff,
                0 0 40px rgba(0,255,255,0.4);
        }

        83% {
            border-color: #0066ff;
            box-shadow:
                0 0 20px #0066ff,
                0 0 35px rgba(0,102,255,0.4);
        }

        100% {
            transform: scale(1);
            border-color: #ff00ff;
            box-shadow:
                0 0 15px #ff00ff,
                0 0 30px rgba(255,0,255,0.4);
        }
    }

    /* =========================
       STATUS
    ========================= */

    #status {
        margin: 8px auto 18px;

        min-height: 24px;

        color: #999;

        font-size: 15px;
        line-height: 1.4;

        max-width: 95%;
    }

    /* =========================
       DEBUG
    ========================= */

    #debug {
        display: none;

        margin: 15px auto;
        padding: 12px;

        max-width: 95%;

        background: #1c1c1c;

        border: 1px solid #444;
        border-radius: 12px;

        color: #ff7777;

        font-family: monospace;
        font-size: 12px;

        text-align: left;

        white-space: pre-wrap;
        word-break: break-word;

        max-height: 300px;
        overflow-y: auto;
    }

    /* =========================
       ALBUM ART
    ========================= */

    #album-art-container {
        width: 180px;
        height: 180px;

        margin: 20px auto 18px;

        display: none;
    }

    #album-art {
        width: 100%;
        height: 100%;

        object-fit: cover;

        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0,0,0,0.5);
    }

    /* =========================
       SONG
    ========================= */

    #song {
        margin: 12px auto 20px;

        max-width: 90%;

        font-size: 22px;
        font-weight: 600;

        line-height: 1.35;

        color: white;
    }

    /* =========================
       LYRICS
    ========================= */

    #lyrics {
        margin: 20px auto;

        width: 100%;
        max-width: 700px;

        height: 55vh;
        min-height: 300px;

        overflow-y: auto;

        font-size: 23px;
        line-height: 1.7;

        scroll-behavior: smooth;

        padding:
            120px 8px
            180px 8px;

        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar {
        display: none;
    }

    .line {
        opacity: 0.32;

        transition:
            opacity 0.3s ease,
            transform 0.3s ease,
            background 0.3s ease;

        padding: 10px 12px;

        margin: 3px 0;

        cursor: pointer;

        border-radius: 14px;

        -webkit-tap-highlight-color: transparent;
    }

    .line:active {
        transform: scale(0.97);

        background:
            rgba(255,255,255,0.1);
    }

    .current {
        opacity: 1;

        font-size: 32px;

        font-weight: 700;

        color: white;

        background:
            rgba(255,255,255,0.07);

        transform: scale(1.02);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

        h1 {
            margin-top: 24px;
            font-size: 30px;
        }

        .subtitle {
            font-size: 14px;
        }

        .identify-button {
            width: 88px;
            height: 88px;
            font-size: 46px;
        }

        #album-art-container {
            width: 160px;
            height: 160px;
        }

        #song {
            font-size: 20px;
        }

        #lyrics {
            height: 58vh;
            font-size: 21px;
        }

        .current {
            font-size: 29px;
        }
    }
</style>

</head><body><div class="app"><h1>🎵 Music Lyrics</h1>

<div class="subtitle">
    Identify a song and follow along
</div>

<button
    class="identify-button"
    onclick="identifySong()"
    aria-label="Identify Song"
>
    ?
</button>

<div id="status">
    Tap the button to identify a song
</div>

<div id="debug"></div>

<div id="album-art-container">

    <img
        id="album-art"
        alt="Album artwork"
    >

</div>

<div id="song"></div>

<div id="lyrics"></div>

</div><script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let lyricLines = [];

let currentIndex = 0;

let syncTimer = null;

/*
 * This is our estimated location in the song.
 *
 * We don't show it to the user.
 */
let songPosition = 0;

/*
 * Small adjustment for lyric timing.
 *
 * Change this to:
 *
 *  0    = no adjustment
 *  2    = lyrics move 2 seconds earlier
 * -2    = lyrics move 2 seconds later
 *
 * We're starting at 0 because the new parser
 * should now correctly read the actual timestamps.
 */
const LYRIC_OFFSET = 0;


/* =====================================================
   DEBUG
===================================================== */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =====================================================
   IDENTIFY SONG
===================================================== */

async function identifySong() {

    const button =
        document.querySelector(".identify-button");

    const status =
        document.getElementById("status");

    const songDisplay =
        document.getElementById("song");

    const lyricsDisplay =
        document.getElementById("lyrics");

    const albumArtContainer =
        document.getElementById("album-art-container");

    const albumArt =
        document.getElementById("album-art");


    /*
     * Stop previous synchronization.
     */

    clearInterval(syncTimer);


    /*
     * Reset screen.
     */

    lyricLines = [];

    currentIndex = 0;

    songPosition = 0;

    document.getElementById("debug")
        .style.display = "none";

    lyricsDisplay.innerHTML = "";

    songDisplay.innerText = "";

    albumArtContainer.style.display = "none";

    albumArt.src = "";


    /*
     * Start rainbow animation.
     */

    button.classList.add("listening");

    status.innerText =
        "🎧 Listening for 8 seconds...";


    try {

        /* =================================================
           MICROPHONE
        ================================================= */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        /*
         * Find supported recording format.
         */

        let mimeType = "";

        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(stream);


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        recorder.onerror =
            event => {

                console.error(
                    "Recorder error:",
                    event
                );
            };


        /* =================================================
           RECORDING FINISHED
        ================================================= */

        recorder.onstop =
            async () => {

                /*
                 * Stop microphone.
                 */

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Preparing audio...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;
                }


                /*
                 * Send audio to server.
                 */

                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                status.innerText =
                    "📤 Identifying song...";


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const responseText =
                        await response.text();


                    /*
                     * Parse JSON.
                     */

                    let data;

                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    } catch (error) {

                        showDebug(
                            "SERVER RETURNED INVALID DATA\n\n" +
                            responseText.substring(
                                0,
                                2000
                            )
                        );

                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;
                    }


                    /*
                     * Server error.
                     */

                    if (!response.ok) {

                        showDebug(
                            "SERVER ERROR\n\n" +
                            (
                                data.error ||
                                "HTTP " +
                                response.status
                            )
                        );

                        status.innerText =
                            "❌ " +
                            (
                                data.error ||
                                "Server error."
                            );

                        return;
                    }


                    /*
                     * Make sure we have a song.
                     */

                    if (!data.song) {

                        status.innerText =
                            "❌ Song information missing.";

                        return;
                    }


                    /* =================================================
                       SONG INFORMATION
                    ================================================= */

                    songDisplay.innerText =
                        data.song.title +
                        " — " +
                        data.song.artist;


                    /* =================================================
                       ALBUM ART
                    ================================================= */

                    if (data.song.artwork) {

                        albumArt.src =
                            data.song.artwork;

                        albumArt.onload =
                            () => {

                                albumArtContainer
                                    .style
                                    .display =
                                    "block";
                            };
                    }


                    /* =================================================
                       STARTING POSITION
                    ================================================= */

                    /*
                     * The server may send any of these.
                     */

                    songPosition =
                        Number(
                            data.song.matchPosition ??
                            data.song.matchOffset ??
                            data.song.timecode ??
                            0
                        );


                    if (
                        !Number.isFinite(
                            songPosition
                        )
                    ) {

                        songPosition = 0;
                    }


                    /*
                     * Apply optional adjustment.
                     */

                    songPosition +=
                        LYRIC_OFFSET;


                    if (
                        songPosition < 0
                    ) {

                        songPosition = 0;
                    }


                    console.log(
                        "Starting song position:",
                        songPosition
                    );


                    /* =================================================
                       LYRICS
                    ================================================= */

                    if (
                        !data.lyrics
                    ) {

                        status.innerText =
                            "⚠️ No lyrics found.";

                        return;
                    }


                    /*
                     * Support all the formats our server
                     * might return.
                     */

                    let syncedText = null;


                    if (
                        typeof data.lyrics === "string"
                    ) {

                        syncedText =
                            data.lyrics;

                    } else if (
                        data.lyrics.syncedLyrics
                    ) {

                        syncedText =
                            data.lyrics.syncedLyrics;

                    } else if (
                        data.lyrics.lyricsfile
                    ) {

                        syncedText =
                            data.lyrics.lyricsfile;
                    }


                    if (!syncedText) {

                        /*
                         * We might still have plain lyrics.
                         *
                         * Show them rather than failing.
                         */

                        if (
                            data.lyrics.plainLyrics
                        ) {

                            showPlainLyrics(
                                data.lyrics.plainLyrics
                            );

                            status.innerText =
                                "🎵 Lyrics found";

                            return;
                        }


                        status.innerText =
                            "⚠️ No lyrics found.";

                        return;
                    }


                    /* =================================================
                       PARSE TIMESTAMPED LYRICS
                    ================================================= */

                    const success =
                        parseLyrics(
                            syncedText
                        );


                    if (!success) {

                        /*
                         * Try plain lyrics as fallback.
                         */

                        if (
                            data.lyrics.plainLyrics
                        ) {

                            showPlainLyrics(
                                data.lyrics.plainLyrics
                            );

                            status.innerText =
                                "🎵 Lyrics found";

                            return;
                        }


                        status.innerText =
                            "⚠️ Could not read lyric timestamps.";

                        showDebug(
                            "Lyrics were received, but no usable timestamps were found.\n\n" +
                            syncedText.substring(
                                0,
                                3000
                            )
                        );

                        return;
                    }


                    /* =================================================
                       FIND INITIAL LYRIC
                    ================================================= */

                    currentIndex =
                        findCurrentLyric(
                            songPosition
                        );


                    updateCurrentLine(
                        songPosition
                    );


                    status.innerText =
                        "🎵 Synced!";


                    /*
                     * Begin automatic movement.
                     */

                    startSynchronization();

                }
                catch (error) {

                    console.error(error);

                    showDebug(
                        "CONNECTION ERROR\n\n" +
                        error.message
                    );

                    status.innerText =
                        "❌ " +
                        error.message;
                }
            };


        /*
         * Begin recording.
         */

        recorder.start();


        /*
         * Record for 8 seconds.
         */

        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();
                }

            },
            8000
        );

    }
    catch (error) {

        button.classList.remove(
            "listening"
        );

        showDebug(
            "MICROPHONE ERROR\n\n" +
            error.message
        );

        status.innerText =
            "❌ " +
            error.message;
    }
}


/* =====================================================
   PARSE SYNCHRONIZED LYRICS
===================================================== */

/*
 * IMPORTANT:
 *
 * This does NOT depend on newlines.
 *
 * It can read:
 *
 * [00:00.84] Lately...
 * [00:04.91] Dreaming...
 *
 * OR:
 *
 * [00:00.84] Lately...[00:04.91] Dreaming...
 *
 * OR:
 *
 * [00:00.84]
 * Lately...
 *
 * This fixes the exact problem you're seeing.
 */

function parseLyrics(text) {

    lyricLines = [];


    if (
        typeof text !== "string" ||
        text.trim() === ""
    ) {

        return false;
    }


    /*
     * Remove YAML / metadata if a lyricsfile
     * accidentally gets returned.
     */

    text =
        text.replace(
            /\r/g,
            ""
        );


    /*
     * Match every timestamp anywhere in the text.
     *
     * Examples:
     *
     * [00:00.84]
     * [01:23.45]
     * [04:11]
     */

    const timestampRegex =
        /(\d{1,3}):(\d{2})(?:\.(\d{1,3}))?/g;


    const matches = [];

    let match;


    while (
        (match =
            timestampRegex.exec(text)) !== null
    ) {

        matches.push({
            full:
                match[0],

            index:
                match.index,

            minutes:
                parseInt(
                    match[1],
                    10
                ),

            seconds:
                parseInt(
                    match[2],
                    10
                ),

            fraction:
                match[3]
                    ? parseInt(
                        match[3].padEnd(
                            3,
                            "0"
                        ),
                        10
                    )
                    : 0
        });
    }


    /*
     * No timestamps found.
     */

    if (
        matches.length === 0
    ) {

        return false;
    }


    /*
     * Turn each timestamp into a lyric line.
     */

    for (
        let i = 0;
        i < matches.length;
        i++
    ) {

        const current =
            matches[i];

        const next =
            matches[i + 1];


        const startIndex =
            current.index +
            current.full.length;


        const endIndex =
            next
                ? next.index
                : text.length;


        let lyricText =
            text.substring(
                startIndex,
                endIndex
            );


        /*
         * Clean up the lyric text.
         */

        lyricText =
            lyricText
                .replace(
                    /\r/g,
                    ""
                )
                .replace(
                    /\n+/g,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        /*
         * Remove accidental YAML / metadata.
         */

        lyricText =
            lyricText.replace(
                /^lines:\s*/i,
                ""
            );


        /*
         * Ignore empty lines.
         */

        if (
            lyricText === ""
        ) {

            continue;
        }


        /*
         * Ignore obvious metadata.
         */

        if (
            lyricText === "|" ||
            lyricText === "plain:"
        ) {

            continue;
        }


        const time =
            (
                current.minutes * 60
            ) +
            current.seconds +
            (
                current.fraction / 1000
            );


        lyricLines.push({

            time:
                time,

            text:
                lyricText
        });
    }


    /*
     * Sort just in case.
     */

    lyricLines.sort(
        (a, b) =>
            a.time - b.time
    );


    /*
     * Make sure we actually got lines.
     */

    if (
        lyricLines.length === 0
    ) {

        return false;
    }


    console.log(
        "✅ Parsed",
        lyricLines.length,
        "timestamped lyric lines."
    );


    console.log(
        lyricLines.slice(
            0,
            5
        )
    );


    showLyrics();


    return true;
}


/* =====================================================
   PLAIN LYRICS FALLBACK
===================================================== */

function showPlainLyrics(text) {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML =
        "";


    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            );


    lines.forEach(
        line => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            div.innerText =
                line;


            lyricsDisplay.appendChild(
                div
            );
        }
    );
}


/* =====================================================
   FIND CURRENT LYRIC
===================================================== */

function findCurrentLyric(time) {

    if (
        lyricLines.length === 0
    ) {

        return 0;
    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        } else {

            break;
        }
    }


    return index;
}


/* =====================================================
   SHOW LYRICS
===================================================== */

function showLyrics() {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML =
        "";


    lyricLines.forEach(
        (line, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            /*
             * User never sees the timestamp.
             */

            div.innerText =
                line.text;


            /*
             * Tapping a lyric manually
             * jumps synchronization there.
             */

            div.onclick =
                () => {

                    syncToLyric(
                        index
                    );
                };


            lyricsDisplay.appendChild(
                div
            );
        }
    );
}


/* =====================================================
   TAP LYRIC
===================================================== */

function syncToLyric(index) {

    if (
        !lyricLines[index]
    ) {

        return;
    }


    currentIndex =
        index;


    songPosition =
        lyricLines[index].time;


    clearInterval(
        syncTimer
    );


    updateCurrentLine(
        songPosition
    );


    startSynchronization();


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Synced";
}


/* =====================================================
   AUTOMATIC SYNCHRONIZATION
===================================================== */

function startSynchronization() {

    clearInterval(
        syncTimer
    );


    /*
     * Remember where synchronization began.
     */

    const startingPosition =
        songPosition;


    const startTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                const currentTime =
                    startingPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );
}


/* =====================================================
   UPDATE CURRENT LINE
===================================================== */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {

        return;
    }


    const newIndex =
        findCurrentLyric(
            time
        );


    /*
     * Don't constantly rebuild the screen.
     */

    if (
        newIndex === currentIndex
    ) {

        return;
    }


    currentIndex =
        newIndex;


    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (element, index) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";


                /*
                 * Automatically scroll
                 * the current lyric into view.
                 */

                element.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            } else {

                element.className =
                    "line";
            }
        }
    );
}


/* =====================================================
   INITIAL CURRENT LINE
===================================================== */

function initializeCurrentLine() {

    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (element, index) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";

                element.scrollIntoView({
                    behavior:
                        "auto",

                    block:
                        "center"
                });

            } else {

                element.className =
                    "line";
            }
        }
    );
}


/* =====================================================
   SAFETY
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        clearInterval(
            syncTimer
        );
    }
);
