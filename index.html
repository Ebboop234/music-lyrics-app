<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSIC Lyrics">

<title>MUSIC Lyrics</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background: #000;
    color: white;
}

body {
    display: flex;
    justify-content: center;
}

.app {

    width: 100%;
    max-width: 430px;
    height: 100vh;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            #272727 0%,
            #090909 45%,
            #000 100%
        );
}


/* =========================
   HEADER
========================= */

.header {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 100px;

    padding-top: 55px;

    text-align: center;

    z-index: 20;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,0)
        );
}

.header-title {

    font-size: 18px;

    font-weight: 700;

    letter-spacing: .3px;
}

.header-subtitle {

    margin-top: 3px;

    font-size: 13px;

    color: #aaa;
}


/* =========================
   SONG INFO
========================= */

.song-info {

    position: absolute;

    top: 105px;

    left: 20px;
    right: 20px;

    text-align: center;

    z-index: 15;

    pointer-events: none;
}

.song-title {

    font-size: 17px;

    font-weight: 700;
}

.song-artist {

    margin-top: 4px;

    font-size: 13px;

    color: #aaa;
}


/* =========================
   LYRICS
========================= */

.lyrics-container {

    position: absolute;

    top: 135px;
    bottom: 115px;

    left: 0;
    right: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        40px 25px 180px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}

.lyrics-container::-webkit-scrollbar {
    display: none;
}

.lyric-line {

    text-align: center;

    font-size: 25px;

    line-height: 1.35;

    font-weight: 700;

    color:
        rgba(255,255,255,.35);

    padding:
        13px 5px;

    opacity: .55;

    transition:
        color .25s ease,
        transform .25s ease,
        opacity .25s ease,
        filter .25s ease;

    cursor: pointer;

    user-select: none;
}

.lyric-line.active {

    color: white;

    opacity: 1;

    transform:
        scale(1.045);

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,255,255,.22)
        );
}

.lyric-line.past {

    color:
        rgba(255,255,255,.7);

    opacity: .75;
}


/* =========================
   STATUS
========================= */

.status {

    position: absolute;

    left: 20px;
    right: 20px;

    bottom: 76px;

    text-align: center;

    font-size: 12px;

    color: #777;

    z-index: 20;
}


/* =========================
   QUESTION BUTTON
========================= */

.question-button {

    position: absolute;

    left: 50%;

    bottom: 20px;

    transform:
        translateX(-50%);

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: none;

    color: white;

    font-size: 30px;

    font-weight: 700;

    cursor: pointer;

    z-index: 30;

    background:
        linear-gradient(
            135deg,
            #ff004c,
            #ff7a00,
            #ffe600,
            #00e676,
            #00c8ff,
            #8a2be2,
            #ff00a8
        );

    background-size:
        400% 400%;

    animation:
        rainbow 5s ease infinite,
        pulse 1.8s ease-in-out infinite;

    box-shadow:
        0 0 20px
        rgba(255,255,255,.2),

        0 0 45px
        rgba(0,200,255,.15);
}

@keyframes rainbow {

    0% {
        background-position:
            0% 50%;
    }

    50% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }
}

@keyframes pulse {

    0%,
    100% {

        transform:
            translateX(-50%)
            scale(1);
    }

    50% {

        transform:
            translateX(-50%)
            scale(1.1);
    }
}

.question-button:active {

    transform:
        translateX(-50%)
        scale(.92);
}


/* =========================
   RECOGNIZING
========================= */

.recognizing {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    z-index: 40;

    display: none;
}

.spinner {

    width: 55px;
    height: 55px;

    margin:
        auto auto 15px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.15);

    border-top-color:
        white;

    animation:
        spin 1s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}

.recognizing-text {

    font-size: 15px;

    color: #ddd;
}

</style>

</head>


<body>

<div class="app">


<!-- HEADER -->

<div class="header">

    <div class="header-title">
        MUSIC Lyrics
    </div>

    <div class="header-subtitle">
        Tap to recognize
    </div>

</div>


<!-- SONG INFO -->

<div
    class="song-info"
    id="songInfo"
    style="display:none;"
>

    <div
        class="song-title"
        id="songTitle"
    ></div>

    <div
        class="song-artist"
        id="songArtist"
    ></div>

</div>


<!-- LYRICS -->

<div
    id="lyrics"
    class="lyrics-container"
></div>


<!-- STATUS -->

<div
    id="status"
    class="status"
>
    Tap the button to identify a song
</div>


<!-- RECOGNIZING -->

<div
    id="recognizing"
    class="recognizing"
>

    <div class="spinner"></div>

    <div class="recognizing-text">
        Listening...
    </div>

</div>


<!-- QUESTION BUTTON -->

<button
    id="questionButton"
    class="question-button"
    aria-label="Recognize song"
>
    ?
</button>


</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const button =
    document.getElementById(
        "questionButton"
    );

const lyricsContainer =
    document.getElementById(
        "lyrics"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const recognizingElement =
    document.getElementById(
        "recognizing"
    );

const songInfo =
    document.getElementById(
        "songInfo"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );


/* =====================================================
   GLOBAL STATE
===================================================== */

let lyricLines = [];

let currentIndex = -1;

let recognitionTimer = null;

let audioStartTime = null;


/*
 * Small timing adjustment.
 *
 * Change this later if lyrics are consistently
 * behind or ahead.
 *
 * 0 = exact Shazam match position.
 */

const SYNC_OFFSET = 4;


/* =====================================================
   CONVERT LYRICS DATA TO TEXT
===================================================== */

function lyricDataToString(data) {

    if (data == null) {
        return "";
    }


    if (typeof data === "string") {
        return data;
    }


    if (Array.isArray(data)) {

        let output = "";


        for (const item of data) {

            if (typeof item === "string") {

                output +=
                    item + "\n";

                continue;
            }


            if (
                item &&
                typeof item === "object"
            ) {

                const time =
                    item.time ??
                    item.timestamp ??
                    item.start ??
                    item.startTime ??
                    item.seconds;


                const text =
                    item.text ??
                    item.lyric ??
                    item.line ??
                    item.words ??
                    item.content ??
                    "";


                if (
                    time !== undefined &&
                    text
                ) {

                    output +=
                        "[" +
                        secondsToLRC(time) +
                        "] " +
                        String(text) +
                        "\n";

                }

                else if (text) {

                    output +=
                        String(text) +
                        "\n";
                }
            }
        }


        return output;
    }


    if (
        typeof data === "object"
    ) {

        const possible =
            data.syncedLyrics ??
            data.synced_lyrics ??
            data.lyrics ??
            data.lyricText ??
            data.lrc ??
            data.text ??
            data.content ??
            data.lines;


        if (
            possible !== undefined &&
            possible !== data
        ) {

            return lyricDataToString(
                possible
            );
        }


        const time =
            data.time ??
            data.timestamp ??
            data.start ??
            data.startTime ??
            data.seconds;


        const text =
            data.text ??
            data.lyric ??
            data.line ??
            data.words ??
            data.content ??
            "";


        if (
            time !== undefined &&
            text
        ) {

            return (
                "[" +
                secondsToLRC(time) +
                "] " +
                String(text)
            );
        }
    }


    return "";
}


/* =====================================================
   SECONDS TO LRC
===================================================== */

function secondsToLRC(seconds) {

    seconds =
        Number(seconds);


    if (
        !Number.isFinite(seconds)
    ) {

        return "00:00.00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds -
        minutes * 60;


    return (
        String(minutes)
            .padStart(2, "0") +

        ":" +

        remaining
            .toFixed(2)
            .padStart(5, "0")
    );
}


/* =====================================================
   PARSE LRC
===================================================== */

function parseLRC(data) {

    const lrc =
        lyricDataToString(
            data
        );


    console.log(
        "========== LRC =========="
    );

    console.log(lrc);


    if (!lrc) {
        return [];
    }


    const lines =
        lrc.split(/\r?\n/);


    const parsed = [];


    /*
     * IMPORTANT:
     *
     * These are REAL square brackets.
     */

    const timestampRegex =
        /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;


    for (
        const originalLine of lines
    ) {

        const line =
            originalLine.trim();


        if (!line) {
            continue;
        }


        const matches =
            [
                ...line.matchAll(
                    timestampRegex
                )
            ];


        if (
            matches.length === 0
        ) {

            continue;
        }


        const text =
            line
                .replace(
                    timestampRegex,
                    ""
                )
                .trim();


        if (!text) {
            continue;
        }


        for (
            const match of matches
        ) {

            const minutes =
                Number(
                    match[1]
                );


            const seconds =
                Number(
                    match[2]
                );


            let fraction = 0;


            if (match[3]) {

                const raw =
                    match[3];


                if (
                    raw.length === 1
                ) {

                    fraction =
                        Number(raw) / 10;

                }

                else if (
                    raw.length === 2
                ) {

                    fraction =
                        Number(raw) / 100;

                }

                else {

                    fraction =
                        Number(raw) / 1000;
                }
            }


            parsed.push({

                time:
                    minutes * 60 +
                    seconds +
                    fraction,

                text:
                    text
            });
        }
    }


    parsed.sort(
        (a, b) =>
            a.time - b.time
    );


    console.log(
        "PARSED LYRICS:",
        parsed
    );


    return parsed;
}


/* =====================================================
   DISPLAY LYRICS
===================================================== */

function displayLyrics(data) {

    lyricLines =
        parseLRC(data);


    lyricsContainer.innerHTML =
        "";


    currentIndex =
        -1;


    if (
        lyricLines.length === 0
    ) {

        lyricsContainer.innerHTML = `

            <div class="lyric-line active">
                No synchronized lyrics found.
            </div>

        `;

        return false;
    }


    lyricLines.forEach(
        (line, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "lyric-line";


            element.textContent =
                line.text;


            /*
             * ===========================
             * TOUCH TO SYNC
             * ===========================
             */

            element.addEventListener(
                "click",
                () => {

                    const selectedTime =
                        lyricLines[index].time;


                    console.log(
                        "🎯 Touch sync:",
                        selectedTime,
                        "seconds"
                    );


                    /*
                     * Restart the sync clock
                     * at this lyric.
                     */

                    startEstimatedSync(
                        selectedTime
                    );


                    updateActiveLyric(
                        index
                    );


                    statusElement.textContent =
                        "Synced to this lyric";
                }
            );


            lyricsContainer.appendChild(
                element
            );

        }
    );


    return true;
}


/* =====================================================
   UPDATE ACTIVE LYRIC
===================================================== */

function updateActiveLyric(index) {

    if (
        index < 0 ||
        index >= lyricLines.length
    ) {

        return;
    }


    const elements =
        lyricsContainer.querySelectorAll(
            ".lyric-line"
        );


    elements.forEach(
        (element, i) => {

            element.classList.remove(
                "active"
            );

            element.classList.remove(
                "past"
            );


            if (
                i < index
            ) {

                element.classList.add(
                    "past"
                );
            }
        }
    );


    const active =
        elements[index];


    if (!active) {
        return;
    }


    active.classList.add(
        "active"
    );


    /*
     * Scroll active lyric toward center.
     */

    const containerRect =
        lyricsContainer
            .getBoundingClientRect();


    const elementRect =
        active
            .getBoundingClientRect();


    const offset =
        elementRect.top -
        containerRect.top -
        containerRect.height / 2 +
        elementRect.height / 2;


    lyricsContainer.scrollBy({

        top:
            offset,

        behavior:
            "smooth"
    });


    currentIndex =
        index;
}


/* =====================================================
   FIND CURRENT LYRIC
===================================================== */

function findCurrentLyric(seconds) {

    if (
        !lyricLines.length
    ) {

        return -1;
    }


    let index = -1;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            seconds >=
            lyricLines[i].time
        ) {

            index = i;

        }
        else {

            break;
        }
    }


    return index;
}


/* =====================================================
   START ESTIMATED SYNC
===================================================== */

function startEstimatedSync(
    startAt = 0
) {

    if (
        !lyricLines.length
    ) {

        return;
    }


    /*
     * Stop previous timer.
     */

    stopEstimatedSync();


    let startingPosition =
        Number(startAt);


    if (
        !Number.isFinite(
            startingPosition
        )
    ) {

        startingPosition = 0;
    }


    /*
     * Apply timing adjustment.
     */

    startingPosition +=
        SYNC_OFFSET;


    if (
        startingPosition < 0
    ) {

        startingPosition = 0;
    }


    console.log(
        "🎯 Sync starting at:",
        startingPosition
    );


    /*
     * Make the clock pretend the song
     * started at the Shazam match position.
     */

    audioStartTime =
        performance.now() -
        (
            startingPosition *
            1000
        );


    /*
     * Immediately highlight the correct line.
     */

    const firstIndex =
        findCurrentLyric(
            startingPosition
        );


    if (
        firstIndex >= 0
    ) {

        updateActiveLyric(
            firstIndex
        );
    }


    /*
     * Continue automatically.
     */

    recognitionTimer =
        setInterval(
            () => {

                if (
                    !audioStartTime
                ) {

                    return;
                }


                const elapsed =
                    (
                        performance.now() -
                        audioStartTime
                    ) / 1000;


                const index =
                    findCurrentLyric(
                        elapsed
                    );


                if (
                    index !==
                    currentIndex
                ) {

                    updateActiveLyric(
                        index
                    );
                }

            },
            100
        );
}


/* =====================================================
   STOP SYNC
===================================================== */

function stopEstimatedSync() {

    if (
        recognitionTimer
    ) {

        clearInterval(
            recognitionTimer
        );

        recognitionTimer =
            null;
    }


    audioStartTime =
        null;
}


/* =====================================================
   GET TITLE
===================================================== */

function getSafeTitle(data) {

    if (
        data.song &&
        typeof data.song === "object"
    ) {

        return String(
            data.song.title ||
            ""
        );
    }


    return String(
        data.title ||
        data.song ||
        ""
    );
}


/* =====================================================
   GET ARTIST
===================================================== */

function getSafeArtist(data) {

    if (
        data.song &&
        typeof data.song === "object"
    ) {

        return String(
            data.song.artist ||
            ""
        );
    }


    return String(
        data.artist ||
        ""
    );
}


/* =====================================================
   RECOGNIZE SONG
===================================================== */

async function recognizeSong() {

    button.disabled =
        true;


    recognizingElement.style.display =
        "block";


    statusElement.textContent =
        "Listening...";


    songInfo.style.display =
        "none";


    lyricsContainer.innerHTML =
        "";


    stopEstimatedSync();


    try {

        /*
         * Microphone.
         */

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        /*
         * Choose recording format.
         */

        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "audio/mp4"
            )
        ) {

            mimeType =
                "audio/mp4";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            mimeType
                    }
                  )

                : new MediaRecorder(
                    stream
                  );


        const chunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    chunks.push(
                        event.data
                    );
                }
            };


        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                const blob =
                    new Blob(
                        chunks,
                        {
                            type:
                                recorder.mimeType ||
                                "audio/webm"
                        }
                    );


                await sendAudio(
                    blob
                );
            };


        recorder.start();


        /*
         * Record for 8 seconds.
         */

        setTimeout(
            () => {

                if (
                    recorder.state !==
                    "inactive"
                ) {

                    recorder.stop();
                }

            },
            8000
        );

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );


        recognizingElement.style.display =
            "none";


        statusElement.textContent =
            "Microphone permission is required.";


        button.disabled =
            false;
    }
}


/* =====================================================
   SEND AUDIO TO SHAZAM
===================================================== */

async function sendAudio(blob) {

    try {

        statusElement.textContent =
            "Recognizing song...";


        const formData =
            new FormData();


        formData.append(
            "audio",
            blob,
            "recording.webm"
        );


        /*
         * IMPORTANT:
         *
         * Your server endpoint is:
         *
         * /identify-shazam
         */

        const response =
            await fetch(
                "/identify-shazam",
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );


        if (
            !response.ok
        ) {

            const errorText =
                await response.text();


            console.error(
                "SERVER ERROR:",
                errorText
            );


            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "========== SERVER RESPONSE =========="
        );


        console.log(data);


        recognizingElement.style.display =
            "none";


        /*
         * ===========================
         * SONG INFO
         * ===========================
         */

        const title =
            getSafeTitle(data);


        const artist =
            getSafeArtist(data);


        if (
            title ||
            artist
        ) {

            songTitle.textContent =
                title;


            songArtist.textContent =
                artist;


            songInfo.style.display =
                "block";
        }


        /*
         * ===========================
         * SHAZAM MATCH POSITION
         * ===========================
         */

        let matchPosition = 0;


        if (
            data.song &&
            typeof data.song === "object"
        ) {

            matchPosition =
                Number(
                    data.song.matchPosition ??
                    data.song.timecode ??
                    0
                );

        }

        else {

            matchPosition =
                Number(
                    data.matchPosition ??
                    data.timecode ??
                    0
                );
        }


        if (
            !Number.isFinite(
                matchPosition
            ) ||
            matchPosition < 0
        ) {

            matchPosition = 0;
        }


        console.log(
            "🎯 SHAZAM MATCH POSITION:",
            matchPosition
        );


        /*
         * ===========================
         * LYRICS
         * ===========================
         */

        const lyrics =
            data.lyrics ??
            data.syncedLyrics ??
            data.synced_lyrics ??
            data.lyricText ??
            data.lrc ??
            data.lines ??
            data.lyricData ??
            data.lyric_data ??
            "";


        console.log(
            "🎵 LYRICS DATA:",
            lyrics
        );


        if (
            lyrics
        ) {

            const success =
                displayLyrics(
                    lyrics
                );


            if (
                success
            ) {

                /*
                 * Start at the exact
                 * Shazam match position.
                 */

                startEstimatedSync(
                    matchPosition
                );


                statusElement.textContent =
                    "Tap a lyric to sync";

            }

            else {

                statusElement.textContent =
                    "Lyrics were received, but no usable timestamps were found.";
            }

        }

        else {

            statusElement.textContent =
                "No lyrics found.";


            lyricsContainer.innerHTML = `

                <div class="lyric-line active">
                    No lyrics found.
                </div>

            `;
        }

    }

    catch (error) {

        console.error(
            "Recognition error:",
            error
        );


        recognizingElement.style.display =
            "none";


        statusElement.textContent =
            "Could not recognize the song.";


        lyricsContainer.innerHTML = `

            <div class="lyric-line active">
                Try again.
            </div>

        `;

    }

    finally {

        button.disabled =
            false;
    }
}
