<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSIC Lyrics">

<link rel="manifest" href="manifest.json">

<title>MUSIC Lyrics</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    color: white;
}

body {
    display: flex;
    justify-content: center;
}


/* =========================================================
   APP
========================================================= */

.app {
    position: relative;

    width: 100%;
    max-width: 430px;

    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   ALBUM BLUR BACKGROUND
========================================================= */

#albumBackground {
    position: absolute;

    inset: -50px;

    z-index: 0;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    filter: blur(35px);

    transform: scale(1.15);

    opacity: 0;

    transition:
        opacity 0.8s ease,
        background-image 0.8s ease;
}


/* Dark overlay */

#albumOverlay {
    position: absolute;

    inset: 0;

    z-index: 1;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.70) 0%,
            rgba(0,0,0,0.45) 30%,
            rgba(0,0,0,0.68) 65%,
            rgba(0,0,0,0.95) 100%
        );

    pointer-events: none;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 135px;

    padding:
        calc(env(safe-area-inset-top) + 18px)
        20px
        15px;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.65),
            rgba(0,0,0,0)
        );

    z-index: 5;
}


.app-title {
    margin: 0;

    font-size: 27px;

    font-weight: 800;

    letter-spacing: -0.7px;
}


.app-subtitle {
    margin-top: 3px;

    font-size: 13px;

    opacity: 0.65;
}


/* =========================================================
   SONG INFO
========================================================= */

#songInfo {
    display: none;

    position: absolute;

    top: 75px;

    left: 20px;
    right: 20px;

    text-align: center;

    z-index: 6;
}


#songTitle {
    font-size: 18px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


#songArtist {
    margin-top: 3px;

    font-size: 14px;

    opacity: 0.72;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   RECENT BUTTON
========================================================= */

#recentButton {
    position: absolute;

    top: calc(env(safe-area-inset-top) + 17px);

    left: 17px;

    border: none;

    background:
        rgba(255,255,255,0.13);

    color: white;

    width: 40px;
    height: 40px;

    border-radius: 20px;

    font-size: 19px;

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

    z-index: 20;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease;
}


#recentButton:active {
    transform: scale(0.9);

    background:
        rgba(255,255,255,0.22);
}


/* =========================================================
   LYRICS
========================================================= */

#lyricsContainer {
    position: absolute;

    top: 135px;

    bottom: 115px;

    left: 0;
    right: 0;

    padding:
        55px
        28px
        120px;

    overflow-y: auto;

    overflow-x: hidden;

    scroll-behavior: smooth;

    scrollbar-width: none;

    z-index: 3;
}


#lyricsContainer::-webkit-scrollbar {
    display: none;
}


.lyric-line {
    padding: 13px 0;

    font-size: 23px;

    line-height: 1.25;

    font-weight: 700;

    color:
        rgba(255,255,255,0.35);

    text-align: center;

    transition:
        color 0.35s ease,
        transform 0.35s ease,
        opacity 0.35s ease;

    cursor: pointer;

    user-select: none;
}


.lyric-line.active {
    color: white;

    transform: scale(1.04);

    text-shadow:
        0 0 20px
        rgba(255,255,255,0.25);
}


/* =========================================================
   STATUS
========================================================= */

#status {
    position: absolute;

    left: 20px;
    right: 20px;

    bottom:
        calc(
            env(safe-area-inset-bottom) + 83px
        );

    text-align: center;

    font-size: 13px;

    color:
        rgba(255,255,255,0.65);

    z-index: 7;
}


/* =========================================================
   QUESTION BUTTON
========================================================= */

#recognizeButton {
    position: absolute;

    bottom:
        calc(
            env(safe-area-inset-bottom) + 20px
        );

    left: 50%;

    transform:
        translateX(-50%);

    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: none;

    color: white;

    font-size: 31px;

    font-weight: 800;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    z-index: 20;

    background:
        linear-gradient(
            135deg,
            #ff004c,
            #ff7a00,
            #ffe600,
            #00e676,
            #00b7ff,
            #7b2cff,
            #ff00a8
        );

    background-size: 400% 400%;

    animation:
        rainbow 5s ease infinite;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.45),

        0 0 25px
        rgba(255,255,255,0.12);

    transition:
        transform 0.15s ease,
        box-shadow 0.2s ease;
}


#recognizeButton:active {
    transform:
        translateX(-50%)
        scale(0.9);
}


#recognizeButton.listening {
    animation:
        rainbow 5s ease infinite,
        pulse 1.15s ease-in-out infinite;

    box-shadow:
        0 0 30px
        rgba(255,255,255,0.5),

        0 0 60px
        rgba(150,100,255,0.35);
}


@keyframes rainbow {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


@keyframes pulse {

    0%,
    100% {
        box-shadow:
            0 0 18px
            rgba(255,255,255,0.25);
    }

    50% {
        box-shadow:
            0 0 38px
            rgba(255,255,255,0.65),

            0 0 70px
            rgba(120,80,255,0.45);
    }
}


/* =========================================================
   RECOGNIZING OVERLAY
========================================================= */

#recognizing {
    display: none;

    position: absolute;

    inset: 0;

    z-index: 30;

    background:
        rgba(0,0,0,0.55);

    backdrop-filter: blur(10px);

    -webkit-backdrop-filter: blur(10px);

    align-items: center;

    justify-content: center;

    flex-direction: column;
}


.spinner {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,0.2);

    border-top-color: white;

    animation:
        spin 0.8s linear infinite;
}


.recognizing-text {
    margin-top: 15px;

    font-size: 15px;

    color:
        rgba(255,255,255,0.85);
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   RECENTS PANEL
========================================================= */

#recentPanel {
    position: absolute;

    inset: 0;

    z-index: 50;

    display: none;

    background:
        rgba(0,0,0,0.78);

    backdrop-filter: blur(25px);

    -webkit-backdrop-filter: blur(25px);

    overflow-y: auto;
}


.recent-header {
    position: sticky;

    top: 0;

    height: 85px;

    padding:
        calc(env(safe-area-inset-top) + 15px)
        18px
        12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(0,0,0,0.55);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    z-index: 5;
}


.recent-header h2 {
    margin: 0;

    font-size: 25px;
}


#closeRecent {
    border: none;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.13);

    color: white;

    font-size: 22px;

    cursor: pointer;
}


#recentList {
    padding:
        12px 15px 40px;
}


.recent-empty {
    text-align: center;

    padding: 80px 25px;

    color:
        rgba(255,255,255,0.55);

    font-size: 15px;
}


.recent-item {
    display: flex;

    align-items: center;

    gap: 13px;

    width: 100%;

    padding: 10px;

    margin-bottom: 8px;

    border-radius: 16px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.05);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease;
}


.recent-item:active {
    transform: scale(0.97);

    background:
        rgba(255,255,255,0.15);
}


.recent-art {
    width: 58px;
    height: 58px;

    border-radius: 10px;

    object-fit: cover;

    background:
        rgba(255,255,255,0.08);

    flex-shrink: 0;
}


.recent-details {
    min-width: 0;

    flex: 1;
}


.recent-title {
    font-size: 16px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.recent-artist {
    margin-top: 3px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.58);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.recent-time {
    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.35);
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 431px) {

    body {
        background: #111;
    }

    .app {
        box-shadow:
            0 0 60px
            rgba(0,0,0,0.6);
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- ALBUM BLUR BACKGROUND -->
    <div id="albumBackground"></div>

    <!-- DARK OVERLAY -->
    <div id="albumOverlay"></div>


    <div class="content">


        <!-- =================================================
             HEADER
        ================================================= -->

        <header>

            <button
                id="recentButton"
                aria-label="Recent songs">

                🕘

            </button>


            <h1 class="app-title">
                MUSIC Lyrics
            </h1>


            <div class="app-subtitle">
                Tap to recognize
            </div>


            <div id="songInfo">

                <div id="songTitle"></div>

                <div id="songArtist"></div>

            </div>

        </header>


        <!-- =================================================
             LYRICS
        ================================================= -->

        <div id="lyricsContainer"></div>


        <!-- =================================================
             STATUS
        ================================================= -->

        <div id="status">
            Ready
        </div>


        <!-- =================================================
             RECOGNIZE BUTTON
        ================================================= -->

        <button
            id="recognizeButton"
            aria-label="Recognize song">

            ?

        </button>


        <!-- =================================================
             RECOGNIZING
        ================================================= -->

        <div id="recognizing">

            <div class="spinner"></div>

            <div class="recognizing-text">
                Listening...
            </div>

        </div>


        <!-- =================================================
             RECENTS
        ================================================= -->

        <div id="recentPanel">

            <div class="recent-header">

                <h2>
                    Recent Songs
                </h2>

                <button id="closeRecent">
                    ×
                </button>

            </div>


            <div id="recentList"></div>

        </div>


    </div>

</div>


<script>

/* =========================================================
   EXISTING MUSIC LYRICS CODE
========================================================= */

const button =
    document.getElementById(
        "recognizeButton"
    );


const lyricsContainer =
    document.getElementById(
        "lyricsContainer"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const recognizingElement =
    document.getElementById(
        "recognizing"
    );


const songInfo =
    document.getElementById(
        "songInfo"
    );


const songTitle =
    document.getElementById(
        "songTitle"
    );


const songArtist =
    document.getElementById(
        "songArtist"
    );


/*
   KEEPING YOUR EXISTING
   4-SECOND SYNC OFFSET
*/

const SYNC_OFFSET = 4;


let lyricLines = [];

let currentIndex = -1;

let recognitionTimer = null;

let audioStartTime = 0;


/* =========================================================
   ALBUM BACKGROUND
========================================================= */

const albumBackground =
    document.getElementById(
        "albumBackground"
    );


function setAlbumBackground(data) {

    let artwork = "";


    try {

        const song =
            data?.song ||
            data?.track ||
            {};


        const images =
            song.images ||
            data?.images ||
            {};


        artwork =
            images.background ||
            images.coverarthq ||
            images.coverart ||
            song.artwork ||
            data?.artwork ||
            data?.coverart ||
            data?.coverArt ||
            data?.image ||
            song.share?.image ||
            data?.share?.image ||
            "";

    }

    catch (error) {

        console.log(
            "Could not find album artwork:",
            error
        );

    }


    if (!artwork) {

        albumBackground.style.opacity =
            "0";

        return;
    }


    albumBackground.style.backgroundImage =
        `url("${artwork}")`;


    albumBackground.style.opacity =
        "1";
}


/* =========================================================
   LYRICS DATA
========================================================= */

function lyricDataToString(data) {

    if (typeof data === "string") {

        return data;
    }


    if (Array.isArray(data)) {

        return data

            .map(line => {

                if (
                    typeof line ===
                    "string"
                ) {

                    return line;
                }


                if (
                    line &&
                    typeof line ===
                    "object"
                ) {

                    if (line.text) {
                        return line.text;
                    }

                    if (line.lyric) {
                        return line.lyric;
                    }

                    if (line.line) {
                        return line.line;
                    }

                }


                return "";

            })

            .filter(Boolean)

            .join("\n");
    }


    if (
        data &&
        typeof data === "object"
    ) {

        if (data.syncedLyrics) {
            return data.syncedLyrics;
        }

        if (data.synced_lyrics) {
            return data.synced_lyrics;
        }

        if (data.lrc) {
            return data.lrc;
        }

        if (data.plainLyrics) {
            return data.plainLyrics;
        }

        if (data.lyrics) {

            return lyricDataToString(
                data.lyrics
            );

        }

        if (data.text) {
            return data.text;
        }

        if (data.lines) {

            return lyricDataToString(
                data.lines
            );

        }

    }


    return "";
}


function secondsToLRC(seconds) {

    const mins =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds -
        mins * 60;


    const secString =
        secs
            .toFixed(2)
            .padStart(5, "0");


    return `[${String(mins).padStart(2, "0")}:${secString}]`;
}


/* =========================================================
   LRC PARSER
========================================================= */

function parseLRC(lrc) {

    if (!lrc) {
        return [];
    }


    const lines =
        lrc.split(/\r?\n/);


    const parsed = [];


    const regex =
        /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;


    for (
        const line of lines
    ) {

        let match;

        const timestamps = [];


        regex.lastIndex = 0;


        while (
            (match =
                regex.exec(line)) !== null
        ) {

            const minutes =
                parseInt(
                    match[1],
                    10
                );


            const seconds =
                parseInt(
                    match[2],
                    10
                );


            let fraction = 0;


            if (match[3]) {

                const value =
                    match[3];


                if (value.length === 1) {

                    fraction =
                        parseInt(
                            value,
                            10
                        ) / 10;

                }

                else if (
                    value.length === 2
                ) {

                    fraction =
                        parseInt(
                            value,
                            10
                        ) / 100;

                }

                else {

                    fraction =
                        parseInt(
                            value,
                            10
                        ) / 1000;

                }

            }


            timestamps.push(

                minutes * 60 +
                seconds +
                fraction

            );

        }


        const text =
            line
                .replace(regex, "")
                .trim();


        if (!text) {
            continue;
        }


        for (
            const time of timestamps
        ) {

            parsed.push({

                time,
                text

            });

        }

    }


    parsed.sort(
        (a, b) =>
            a.time - b.time
    );


    return parsed;
}


/* =========================================================
   DISPLAY LYRICS
========================================================= */

function displayLyrics(lyricsData) {

    const rawLyrics =
        lyricDataToString(
            lyricsData
        );


    lyricLines =
        parseLRC(
            rawLyrics
        );


    lyricsContainer.innerHTML = "";


    currentIndex = -1;


    if (!rawLyrics) {

        lyricsContainer.innerHTML = `

            <div class="lyric-line active">
                Lyrics not found
            </div>

        `;

        return;
    }


    /*
       SYNCED LYRICS
    */

    if (lyricLines.length > 0) {

        lyricLines.forEach(
            (line, index) => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "lyric-line";


                element.textContent =
                    line.text;


                /*
                   TAP LYRIC TO SYNC
                */

                element.addEventListener(
                    "click",
                    () => {

                        startEstimatedSync(
                            line.time,
                            false
                        );

                    }
                );


                lyricsContainer.appendChild(
                    element
                );

            }
        );


        return;
    }


    /*
       PLAIN LYRICS
    */

    const plainLines =
        rawLyrics
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(Boolean);


    lyricLines =
        plainLines.map(
            text => ({

                time: 0,

                text

            })
        );


    plainLines.forEach(
        text => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "lyric-line";


            element.textContent =
                text;


            lyricsContainer.appendChild(
                element
            );

        }
    );
}


/* =========================================================
   LYRIC SYNC
========================================================= */

function updateActiveLyric(time) {

    if (!lyricLines.length) {
        return;
    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        }

        else {

            break;

        }

    }


    if (index === currentIndex) {
        return;
    }


    currentIndex = index;


    const elements =
        lyricsContainer.querySelectorAll(
            ".lyric-line"
        );


    elements.forEach(
        (element, i) => {

            element.classList.toggle(
                "active",
                i === currentIndex
            );

        }
    );


    const active =
        elements[currentIndex];


    if (active) {

        active.scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }
}


function findCurrentLyric(time) {

    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        }

        else {

            break;

        }

    }


    return index;
}


function startEstimatedSync(
    startAt = 0,
    applyOffset = true
) {

    stopEstimatedSync();


    const offset =
        applyOffset
            ? SYNC_OFFSET
            : 0;


    audioStartTime =
        performance.now() / 1000 -
        startAt +
        offset;


    recognitionTimer =
        setInterval(
            () => {

                const now =
                    performance.now() / 1000;


                const elapsed =
                    now -
                    audioStartTime;


                updateActiveLyric(
                    elapsed
                );

            },
            100
        );


    updateActiveLyric(
        startAt - offset
    );
}


function stopEstimatedSync() {

    if (recognitionTimer) {

        clearInterval(
            recognitionTimer
        );

        recognitionTimer = null;
    }
}


/* =========================================================
   SAFE SONG DATA
========================================================= */

function getSafeTitle(data) {

    return (

        data?.song?.title ||

        data?.track?.title ||

        data?.title ||

        "Unknown Song"

    );
}


function getSafeArtist(data) {

    return (

        data?.song?.subtitle ||

        data?.track?.subtitle ||

        data?.artist ||

        data?.artistName ||

        "Unknown Artist"

    );
}


/* =========================================================
   RECENT SONGS
========================================================= */

const RECENTS_KEY =
    "musicLyricsRecentSongs";


const MAX_RECENTS = 20;


let recentSongs = [];


function loadRecentSongs() {

    try {

        const saved =
            localStorage.getItem(
                RECENTS_KEY
            );


        if (saved) {

            const parsed =
                JSON.parse(
                    saved
                );


            if (
                Array.isArray(parsed)
            ) {

                recentSongs =
                    parsed;

            }

        }

    }

    catch (error) {

        console.log(
            "Could not load recent songs:",
            error
        );


        recentSongs = [];

    }
}


function saveRecentSongs() {

    try {

        localStorage.setItem(

            RECENTS_KEY,

            JSON.stringify(
                recentSongs
            )

        );

    }

    catch (error) {

        console.log(
            "Could not save recent songs:",
            error
        );

    }
}


/* =========================================================
   GET ARTWORK
========================================================= */

function getArtwork(data) {

    try {

        const song =
            data?.song ||
            data?.track ||
            {};


        const images =
            song.images ||
            data?.images ||
            {};


        return (

            images.coverarthq ||

            images.coverart ||

            images.background ||

            song.share?.image ||

            data?.artwork ||

            data?.image ||

            ""

        );

    }

    catch {

        return "";

    }
}


/* =========================================================
   SAVE RECENT SONG
========================================================= */

function saveRecentSong({

    title,

    artist,

    lyrics,

    artwork,

    matchPosition

}) {

    if (!title) {
        return;
    }


    /*
       Remove duplicate.
    */

    recentSongs =
        recentSongs.filter(
            song => !(
                song.title === title &&
                song.artist === artist
            )
        );


    /*
       Newest first.
    */

    recentSongs.unshift({

        title,

        artist,

        lyrics,

        artwork:
            artwork || "",

        matchPosition:
            Number.isFinite(
                matchPosition
            )
                ? matchPosition
                : 0,

        savedAt:
            Date.now()

    });


    /*
       Keep latest 20.
    */

    recentSongs =
        recentSongs.slice(
            0,
            MAX_RECENTS
        );


    saveRecentSongs();


    renderRecentSongs();
}


/* =========================================================
   RECENTS DISPLAY
========================================================= */

const recentPanel =
    document.getElementById(
        "recentPanel"
    );


const recentList =
    document.getElementById(
        "recentList"
    );


const recentButton =
    document.getElementById(
        "recentButton"
    );


const closeRecent =
    document.getElementById(
        "closeRecent"
    );


function formatRecentDate(
    timestamp
) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(timestamp);


    const now =
        new Date();


    const diff =
        now.getTime() -
        date.getTime();


    const minutes =
        Math.floor(
            diff / 60000
        );


    if (minutes < 1) {
        return "Just now";
    }


    if (minutes < 60) {

        return `${minutes}m ago`;

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return `${hours}h ago`;

    }


    const days =
        Math.floor(
            hours / 24
        );


    if (days < 7) {

        return `${days}d ago`;

    }


    return date.toLocaleDateString();
}


/* =========================================================
   RENDER RECENTS
========================================================= */

function renderRecentSongs() {

    recentList.innerHTML = "";


    if (!recentSongs.length) {

        recentList.innerHTML = `

            <div class="recent-empty">

                Songs you recognize
                will appear here.

            </div>

        `;

        return;
    }


    recentSongs.forEach(
        (song, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "recent-item";


            const artwork =
                document.createElement(
                    "img"
                );


            artwork.className =
                "recent-art";


            artwork.alt = "";


            if (song.artwork) {

                artwork.src =
                    song.artwork;

            }


            const details =
                document.createElement(
                    "div"
                );


            details.className =
                "recent-details";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "recent-title";


            title.textContent =
                song.title ||
                "Unknown Song";


            const artist =
                document.createElement(
                    "div"
                );


            artist.className =
                "recent-artist";


            artist.textContent =
                song.artist ||
                "Unknown Artist";


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "recent-time";


            time.textContent =
                formatRecentDate(
                    song.savedAt
                );


            details.appendChild(
                title
            );


            details.appendChild(
                artist
            );


            details.appendChild(
                time
            );


            item.appendChild(
                artwork
            );


            item.appendChild(
                details
            );


            item.addEventListener(
                "click",
                () => {

                    loadRecentSong(
                        index
                    );

                }
            );


            recentList.appendChild(
                item
            );

        }
    );
}


/* =========================================================
   LOAD RECENT SONG
========================================================= */

function loadRecentSong(index) {

    const song =
        recentSongs[index];


    if (!song) {
        return;
    }


    stopEstimatedSync();


    songInfo.style.display =
        "block";


    songTitle.textContent =
        song.title ||
        "Unknown Song";


    songArtist.textContent =
        song.artist ||
        "Unknown Artist";


    /*
       Restore album background.
    */

    if (song.artwork) {

        albumBackground.style.backgroundImage =
            `url("${song.artwork}")`;


        albumBackground.style.opacity =
            "1";

    }


    /*
       Restore lyrics.
    */

    displayLyrics(
        song.lyrics
    );


    /*
       Close recents.
    */

    recentPanel.style.display =
        "none";


    statusElement.textContent =
        "Loaded from Recents";


    /*
       Start lyric timeline.
    */

    startEstimatedSync(
        song.matchPosition || 0,
        false
    );
}


/* =========================================================
   RECENTS BUTTON
========================================================= */

recentButton.addEventListener(
    "click",
    () => {

        renderRecentSongs();


        recentPanel.style.display =
            "block";

    }
);


closeRecent.addEventListener(
    "click",
    () => {

        recentPanel.style.display =
            "none";

    }
);


/* =========================================================
   SHAZAM RECOGNITION
========================================================= */

async function recognizeSong() {

    if (
        button.classList.contains(
            "listening"
        )
    ) {

        return;

    }


    button.classList.add(
        "listening"
    );


    recognizingElement.style.display =
        "flex";


    statusElement.textContent =
        "Listening...";


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: true

                });


        const mediaRecorder =
            new MediaRecorder(
                stream
            );


        const chunks = [];


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    chunks.push(
                        event.data
                    );

                }

            };


        const recording =
            new Promise(
                resolve => {

                    mediaRecorder.onstop =
                        () => {

                            resolve(

                                new Blob(
                                    chunks,
                                    {
                                        type:
                                            mediaRecorder
                                                .mimeType ||
                                            "audio/webm"
                                    }
                                )

                            );

                        };

                }
            );


        mediaRecorder.start();


        /*
           Existing 8-second recording.
        */

        setTimeout(
            () => {

                if (
                    mediaRecorder.state !==
                    "inactive"
                ) {

                    mediaRecorder.stop();

                }


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            },
            8000
        );


        const blob =
            await recording;


        await sendAudio(
            blob
        );

    }

    catch (error) {

        console.error(
            "Recognition error:",
            error
        );


        statusElement.textContent =
            "Could not recognize song.";

    }

    finally {

        button.classList.remove(
            "listening"
        );


        recognizingElement.style.display =
            "none";

    }
}


/* =========================================================
   SEND AUDIO TO SERVER
========================================================= */

async function sendAudio(blob) {

    statusElement.textContent =
        "Identifying song...";


    const formData =
        new FormData();


    formData.append(
        "audio",
        blob,
        "recording.webm"
    );


    const response =
        await fetch(
            "/identify-shazam",
            {

                method: "POST",

                body: formData

            }
        );


    if (!response.ok) {

        throw new Error(
            `Server returned ${response.status}`
        );

    }


    const data =
        await response.json();


    console.log(
        "Shazam response:",
        data
    );


    /*
       Song information.
    */

    const title =
        getSafeTitle(data);


    const artist =
        getSafeArtist(data);


    songTitle.textContent =
        title;


    songArtist.textContent =
        artist;


    songInfo.style.display =
        "block";


    /*
       ALBUM BLUR
    */

    setAlbumBackground(
        data
    );


    /*
       Find match position.
    */

    let matchPosition = 0;


    if (
        typeof data?.matchPosition ===
        "number"
    ) {

        matchPosition =
            data.matchPosition;

    }

    else if (
        typeof data?.timecode ===
        "number"
    ) {

        matchPosition =
            data.timecode;

    }

    else if (
        typeof data?.song?.matchPosition ===
        "number"
    ) {

        matchPosition =
            data.song.matchPosition;

    }

    else if (
        typeof data?.track?.matchPosition ===
        "number"
    ) {

        matchPosition =
            data.track.matchPosition;

    }


    /* =====================================================
       FIND LYRICS
    ===================================================== */

    const lyricsData =
        data.lyrics ??
        data.syncedLyrics ??
        data.synced_lyrics ??
        data.lyricText ??
        data.lrc ??
        data.lines ??
        data.lyricData ??
        data.lyric_data ??
        "";


    /*
       Display lyrics.
    */

    displayLyrics(
        lyricsData
    );


    /*
       SAVE TO RECENTS
    */

    saveRecentSong({

        title,

        artist,

        lyrics:
            lyricsData,

        artwork:
            getArtwork(data),

        matchPosition

    });


    /*
       Existing sync behavior.
       SYNC_OFFSET remains 4.
    */

    startEstimatedSync(
        matchPosition,
        true
    );


    statusElement.textContent =
        "Song recognized";
}


/* =========================================================
   BUTTON
========================================================= */

button.addEventListener(
    "click",
    recognizeSong
);


/* =========================================================
   STARTUP
========================================================= */

loadRecentSongs();

renderRecentSongs();

</script>
