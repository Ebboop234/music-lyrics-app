<!DOCTYPE html><html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Lyrics"><title>MUSIC Lyrics</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding:
            env(safe-area-inset-top)
            16px
            env(safe-area-inset-bottom)
            16px;

        min-height: 100vh;

        background:
            radial-gradient(
                circle at top,
                #252525 0%,
                #111 45%,
                #080808 100%
            );

        color: white;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Arial,
            sans-serif;

        text-align: center;
        overflow-x: hidden;
    }

    .app {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 28px 0 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #888;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .identify-button {
        width: 92px;
        height: 92px;

        margin: 18px auto 22px;

        border-radius: 50%;
        border: 3px solid white;

        background: rgba(255,255,255,0.04);

        color: white;
        font-size: 48px;
        font-weight: 500;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease;

        -webkit-tap-highlight-color: transparent;
    }

    .identify-button:hover {
        transform: scale(1.05);
    }

    .identify-button:active {
        transform: scale(0.92);
    }

    .identify-button:focus {
        outline: none;
    }

    .identify-button.listening {
        animation: rainbowPulse 1s infinite !important;
    }

    @keyframes rainbowPulse {
        0% {
            transform: scale(1);
            border-color: #ff0000;
            box-shadow:
                0 0 12px #ff0000,
                0 0 25px rgba(255,0,0,0.4);
        }

        16% {
            border-color: #ff7f00;
            box-shadow:
                0 0 18px #ff7f00,
                0 0 35px rgba(255,127,0,0.4);
        }

        33% {
            border-color: #ffff00;
            box-shadow:
                0 0 22px #ffff00,
                0 0 40px rgba(255,255,0,0.4);
        }

        50% {
            transform: scale(1.15);
            border-color: #00ff00;
            box-shadow:
                0 0 28px #00ff00,
                0 0 50px rgba(0,255,0,0.45);
        }

        66% {
            border-color: #00ffff;
            box-shadow:
                0 0 22px #00ffff,
                0 0 40px rgba(0,255,255,0.4);
        }

        83% {
            border-color: #0066ff;
            box-shadow:
                0 0 20px #0066ff,
                0 0 35px rgba(0,102,255,0.4);
        }

        100% {
            transform: scale(1);
            border-color: #ff00ff;
            box-shadow:
                0 0 15px #ff00ff,
                0 0 30px rgba(255,0,255,0.4);
        }
    }

    #status {
        margin: 8px auto 18px;
        min-height: 24px;

        color: #999;

        font-size: 15px;
        line-height: 1.4;

        max-width: 95%;
    }

    #debug {
        display: none;

        margin: 15px auto;
        padding: 12px;

        max-width: 95%;

        background: #1c1c1c;
        border: 1px solid #444;
        border-radius: 12px;

        color: #ff7777;

        font-family: monospace;
        font-size: 12px;

        text-align: left;

        white-space: pre-wrap;
        word-break: break-word;
    }

    #album-art-container {
        width: 180px;
        height: 180px;

        margin: 20px auto 18px;

        display: none;
    }

    #album-art {
        width: 100%;
        height: 100%;

        object-fit: cover;

        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0,0,0,0.5);
    }

    #song {
        margin: 12px auto 20px;

        max-width: 90%;

        font-size: 22px;
        font-weight: 600;

        line-height: 1.35;

        color: white;
    }

    #lyrics {
        margin: 20px auto;

        width: 100%;
        max-width: 700px;

        height: 55vh;
        min-height: 300px;

        overflow-y: auto;

        font-size: 23px;
        line-height: 1.7;

        scroll-behavior: smooth;

        padding:
            80px 8px
            180px 8px;

        scrollbar-width: none;
    }

    #lyrics::-webkit-scrollbar {
        display: none;
    }

    .line {
        opacity: 0.35;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease,
            background 0.25s ease;

        padding: 10px 12px;
        margin: 3px 0;

        cursor: pointer;

        border-radius: 14px;

        -webkit-tap-highlight-color: transparent;
    }

    .line:hover {
        opacity: 0.75;

        background:
            rgba(255,255,255,0.06);
    }

    .line:active {
        transform: scale(0.97);

        background:
            rgba(255,255,255,0.1);
    }

    .current {
        opacity: 1;

        font-size: 32px;
        font-weight: 700;

        color: white;

        background:
            rgba(255,255,255,0.06);

        transform: scale(1.02);
    }

    @media (max-width: 500px) {

        h1 {
            margin-top: 24px;
            font-size: 30px;
        }

        .subtitle {
            font-size: 14px;
        }

        .identify-button {
            width: 88px;
            height: 88px;
            font-size: 46px;
        }

        #album-art-container {
            width: 160px;
            height: 160px;
        }

        #song {
            font-size: 20px;
        }

        #lyrics {
            height: 58vh;
            font-size: 21px;
        }

        .current {
            font-size: 29px;
        }
    }
</style>

</head><body><div class="app"><h1>🎵 Music Lyrics</h1>

<div class="subtitle">
    Identify a song and follow along
</div>

<button
    class="identify-button"
    onclick="identifySong()"
    aria-label="Identify Song"
>
    ?
</button>

<div id="status">
    Tap the button to identify a song
</div>

<div id="debug"></div>

<div id="album-art-container">
    <img
        id="album-art"
        alt="Album artwork"
    >
</div>

<div id="song"></div>

<div id="lyrics"></div>

</div><script>

let lyricLines = [];
let currentIndex = 0;

let syncTimer = null;

/*
 * This is the estimated point in the song
 * where recognition happened.
 */
let songPosition = 0;

/*
 * Small adjustment if recognition is slightly
 * ahead or behind the actual lyrics.
 */
const LYRIC_OFFSET = 0;


/* =========================================
   DEBUG
========================================= */

function showDebug(message) {

    const debug =
        document.getElementById("debug");

    debug.style.display = "block";

    debug.innerText = message;

    console.error(message);
}


/* =========================================
   IDENTIFY SONG
========================================= */

async function identifySong() {

    const button =
        document.querySelector(
            ".identify-button"
        );

    const status =
        document.getElementById(
            "status"
        );

    const songDisplay =
        document.getElementById(
            "song"
        );

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );

    const albumArtContainer =
        document.getElementById(
            "album-art-container"
        );

    const albumArt =
        document.getElementById(
            "album-art"
        );

    document.getElementById(
        "debug"
    ).style.display = "none";

    clearInterval(syncTimer);

    lyricLines = [];

    currentIndex = 0;

    button.classList.add("listening");

    status.innerText =
        "🎧 Listening for 8 seconds...";

    songDisplay.innerText = "";

    lyricsDisplay.innerHTML = "";

    albumArtContainer.style.display =
        "none";

    albumArt.src = "";


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone is not supported."
            );
        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        }

        else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";
        }


        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                )
                : new MediaRecorder(
                    stream
                );


        const audioChunks = [];


        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        recorder.onerror =
            event => {

                console.error(
                    "Recorder error:",
                    event
                );
            };


        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                button.classList.remove(
                    "listening"
                );


                status.innerText =
                    "🔎 Preparing audio...";


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder.mimeType
                        }
                    );


                if (
                    audioBlob.size === 0
                ) {

                    status.innerText =
                        "❌ No audio recorded.";

                    return;
                }


                const formData =
                    new FormData();


                formData.append(
                    "audio",
                    audioBlob,
                    "music.webm"
                );


                status.innerText =
                    "📤 Identifying song...";


                try {

                    const response =
                        await fetch(
                            "/identify-shazam",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const responseText =
                        await response.text();


                    let data;


                    try {

                        data =
                            JSON.parse(
                                responseText
                            );

                    }

                    catch {

                        showDebug(
                            "SERVER RESPONSE:\n\n" +
                            responseText
                        );

                        status.innerText =
                            "❌ Server returned invalid data.";

                        return;
                    }


                    if (!response.ok) {

                        showDebug(
                            JSON.stringify(
                                data,
                                null,
                                2
                            )
                        );

                        status.innerText =
                            "❌ " +
                            (
                                data.error ||
                                "Server error."
                            );

                        return;
                    }


                    if (!data.song) {

                        status.innerText =
                            "❌ Song information was not returned.";

                        return;
                    }


                    /*
                     * SHOW SONG
                     */

                    songDisplay.innerText =
                        data.song.title +
                        " — " +
                        data.song.artist;


                    /*
                     * SHOW ALBUM ART
                     */

                    if (
                        data.song.artwork
                    ) {

                        albumArt.src =
                            data.song.artwork;

                        albumArt.onload =
                            () => {

                                albumArtContainer
                                    .style
                                    .display =
                                    "block";
                            };
                    }


                    /*
                     * GET RECOGNITION POSITION
                     *
                     * Accept several names so this
                     * works with different versions
                     * of your server.
                     */

                    songPosition =
                        Number(
                            data.song.matchPosition ??
                            data.song.matchOffset ??
                            data.song.timecode ??
                            0
                        );


                    if (
                        !Number.isFinite(
                            songPosition
                        )
                    ) {

                        songPosition = 0;
                    }


                    songPosition +=
                        LYRIC_OFFSET;


                    console.log(
                        "Song position:",
                        songPosition
                    );


                    /*
                     * GET LYRICS
                     */

                    if (
                        !data.lyrics
                    ) {

                        status.innerText =
                            "⚠️ No lyrics found.";

                        return;
                    }


                    /*
                     * THE IMPORTANT PART:
                     *
                     * Look for syncedLyrics first.
                     */

                    let syncedLyrics =
                        data.lyrics.syncedLyrics;


                    /*
                     * Some servers return the
                     * synchronized text directly.
                     */

                    if (
                        !syncedLyrics &&
                        typeof data.lyrics === "string"
                    ) {

                        syncedLyrics =
                            data.lyrics;
                    }


                    if (
                        !syncedLyrics
                    ) {

                        status.innerText =
                            "⚠️ Lyrics were found, but no timestamps were available.";

                        return;
                    }


                    /*
                     * PARSE SYNCHRONIZED LYRICS
                     */

                    const success =
                        parseLyrics(
                            syncedLyrics
                        );


                    if (!success) {

                        showDebug(
                            "Lyrics were received, but no timestamped lines could be found.\n\n" +
                            syncedLyrics.substring(
                                0,
                                3000
                            )
                        );

                        status.innerText =
                            "⚠️ Could not read lyric timestamps.";

                        return;
                    }


                    /*
                     * FIND THE LYRIC THAT
                     * MATCHES THE RECOGNITION
                     * POSITION.
                     */

                    currentIndex =
                        findCurrentLyric(
                            songPosition
                        );


                    updateCurrentLine(
                        songPosition
                    );


                    status.innerText =
                        "🎵 Synced!";


                    /*
                     * START AUTOMATIC
                     * SYNCHRONIZATION
                     */

                    startSynchronization();

                }

                catch (error) {

                    console.error(error);

                    showDebug(
                        "CONNECTION ERROR\n\n" +
                        error.message
                    );

                    status.innerText =
                        "❌ " +
                        error.message;
                }
            };


        recorder.start();


        setTimeout(
            () => {

                if (
                    recorder.state ===
                    "recording"
                ) {

                    recorder.stop();
                }

            },
            8000
        );

    }

    catch (error) {

        button.classList.remove(
            "listening"
        );

        showDebug(
            "MICROPHONE ERROR\n\n" +
            error.message
        );

        status.innerText =
            "❌ " +
            error.message;
    }
}


/* =========================================
   PARSE SYNCHRONIZED LYRICS
========================================= */

function parseLyrics(text) {

    lyricLines = [];


    if (
        !text ||
        typeof text !== "string"
    ) {

        return false;
    }


    /*
     * IMPORTANT FIX
     *
     * We do NOT use split("\n").
     *
     * Instead, this regex searches the
     * ENTIRE string for every timestamp.
     *
     * Therefore these BOTH work:
     *
     * [00:01.00]Hello
     * [00:04.00]World
     *
     * AND:
     *
     * [00:01.00]Hello[00:04.00]World
     */

    const regex =
        /(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\s*([\s\S]*?)(?=\d{1,3}:\d{2}(?:[.:]\d{1,3})?|$)/g;


    let match;


    while (
        (match = regex.exec(text)) !== null
    ) {

        const minutes =
            parseInt(
                match[1],
                10
            );


        const seconds =
            parseInt(
                match[2],
                10
            );


        let fraction =
            match[3] || "0";


        /*
         * Convert milliseconds correctly.
         *
         * .5   = 500 ms
         * .50  = 500 ms
         * .500 = 500 ms
         */

        if (
            fraction.length === 1
        ) {

            fraction += "00";

        }

        else if (
            fraction.length === 2
        ) {

            fraction += "0";
        }


        const milliseconds =
            parseInt(
                fraction,
                10
            );


        const time =
            minutes * 60 +
            seconds +
            milliseconds / 1000;


        let lyricText =
            match[4]
                .replace(
                    /\r?\n/g,
                    " "
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        /*
         * Remove accidental leading
         * metadata/title.
         */

        if (
            lyricText === ""
        ) {

            continue;
        }


        /*
         * Ignore obvious metadata.
         */

        if (
            lyricText.toLowerCase() ===
                "counting stars - onerepublic"
        ) {

            continue;
        }


        lyricLines.push({
            time: time,
            text: lyricText
        });
    }


    /*
     * Sort by timestamp.
     */

    lyricLines.sort(
        (a, b) =>
            a.time - b.time
    );


    /*
     * Remove duplicate timestamps/text.
     */

    const cleaned = [];

    for (
        const line of lyricLines
    ) {

        const previous =
            cleaned[
                cleaned.length - 1
            ];


        if (
            previous &&
            previous.time === line.time &&
            previous.text === line.text
        ) {

            continue;
        }


        cleaned.push(line);
    }


    lyricLines = cleaned;


    console.log(
        "Parsed lyric lines:",
        lyricLines.length
    );


    if (
        lyricLines.length === 0
    ) {

        return false;
    }


    showLyrics();

    return true;
}


/* =========================================
   FIND CURRENT LYRIC
========================================= */

function findCurrentLyric(time) {

    if (
        lyricLines.length === 0
    ) {

        return 0;
    }


    let index = 0;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            lyricLines[i].time <= time
        ) {

            index = i;

        }

        else {

            break;
        }
    }


    return index;
}


/* =========================================
   SHOW LYRICS
========================================= */

function showLyrics() {

    const lyricsDisplay =
        document.getElementById(
            "lyrics"
        );


    lyricsDisplay.innerHTML = "";


    lyricLines.forEach(
        (
            line,
            index
        ) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "line";


            /*
             * ONLY SHOW THE WORDS.
             *
             * Timestamp is never displayed.
             */

            div.innerText =
                line.text;


            /*
             * Allow tapping a lyric to
             * manually synchronize.
             */

            div.onclick =
                () => {

                    syncToLyric(
                        index
                    );
                };


            lyricsDisplay.appendChild(
                div
            );
        }
    );
}


/* =========================================
   TAP LYRIC
========================================= */

function syncToLyric(index) {

    if (
        !lyricLines[index]
    ) {

        return;
    }


    currentIndex =
        index;


    songPosition =
        lyricLines[index].time;


    clearInterval(
        syncTimer
    );


    updateCurrentLine(
        songPosition
    );


    startSynchronization();


    document.getElementById(
        "status"
    ).innerText =
        "🔄 Synced";
}


/* =========================================
   AUTOMATIC SYNCHRONIZATION
========================================= */

function startSynchronization() {

    clearInterval(
        syncTimer
    );


    const startingPosition =
        songPosition;


    const startTime =
        Date.now();


    syncTimer =
        setInterval(
            () => {

                const elapsed =
                    (
                        Date.now() -
                        startTime
                    ) / 1000;


                const currentTime =
                    startingPosition +
                    elapsed;


                updateCurrentLine(
                    currentTime
                );

            },
            100
        );
}


/* =========================================
   UPDATE CURRENT LINE
========================================= */

function updateCurrentLine(time) {

    if (
        lyricLines.length === 0
    ) {

        return;
    }


    const newIndex =
        findCurrentLyric(
            time
        );


    /*
     * Only update the DOM when the
     * highlighted lyric actually changes.
     */

    if (
        newIndex === currentIndex &&
        document.querySelector(
            ".line.current"
        )
    ) {

        return;
    }


    currentIndex =
        newIndex;


    const elements =
        document.querySelectorAll(
            ".line"
        );


    elements.forEach(
        (
            element,
            index
        ) => {

            if (
                index === currentIndex
            ) {

                element.className =
                    "line current";


                element.scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            }

            else {

                element.className =
                    "line";
            }
        }
    );
}

</script></body>
</html>
