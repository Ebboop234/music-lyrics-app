
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MUSIC Lyrics">

    <title>MUSIC Lyrics</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont,
                "SF Pro Display", "SF Pro Text", Arial, sans-serif;
            color: white;
        }

        body {
            position: relative;
        }

        /* BACKGROUND */

        #albumBackground {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #albumOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.78),
                rgba(0,0,0,0.48) 45%,
                rgba(0,0,0,0.85)
            );
            z-index: 1;
            pointer-events: none;
        }

        /* APP */

        .app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            z-index: 2;
        }

        /* HEADER */

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 115px;
            padding: max(20px, env(safe-area-inset-top))
                     20px 10px;
            text-align: center;
            z-index: 20;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.7),
                rgba(0,0,0,0)
            );
        }

        .title {
            margin-top: 12px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* SCREENS */

        .screen {
            display: none;
            position: absolute;
            inset: 115px 0 145px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* HOME */

        #homeScreen {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #homeScreen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .homeIcon {
            width: 112px;
            height: 112px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            font-weight: 800;
            background: linear-gradient(
                135deg,
                #ff0055,
                #ff7a00,
                #ffe600,
                #00e676,
                #00b8ff,
                #6c4cff,
                #ff00c8
            );
            box-shadow: 0 0 35px rgba(255,255,255,0.2);
            margin-bottom: 28px;
        }

        .homeHeading {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .homeDescription {
            font-size: 15px;
            opacity: 0.65;
            margin-top: 10px;
            line-height: 1.6;
            max-width: 280px;
        }

        .homeHint {
            margin-top: 28px;
            font-size: 12px;
            opacity: 0.45;
        }

        /* LYRICS SCREEN */

        #lyricsScreen {
            padding: 0 20px;
            text-align: center;
        }

        #songInfo {
            display: none;
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 15px 12px 16px;
            margin: 0 -20px;
            text-align: center;
            background: rgba(12,12,12,0.82);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        #songTitle {
            font-size: 21px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #songArtist {
            margin-top: 4px;
            font-size: 14px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #lyricsContainer {
            padding: 25px 5px 150px;
            text-align: center;
        }

        .lyric-line {
            padding: 9px 0;
            font-size: 21px;
            line-height: 1.35;
            font-weight: 600;
            opacity: 0.42;
            transition: opacity 0.25s ease,
                        transform 0.25s ease,
                        font-size 0.25s ease;
            cursor: pointer;
        }

        .lyric-line.active {
            opacity: 1;
            font-size: 25px;
            transform: scale(1.03);
        }

        /* RECENTS SCREEN */

        #recentsScreen {
            padding: 15px 18px 30px;
        }

        .recentHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .recentHeader h2 {
            margin: 0;
            font-size: 25px;
        }

        .recentCount {
            font-size: 12px;
            opacity: 0.55;
        }

        #recentList {
            padding-bottom: 25px;
        }

        .recentItem {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 14px;
            background: rgba(255,255,255,0.09);
            cursor: pointer;
        }

        .recentItem:active {
            transform: scale(0.98);
        }

        .recentArtwork {
            width: 58px;
            height: 58px;
            border-radius: 9px;
            object-fit: cover;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .recentText {
            min-width: 0;
            flex: 1;
        }

        .recentTitle {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recentArtist {
            margin-top: 3px;
            font-size: 13px;
            opacity: 0.65;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recentTime {
            margin-top: 4px;
            font-size: 11px;
            opacity: 0.45;
        }

        .recentDelete {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.8);
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .recentDelete:active {
            background: rgba(255,59,48,0.7);
            color: white;
        }

        .emptyRecent {
            text-align: center;
            margin-top: 65px;
            opacity: 0.55;
            font-size: 15px;
            line-height: 1.6;
        }

        /* STATUS */

        #status {
            position: absolute;
            left: 15px;
            right: 15px;
            top: calc(50% + 95px);
            bottom: auto;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            z-index: 15;
            pointer-events: none;
        }

        /* RECOGNIZE BUTTON */

        #recognizeButton {
            position: fixed;
            top: 50%;
            left: 50%;
            bottom: auto;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                #ff0055,
                #ff7a00,
                #ffe600,
                #00e676,
                #00b8ff,
                #6c4cff,
                #ff00c8
            );
            color: white;
            font-size: 76px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 25px rgba(255,255,255,0.5);
            animation: rainbow 4s linear infinite,
                       pulse 1.5s ease-in-out infinite;
        }

        #recognizeButton::before {
            content: "♫";
        }

        #recognizeButton:active {
            animation: none;
            transform: translate(-50%, -50%) scale(0.92);
        }

        #recognizeButton:disabled {
            opacity: 0.7;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 10px rgba(255,255,255,0.4);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                box-shadow: 0 0 30px rgba(255,255,255,0.9);
            }
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        #recognizeButton.listening {
            animation: rainbow 2s linear infinite,
                       listeningPulse 0.9s ease-in-out infinite;
        }

        /* Expanding sound rings appear only while the microphone listens. */
        #recognizeButton.listening::after {
            content: "";
            position: absolute;
            inset: -15px;
            border: 2px solid rgba(120, 210, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: soundRing 1.8s ease-out infinite;
        }

        @keyframes soundRing {
            0% {
                transform: scale(0.88);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.55);
                opacity: 0;
            }
        }

        @keyframes listeningPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.12);
            }
        }

        /* Small animated sound-wave indicator below the status text. */
        #status.listening {
            opacity: 1;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        #status.listening::after {
            content: "▂ ▄ ▆ ▄ ▂";
            display: block;
            margin: 10px auto 0;
            width: max-content;
            font-size: 21px;
            letter-spacing: 3px;
            line-height: 1;
            color: #9bdcff;
            text-shadow: 0 0 12px rgba(80, 190, 255, 0.75);
            animation: waveBounce 0.75s ease-in-out infinite alternate;
        }

        @keyframes waveBounce {
            from {
                transform: scaleY(0.72);
                opacity: 0.65;
            }
            to {
                transform: scaleY(1.15);
                opacity: 1;
            }
        }

        /* SEPARATE CIRCULAR BOTTOM NAVIGATION */

        #tabBar {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 92vw);
            height: 76px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            background: transparent;
            border: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            z-index: 4000;
        }

        .tabButton {
            flex: 0 0 68px;
            height: 76px;
            padding: 0;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.58);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .tabIcon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            background: rgba(18,18,18,0.78);
            border: 1px solid rgba(255,255,255,0.13);
            box-shadow: 0 5px 18px rgba(0,0,0,0.22);
            transition: background 0.2s ease, border-color 0.2s ease,
                        transform 0.2s ease;
        }

        .tabButton.active {
            color: white;
        }

        .tabButton.active .tabIcon {
            background: rgba(255,255,255,0.19);
            border-color: rgba(255,255,255,0.48);
            box-shadow: 0 0 18px rgba(255,255,255,0.16);
            transform: translateY(-2px);
        }

        .tabButton:active .tabIcon {
            transform: scale(0.92);
        }

        /* On Lyrics, use the song information as the top header. */
        .app.lyrics-view .header {
            display: none;
        }

        .app.lyrics-view #lyricsScreen {
            top: 0;
            bottom: 112px;
        }

        .app.lyrics-view #songInfo {
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: 18px;
            background: linear-gradient(
                to bottom,
                rgba(8,8,8,0.72),
                rgba(8,8,8,0.22)
            );
            border-bottom: none;
        }

        /* SMALL SCREENS */

        @media (max-height: 650px) {
            .homeIcon {
                width: 85px;
                height: 85px;
                font-size: 52px;
                margin-bottom: 18px;
            }

            .homeHeading {
                font-size: 24px;
            }

            .homeHint {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <canvas id="albumBackground" width="32" height="32"></canvas>
    <div id="albumOverlay"></div>

    <div class="app">

        <header class="header">
            <div class="title">MUSIC Lyrics</div>
            <div class="subtitle" id="subtitle">Discover what's playing</div>
        </header>

        <!-- HOME SCREEN -->

        <section id="homeScreen" class="screen active">
        </section>

        <!-- LYRICS SCREEN -->

        <section id="lyricsScreen" class="screen">

            <div id="songInfo">
                <div id="songTitle"></div>
                <div id="songArtist"></div>
            </div>

            <div id="lyricsContainer"></div>

        </section>

        <!-- RECENTS SCREEN -->

        <section id="recentsScreen" class="screen">

            <div class="recentHeader">
                <h2>Recent Songs</h2>
                <span class="recentCount" id="recentCount"></span>
            </div>

            <div id="recentList"></div>

        </section>

        <div id="status">Ready</div>

        <button id="recognizeButton"
                aria-label="Recognize song"
                type="button">
        </button>

    </div>

    <!-- BOTTOM NAVIGATION -->

    <nav id="tabBar">

        <button class="tabButton active"
                id="homeTab"
                type="button">

            <span class="tabIcon">⌂</span>
            <span>Home</span>

        </button>

        <button class="tabButton"
                id="lyricsTab"
                type="button">
            <span class="tabIcon">♫</span>
            <span>Lyrics</span>
        </button>

        <button class="tabButton"
                id="recentsTab"
                type="button">

            <span class="tabIcon">◷</span>
            <span>Recents</span>

        </button>

    </nav>

    <script>

        /* ELEMENTS */

        const app = document.querySelector(".app");
        const button = document.getElementById("recognizeButton");
        const lyricsContainer = document.getElementById("lyricsContainer");
        const statusElement = document.getElementById("status");

        const songInfo = document.getElementById("songInfo");
        const songTitle = document.getElementById("songTitle");
        const songArtist = document.getElementById("songArtist");

        const albumBackground = document.getElementById("albumBackground");

        const homeScreen = document.getElementById("homeScreen");
        const lyricsScreen = document.getElementById("lyricsScreen");
        const recentsScreen = document.getElementById("recentsScreen");

        const homeTab = document.getElementById("homeTab");
        const recentsTab = document.getElementById("recentsTab");
        const lyricsTab = document.getElementById("lyricsTab");

        const recentList = document.getElementById("recentList");
        const recentCount = document.getElementById("recentCount");
        const subtitle = document.getElementById("subtitle");


        /* SETTINGS */

        const SYNC_OFFSET = 4;
        const RECENT_STORAGE_KEY = "musicLyricsRecentSongs";
        const MAX_RECENT = 20;

        /* STATE */

        let lyricLines = [];
        let currentIndex = -1;
        let recognitionTimer = null;
        let audioStartTime = 0;
        let currentView = "home";
        let currentSong = null;
        let isRecognizing = false;

        /* NAVIGATION */

        function showScreen(view) {

            currentView = view;
            app.classList.toggle("lyrics-view", view === "lyrics");

            homeScreen.classList.remove("active");
            lyricsScreen.classList.remove("active");
            recentsScreen.classList.remove("active");

            homeTab.classList.remove("active");
            lyricsTab.classList.remove("active");
            recentsTab.classList.remove("active");

            if (view === "home") {
                homeScreen.classList.add("active");
                homeTab.classList.add("active");
                subtitle.textContent = "Discover what's playing";
                button.style.display = "flex";
                statusElement.style.display = "block";

                // Keep Home clean: remove the previous song title
                // and clear the album artwork background.
                clearBackground();
                statusElement.textContent = "Ready";

            } else if (view === "lyrics") {
                lyricsScreen.classList.add("active");
                lyricsTab.classList.add("active");
                subtitle.textContent = "";
                button.style.display = "none";
                statusElement.style.display = "none";

            } else if (view === "recents") {
                recentsScreen.classList.add("active");
                recentsTab.classList.add("active");
                subtitle.textContent = "Your listening history";
                button.style.display = "none";
                statusElement.style.display = "none";
                renderRecentSongs();
            }
        }

        homeTab.addEventListener("click", () => showScreen("home"));

        lyricsTab.addEventListener("click", () => {
            if (currentSong) showScreen("lyrics");
            else showScreen("home");
        });

        recentsTab.addEventListener("click", () => showScreen("recents"));

        /* LYRIC DATA */

        function lyricDataToString(data) {

            if (!data) return "";

            if (typeof data === "string") {
                return data;
            }

            if (Array.isArray(data)) {
                return data.map(item => {

                    if (typeof item === "string") return item;
                    if (item.text) return item.text;
                    if (item.lyric) return item.lyric;

                    return "";

                }).join("\n");
            }

            if (typeof data === "object") {

                if (data.text) return data.text;
                if (data.lyrics) return lyricDataToString(data.lyrics);
                if (data.lines) return lyricDataToString(data.lines);
                if (data.syncedLyrics) return data.syncedLyrics;
                if (data.synced_lyrics) return data.synced_lyrics;
            }

            return "";
        }

        /* PARSE LRC */

        function parseLRC(lrc) {

            const lines = [];

            if (!lrc) return lines;

            const regex = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

            for (const rawLine of lrc.split("\n")) {

                const matches = [...rawLine.matchAll(regex)];

                const text = rawLine.replace(regex, "").trim();

                if (!text || !matches.length) continue;

                for (const match of matches) {

                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);

                    let fraction = 0;

                    if (match[3]) {
                        fraction = parseInt(match[3], 10) /
                            Math.pow(10, match[3].length);
                    }

                    lines.push({
                        time: minutes * 60 + seconds + fraction,
                        text
                    });
                }
            }

            lines.sort((a, b) => a.time - b.time);

            return lines;
        }

        /* DISPLAY LYRICS */

        function displayLyrics(lyrics) {

            lyricsContainer.innerHTML = "";
            lyricLines = [];
            currentIndex = -1;

            const lyricText = lyricDataToString(lyrics);

            if (!lyricText) {

                const empty = document.createElement("div");
                empty.className = "lyric-line";
                empty.textContent = "Lyrics not found";

                lyricsContainer.appendChild(empty);
                return;
            }

            lyricLines = parseLRC(lyricText);

            if (lyricLines.length === 0) {

                const plainLines = lyricText
                    .split("\n")
                    .map(x => x.trim())
                    .filter(Boolean);

                lyricLines = plainLines.map(text => ({
                    time: 0,
                    text
                }));
            }

            lyricLines.forEach((line, index) => {

                const element = document.createElement("div");

                element.className = "lyric-line";
                element.textContent = line.text;
                element.dataset.index = index;

                element.addEventListener("click", () => {
                    startEstimatedSync(line.time, false);
                });

                lyricsContainer.appendChild(element);
            });
        }

        /* UPDATE ACTIVE LYRIC */

        function updateActiveLyric(time) {

            if (!lyricLines.length) return;

            let index = 0;

            for (let i = 0; i < lyricLines.length; i++) {

                if (lyricLines[i].time <= time) {
                    index = i;
                } else {
                    break;
                }
            }

            if (index === currentIndex) return;

            currentIndex = index;

            const elements = lyricsContainer.querySelectorAll(".lyric-line");

            elements.forEach((element, i) => {
                element.classList.toggle("active", i === currentIndex);
            });

            const active = elements[currentIndex];

            if (active) {
                active.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }
        }

        /* ESTIMATED SYNC */

        function startEstimatedSync(startAt = 0, applyOffset = true) {

            stopEstimatedSync();

            const offset = applyOffset ? SYNC_OFFSET : 0;

            audioStartTime =
                Date.now() / 1000 - startAt - offset;

            recognitionTimer = setInterval(() => {

                const elapsed = Date.now() / 1000 - audioStartTime;

                updateActiveLyric(elapsed);

            }, 100);
        }

        function stopEstimatedSync() {

            if (recognitionTimer) {
                clearInterval(recognitionTimer);
                recognitionTimer = null;
            }
        }

        /* SAFE SONG INFO */

        function getSafeTitle(data) {

            return data?.title ||
                data?.song?.title ||
                data?.track?.title ||
                "Unknown Song";
        }

        function getSafeArtist(data) {

            return data?.artist ||
                data?.artistName ||
                data?.song?.artist ||
                data?.song?.subtitle ||
                data?.track?.artist ||
                "Unknown Artist";
        }

        /* ARTWORK */

        function getArtwork(data) {

            const possibleImages = [

                data?.song?.images?.background,
                data?.song?.images?.coverarthq,
                data?.song?.images?.coverart,
                data?.song?.artwork,
                data?.artwork,
                data?.coverart,
                data?.coverArt,
                data?.image,
                data?.song?.share?.image,
                data?.share?.image,
                data?.track?.images?.coverart

            ];

            for (const image of possibleImages) {

                if (
                    typeof image === "string" &&
                    image.startsWith("http")
                ) {
                    return image;
                }
            }

            return "";
        }

        /* ALBUM BACKGROUND */

        let backgroundRequest = 0;

        function clearBackground() {

            backgroundRequest++;
            albumBackground.style.opacity = "0";
        }

        function showBackground(url) {

            if (!url) {
                clearBackground();
                return;
            }

            url = url.replace(/^http:\/\//i, "https://");

            const request = ++backgroundRequest;
            const img = new Image();

            img.onload = () => {

                if (request !== backgroundRequest) return;

                const size = albumBackground.width;
                const ctx = albumBackground.getContext("2d");

                const screenRatio = window.innerWidth / window.innerHeight;

                let sw = img.naturalWidth;
                let sh = img.naturalHeight;

                if (sw / sh > screenRatio) {
                    sw = sh * screenRatio;
                } else {
                    sh = sw / screenRatio;
                }

                const sx = (img.naturalWidth - sw) / 2;
                const sy = (img.naturalHeight - sh) / 2;

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";

                ctx.clearRect(0, 0, size, size);

                ctx.drawImage(
                    img,
                    sx, sy, sw, sh,
                    0, 0, size, size
                );

                albumBackground.style.opacity = "1";
            };

            img.onerror = () => {

                if (request === backgroundRequest) {
                    albumBackground.style.opacity = "0";
                }
            };

            img.src = url;
        }

        function setAlbumBackground(data) {
            showBackground(getArtwork(data));
        }

        /* RECENT SONGS */

        function getRecentSongs() {

            try {

                const saved = JSON.parse(
                    localStorage.getItem(RECENT_STORAGE_KEY) || "[]"
                );

                return Array.isArray(saved) ? saved : [];

            } catch (error) {

                console.error("Could not load recents:", error);
                return [];
            }
        }

        function saveRecentSong(data, recognizedLyrics) {

            const title = getSafeTitle(data);
            const artist = getSafeArtist(data);
            const artwork = getArtwork(data);

            // Save the lyrics passed into the recognition screen too.
            // This makes sure lyrics are stored even when the recognition
            // response itself does not contain a lyrics field.
            const lyrics = lyricDataToString(
                recognizedLyrics ||
                data?.lyrics ||
                data?.syncedLyrics ||
                data?.synced_lyrics ||
                data?.lyricText ||
                data?.lrc ||
                data?.lines ||
                data?.lyricData ||
                data?.lyric_data
            );

            const matchPosition = Number(
                data?.matchPosition ??
                data?.timecode ??
                data?.song?.matchPosition ??
                0
            );

            let recent = getRecentSongs();

            recent = recent.filter(song =>
                !(song.title === title && song.artist === artist)
            );

            recent.unshift({
                title,
                artist,
                lyrics,
                artwork,
                matchPosition,
                savedAt: Date.now()
            });

            recent = recent.slice(0, MAX_RECENT);

            try {

                localStorage.setItem(
                    RECENT_STORAGE_KEY,
                    JSON.stringify(recent)
                );

            } catch (error) {

                console.error("Could not save recent song:", error);
            }

            renderRecentSongs();
        }

        /* DELETE RECENT */

        function deleteRecentSong(song) {

            const recent = getRecentSongs().filter(saved =>
                !(saved.title === song.title && saved.artist === song.artist)
            );

            try {

                localStorage.setItem(
                    RECENT_STORAGE_KEY,
                    JSON.stringify(recent)
                );

            } catch (error) {

                console.error("Could not delete recent song:", error);
            }

            renderRecentSongs();
        }

        /* RELATIVE TIME */

        function relativeTime(timestamp) {

            const seconds = Math.floor(
                (Date.now() - timestamp) / 1000
            );

            if (seconds < 60) return "Just now";

            const minutes = Math.floor(seconds / 60);

            if (minutes < 60) {
                return minutes + (minutes === 1
                    ? " minute ago"
                    : " minutes ago");
            }

            const hours = Math.floor(minutes / 60);

            if (hours < 24) {
                return hours + (hours === 1
                    ? " hour ago"
                    : " hours ago");
            }

            const days = Math.floor(hours / 24);

            return days + (days === 1
                ? " day ago"
                : " days ago");
        }

        /* ESCAPE HTML */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* RENDER RECENTS */

        function renderRecentSongs() {

            const recent = getRecentSongs();

            recentList.innerHTML = "";

            recentCount.textContent = recent.length
                ? recent.length + (recent.length === 1 ? " song" : " songs")
                : "";

            if (!recent.length) {

                const empty = document.createElement("div");

                empty.className = "emptyRecent";
                empty.textContent =
                    "No recent songs yet. Songs you identify will appear here.";

                recentList.appendChild(empty);
                return;
            }

            recent.forEach(song => {

                const item = document.createElement("div");
                item.className = "recentItem";

                const artwork = document.createElement("img");
                artwork.className = "recentArtwork";
                artwork.alt = "";

                if (song.artwork) {
                    artwork.src = song.artwork;
                } else {
                    artwork.style.display = "none";
                }

                const text = document.createElement("div");
                text.className = "recentText";

                const title = document.createElement("div");
                title.className = "recentTitle";
                title.textContent = song.title || "Unknown Song";

                const artist = document.createElement("div");
                artist.className = "recentArtist";
                artist.textContent = song.artist || "Unknown Artist";

                const time = document.createElement("div");
                time.className = "recentTime";
                time.textContent = relativeTime(song.savedAt || Date.now());

                text.appendChild(title);
                text.appendChild(artist);
                text.appendChild(time);

                const deleteButton = document.createElement("button");

                deleteButton.className = "recentDelete";
                deleteButton.type = "button";
                deleteButton.textContent = "×";
                deleteButton.setAttribute(
                    "aria-label",
                    "Delete " + (song.title || "song")
                );

                deleteButton.addEventListener("click", event => {

                    event.stopPropagation();
                    deleteRecentSong(song);
                });

                item.appendChild(artwork);
                item.appendChild(text);
                item.appendChild(deleteButton);

                item.addEventListener("click", () => {
                    loadRecentSong(song);
                });

                recentList.appendChild(item);
            });
        }

        /* LOAD RECENT SONG */

        function loadRecentSong(song) {

            stopEstimatedSync();

            currentSong = song;

            songTitle.textContent = song.title || "Unknown Song";
            songArtist.textContent = song.artist || "Unknown Artist";

            songInfo.style.display = "block";

            displayLyrics(song.lyrics || "");

            showBackground(song.artwork || "");

            statusElement.textContent =
                "Loaded from Recents";

            showScreen("lyrics");

            startEstimatedSync(
                Number(song.matchPosition || 0),
                false
            );
        }

        /* SHOW RECOGNIZED SONG */

        function showRecognizedSong(data, lyrics, matchPosition, listenStartedAt) {

            const title = getSafeTitle(data);
            const artist = getSafeArtist(data);
            const artwork = getArtwork(data);

            currentSong = {
                title,
                artist,
                lyrics: lyricDataToString(lyrics),
                artwork,
                matchPosition,
                savedAt: Date.now()
            };

            songTitle.textContent = title;
            songArtist.textContent = artist;

            songInfo.style.display = "block";

            setAlbumBackground(data);
            displayLyrics(lyrics);

            // Save the actual lyrics that were retrieved for this song.
            saveRecentSong(data, lyrics);

            statusElement.textContent = title + " • " + artist;

            showScreen("lyrics");

            // Measure the time from the start of recording through
            // recognition and lyrics retrieval for better synchronization.
            const delay = listenStartedAt
                ? (Date.now() - listenStartedAt) / 1000
                : SYNC_OFFSET + 8;

            startEstimatedSync(matchPosition + delay, false);
        }

        /* RECOGNIZE SONG */

        async function recognizeSong() {

            if (isRecognizing) return;

            isRecognizing = true;

            try {

                button.classList.add("listening");
                statusElement.classList.add("listening");
                button.disabled = true;

                statusElement.textContent = "Listening...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                let listenStartedAt = 0;

                mediaRecorder.ondataavailable = event => {

                    if (event.data && event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                mediaRecorder.onerror = event => {
                    console.error("Recorder error:", event);
                };

                mediaRecorder.onstop = async () => {

                    stream.getTracks().forEach(track => track.stop());

                    const blob = new Blob(chunks, {
                        type: "audio/webm"
                    });

                    await sendAudio(blob, listenStartedAt);
                };

                listenStartedAt = Date.now();

                mediaRecorder.start();

                setTimeout(() => {

                    if (mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }

                }, 8000);

            } catch (error) {

                console.error(error);

                button.classList.remove("listening");
                statusElement.classList.remove("listening");
                button.disabled = false;
                isRecognizing = false;

                statusElement.textContent =
                    "Microphone permission denied";
            }
        }

        /* SEND AUDIO */

        async function sendAudio(blob, listenStartedAt) {

            // The microphone has stopped recording; switch from the
            // listening animation to the identification status.
            button.classList.remove("listening");
            statusElement.classList.remove("listening");

            try {

                statusElement.textContent = "Identifying...";

                const formData = new FormData();

                formData.append(
                    "audio",
                    blob,
                    "recording.webm"
                );

                const response = await fetch(
                    "/identify-shazam",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        "Server returned " + response.status
                    );
                }

                const data = await response.json();

                console.log("Shazam response:", data);

                const lyrics =
                    data.lyrics ||
                    data.syncedLyrics ||
                    data.synced_lyrics ||
                    data.lyricText ||
                    data.lrc ||
                    data.lines ||
                    data.lyricData ||
                    data.lyric_data ||
                    "";

                const matchPosition = Number(
                    data.matchPosition ??
                    data.timecode ??
                    data.song?.matchPosition ??
                    0
                );

                showRecognizedSong(
                    data,
                    lyrics,
                    matchPosition,
                    listenStartedAt
                );

            } catch (error) {

                console.error("Recognition error:", error);

                statusElement.textContent =
                    "Could not recognize song. Try again.";

            } finally {

                button.classList.remove("listening");
                statusElement.classList.remove("listening");
                button.disabled = false;
                isRecognizing = false;
            }
        }

        /* BUTTON */

        button.addEventListener("click", recognizeSong);

        /* INITIALIZE */

        renderRecentSongs();
        showScreen("home");

    </script>

</body>
</html>
